name: Daily YouTube Analytics Fetch

on:
  schedule:
    # 3時間おきに実行（JST 3/6/9/12/15/18/21/24時ごろ）。投稿計画シートの変更も最大3時間で反映される
    - cron: "0 */3 * * *"
  workflow_dispatch:  # 手動実行も可能
  push:
    paths:
      - "trigger.txt"  # trigger.txt の変更push = 即時更新の合図（Claude経由の「今すぐ更新」用）

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # data.json をコミット・プッシュするために必要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch YouTube data
        env:
          YOUTUBE_API_KEY:     ${{ secrets.YOUTUBE_API_KEY }}
          REFRESH_TOKEN:       ${{ secrets.REFRESH_TOKEN }}
          OAUTH_CLIENT_ID:     ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: python fetch.py

      # 運営ログ（非公開スプレッドシート）→ ops.json
      # 既存の REFRESH_TOKEN とは別のトークンを使う。ここが失敗しても
      # data.json の更新は止めない（continue-on-error）。
      # SHEETS_REFRESH_TOKEN が未設定のときは何もせず正常終了する。
      - name: 運営ログを反映（ops.json）
        continue-on-error: true
        env:
          SHEETS_REFRESH_TOKEN:  ${{ secrets.SHEETS_REFRESH_TOKEN }}
          SHEETS_CLIENT_ID:      ${{ secrets.SHEETS_CLIENT_ID }}
          SHEETS_CLIENT_SECRET:  ${{ secrets.SHEETS_CLIENT_SECRET }}
          OAUTH_CLIENT_ID:       ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET:   ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: python fetch_ops.py

      - name: Commit and push data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json video_daily.json ops.json
          # 変更がなければスキップ
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update analytics data $(date -u +%Y-%m-%d)"
          git push

      - name: データ鮮度チェック（24時間超で LINE 通知）
        if: success()
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID:      ${{ secrets.LINE_GROUP_ID }}
        run: python check_staleness.py

      # 引き継ぎ書類（正本は Dropbox）への反映漏れを1日1回だけ思い出させる。
      # 3時間おきに走るので、UTC 0時（JST 9時）の実行だけ通知する。
      - name: 引き継ぎ書類の反映漏れを通知（JST 9時のみ）
        if: success()
        continue-on-error: true
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID:      ${{ secrets.LINE_GROUP_ID }}
        run: |
          if [ "$(date -u +%H)" != "00" ]; then
            echo "対象時刻ではないのでスキップします（UTC $(date -u +%H)時）"
            exit 0
          fi
          python docs_check.py pending

      - name: 失敗時 LINE 通知
        if: failure()
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID:      ${{ secrets.LINE_GROUP_ID }}
        run: |
          python line_notify.py "⚠️ CHANNEL DESK: データ更新に失敗しました（GitHub Actions）。実行ログを確認してください。
          https://github.com/ytpokerguild-netizen/channel-desk-data/actions"
