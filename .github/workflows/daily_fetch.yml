name: Daily YouTube Analytics Fetch

on:
  schedule:
    # 3時間おきに実行（JST 3/6/9/12/15/18/21/24時ごろ）。投稿計画シートの変更も最大3時間で反映される
    - cron: "0 */3 * * *"
  workflow_dispatch:  # 手動実行も可能
  push:
    paths:
      - "trigger.txt"  # trigger.txt の変更push = 即時更新の合図（Claude経由の「今すぐ更新」用）

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # data.json をコミット・プッシュするために必要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch YouTube data
        env:
          YOUTUBE_API_KEY:     ${{ secrets.YOUTUBE_API_KEY }}
          REFRESH_TOKEN:       ${{ secrets.REFRESH_TOKEN }}
          OAUTH_CLIENT_ID:     ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          # 投稿計画表の共有が「制限付き」になり、認証なしの CSV エクスポートが
          # 401 になったため、運営ログと同じサービスアカウントで読む（2026-08-12〜）
          SHEETS_SA_KEY:       ${{ secrets.SHEETS_SA_KEY }}
        run: |
          # google-auth は JWT の RS256 署名にだけ使う。SA 方式のときだけ入れる。
          # （fetch.py 自体は標準ライブラリのみ。依存は SA 経路に入ったときだけ）
          if [ -n "$SHEETS_SA_KEY" ]; then
            pip install --quiet --disable-pip-version-check google-auth
          fi
          python fetch.py

      # 運営ログ（非公開スプレッドシート）→ ops.json
      # 既存の REFRESH_TOKEN とは別のトークンを使う。ここが失敗しても
      # data.json の更新は止めない（continue-on-error）。
      # SHEETS_REFRESH_TOKEN が未設定のときは何もせず正常終了する。
      - name: 運営ログを反映（ops.json）
        continue-on-error: true
        env:
          # ① サービスアカウント方式（推奨）。これがあれば下の3つは使われない
          SHEETS_SA_KEY:         ${{ secrets.SHEETS_SA_KEY }}
          # ② 旧・リフレッシュトークン方式（フォールバック）
          SHEETS_REFRESH_TOKEN:  ${{ secrets.SHEETS_REFRESH_TOKEN }}
          SHEETS_CLIENT_ID:      ${{ secrets.SHEETS_CLIENT_ID }}
          SHEETS_CLIENT_SECRET:  ${{ secrets.SHEETS_CLIENT_SECRET }}
          OAUTH_CLIENT_ID:       ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET:   ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          # google-auth は JWT の RS256 署名にだけ使う。SA 方式のときだけ入れる。
          # （fetch.py は従来どおり標準ライブラリのみ。依存はこのステップに閉じている）
          if [ -n "$SHEETS_SA_KEY" ]; then
            pip install --quiet --disable-pip-version-check google-auth
          fi
          python fetch_ops.py

      # ★ 投稿計画表が読めなくなると video_archive が空になり、企画タイプ・ナレーター別の
      #   集計が「Actions は緑のまま」黙って消える（2026-08-12 に実際に起きかけた）。
      #   0件に変わった最初の1回だけ通知する。毎回出すと LINE の月200通を食うため。
      #   ⚠ コミット前に置くこと（HEAD:data.json を前回値として読んでいます）
      - name: 投稿計画表を読めたか確認（0件に変わったら LINE 通知）
        if: success()
        continue-on-error: true
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID:      ${{ secrets.LINE_GROUP_ID }}
        run: |
          now=$(python -c "import json;print(len(json.load(open('data.json')).get('video_archive',{})))")
          prev=$(git show HEAD:data.json | python -c "import json,sys;print(len(json.load(sys.stdin).get('video_archive',{})))")
          echo "動画アーカイブ: 前回 ${prev} 件 → 今回 ${now} 件"
          if [ "$now" -eq 0 ] && [ "$prev" -gt 0 ]; then
            python line_notify.py "⚠️ CHANNEL DESK: 投稿計画表を読めませんでした（動画アーカイブが 0 件）。
          企画タイプ・ナレーター別の集計が空になっています。
          シートの共有設定と、Secrets の SHEETS_SA_KEY を確認してください。"
          fi

      - name: Commit and push data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json video_daily.json ops.json
          # 変更がなければスキップ
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update analytics data $(date -u +%Y-%m-%d)"
          git push

      - name: データ鮮度チェック（24時間超で LINE 通知）
        if: success()
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID:      ${{ secrets.LINE_GROUP_ID }}
        run: python check_staleness.py

      # 引き継ぎ書類（正本は Dropbox）への反映漏れを1日1回だけ思い出させる。
      # 3時間おきに走るので、UTC 0時（JST 9時）の実行だけ通知する。
      - name: 引き継ぎ書類の反映漏れを通知（JST 9時のみ）
        if: success()
        continue-on-error: true
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID:      ${{ secrets.LINE_GROUP_ID }}
        run: |
          if [ "$(date -u +%H)" != "00" ]; then
            echo "対象時刻ではないのでスキップします（UTC $(date -u +%H)時）"
            exit 0
          fi
          python docs_check.py pending

      - name: 失敗時 LINE 通知
        if: failure()
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID:      ${{ secrets.LINE_GROUP_ID }}
        run: |
          python line_notify.py "⚠️ CHANNEL DESK: データ更新に失敗しました（GitHub Actions）。実行ログを確認してください。
          https://github.com/ytpokerguild-netizen/channel-desk-data/actions"
