name: Daily YouTube Analytics Fetch

on:
  schedule:
    # 3時間おきに実行（JST 3/6/9/12/15/18/21/24時ごろ）。投稿計画シートの変更も最大3時間で反映される
    # ⚠⚠ **毎時 :00 ちょうどに戻さないこと（2026-08-28 変更）。**
    #   GitHub Actions の schedule は「ベストエフォート」で、混雑時は遅延し、実行ごと飛ぶこともあります。
    #   :00 は世界中のジョブが集中する時刻で、いちばん飛ばされやすい。GitHub 自身が避けるよう案内しています。
    #   実際に起きたこと: 8/26 の夜から崩れ、3.0時間おきだった間隔が
    #     4.8h → 12.9h → 10.9h → 9時間実行なし、と悪化しました。
    #     **411回すべて success です。壊れたのではなく、発火していませんでした。**
    #   同じ時期に Morning LINE Brief（当時 `0 22`）も 5〜8時間の遅れと1日欠落を起こしており、
    #   **1つのワークフローの問題ではなく、:00 に置いていた両方が巻き込まれていました。**
    # ⚠ 分だけを動かし、時は動かさないこと。
    #   ★ 2026-08-28 追記: 「JST 9時のみ」判定（`date -u +%H` = "00"）に依存していた日次の2通知は、
    #     `daily_notify.yml`（1日1回の独立ワークフロー）へ移したので、この cron はもう通知に影響しません。
    #     それでも時を動かさないのは、3時間おきの取得間隔を保つためです。
    - cron: "23 */3 * * *"
  workflow_dispatch:  # 手動実行も可能
  push:
    paths:
      - "trigger.txt"  # trigger.txt の変更push = 即時更新の合図（Claude経由の「今すぐ更新」用）

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # data.json をコミット・プッシュするために必要

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch YouTube data
        env:
          YOUTUBE_API_KEY:     ${{ secrets.YOUTUBE_API_KEY }}
          REFRESH_TOKEN:       ${{ secrets.REFRESH_TOKEN }}
          OAUTH_CLIENT_ID:     ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          # 投稿計画表の共有が「制限付き」になり、認証なしの CSV エクスポートが
          # 401 になったため、運営ログと同じサービスアカウントで読む（2026-08-12〜）
          SHEETS_SA_KEY:       ${{ secrets.SHEETS_SA_KEY }}
        run: |
          # google-auth は JWT の RS256 署名にだけ使う。SA 方式のときだけ入れる。
          # （fetch.py 自体は標準ライブラリのみ。依存は SA 経路に入ったときだけ）
          if [ -n "$SHEETS_SA_KEY" ]; then
            pip install --quiet --disable-pip-version-check google-auth
          fi
          python fetch.py

      # 運営ログ（非公開スプレッドシート）→ ops.json
      # 既存の REFRESH_TOKEN とは別のトークンを使う。ここが失敗しても
      # data.json の更新は止めない（continue-on-error）。
      # SHEETS_REFRESH_TOKEN が未設定のときは何もせず正常終了する。
      - name: 運営ログを反映（ops.json）
        continue-on-error: true
        env:
          # ① サービスアカウント方式（推奨）。これがあれば下の3つは使われない
          SHEETS_SA_KEY:         ${{ secrets.SHEETS_SA_KEY }}
          # ② 旧・リフレッシュトークン方式（フォールバック）
          SHEETS_REFRESH_TOKEN:  ${{ secrets.SHEETS_REFRESH_TOKEN }}
          SHEETS_CLIENT_ID:      ${{ secrets.SHEETS_CLIENT_ID }}
          SHEETS_CLIENT_SECRET:  ${{ secrets.SHEETS_CLIENT_SECRET }}
          OAUTH_CLIENT_ID:       ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET:   ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: |
          # google-auth は JWT の RS256 署名にだけ使う。SA 方式のときだけ入れる。
          # （fetch.py は従来どおり標準ライブラリのみ。依存はこのステップに閉じている）
          if [ -n "$SHEETS_SA_KEY" ]; then
            pip install --quiet --disable-pip-version-check google-auth
          fi
          python fetch_ops.py

      # ★ 投稿計画表が読めなくなると video_archive が空になり、企画タイプ・ナレーター別の
      #   集計が「Actions は緑のまま」黙って消える（2026-08-12 に実際に起きかけた）。
      #   0件に変わった最初の1回だけ通知する。毎回出すと LINE の月200通を食うため。
      #   ⚠ コミット前に置くこと（HEAD:data.json を前回値として読んでいます）
      - name: 投稿計画表を読めたか確認（0件に変わったら LINE 通知）
        if: success()
        continue-on-error: true
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID:      ${{ secrets.LINE_GROUP_ID }}
        run: |
          now=$(python -c "import json;print(len(json.load(open('data.json')).get('video_archive',{})))")
          prev=$(git show HEAD:data.json | python -c "import json,sys;print(len(json.load(sys.stdin).get('video_archive',{})))")
          echo "動画アーカイブ: 前回 ${prev} 件 → 今回 ${now} 件"
          if [ "$now" -eq 0 ] && [ "$prev" -gt 0 ]; then
            python line_notify.py "⚠️ CHANNEL DESK: 投稿計画表を読めませんでした（動画アーカイブが 0 件）。
          企画タイプ・ナレーター別の集計が空になっています。
          シートの共有設定と、Secrets の SHEETS_SA_KEY を確認してください。"
          fi

      # 新しい動画が増えたら、企画タイプ／ナレーターの入力を LINE で頼む（2026-08-14 運営者の依頼）。
      # 入れ忘れると企画タイプ別・ナレーター別の集計から黙って抜けるので、増えた日に頼む。
      # ⚠ コミット前に置くこと（前回の動画一覧を HEAD:data.json から読んでいます）
      - name: 新作の入力依頼を通知
        if: success()
        continue-on-error: true
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID:      ${{ secrets.LINE_GROUP_ID }}
        run: python notify_archive_input.py

      - name: Commit and push data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json video_daily.json ops.json
          # 変更がなければスキップ
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update analytics data $(date -u +%Y-%m-%d)"
          git push

      # ⚠⚠ ここにあった「データ鮮度チェック」は 2026-08-28 に削除し、
      #   `staleness_guard.yml`（独立したワークフロー）へ移しました。**戻さないこと。**
      #   理由: このステップは**取得が成功した直後**に走るので fetched_at がいつも0時間前で、
      #   毎回 `[OK] 0.0時間前` を出すだけでした。**1度も鳴ったことがありません。**
      #   さらに `if: success()` が付いていたため、取得が動かなければステップごと実行されません。
      #   **いちばん知りたい「取得が止まった」ときに、いちばん確実に黙る**作りでした。
      #   2026-08-28、取得が9時間止まったのに LINE は鳴らず、運営者が自分で気づきました。
      #   ★ 見張り役を、見張る対象の中に入れないこと。

      # ⚠⚠ ここにあった日次の2通知（引き継ぎ書類の反映漏れ／週次AI分析の形）は
      #   2026-08-28 に `daily_notify.yml`（独立したワークフロー・1日1回）へ移しました。**戻さないこと。**
      #   理由: このワークフローは3時間おきなので、1日1回にするために
      #   `date -u +%H` = "00" のときだけ通す判定を入れていました。
      #   **その形では、遅延して 05:00Z に走った日は1本も出ません。**
      #   2026-08-28 に取得が9時間止まったとき、まさにその日の日次通知が出ませんでした。
      #   ワークフロー自体を1日1回にすることで、**時刻判定そのものを無くしてあります。**

      - name: 失敗時 LINE 通知
        if: failure()
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID:      ${{ secrets.LINE_GROUP_ID }}
        run: |
          python line_notify.py "⚠️ CHANNEL DESK: データ更新に失敗しました（GitHub Actions）。実行ログを確認してください。
          https://github.com/ytpokerguild-netizen/channel-desk-data/actions"
