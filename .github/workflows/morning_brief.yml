name: Morning LINE Brief

on:
  schedule:
    # 毎朝 07:00 JST（= 前日 22:00 UTC）
    - cron: "0 22 * * *"
  workflow_dispatch:  # 手動テスト実行用

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 朝ブリーフを LINE 送信
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID:      ${{ secrets.LINE_GROUP_ID }}
        run: python morning_brief.py
