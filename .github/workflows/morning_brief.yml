name: Morning LINE Brief

on:
  schedule:
    # 毎朝 07:00 JST ごろ（= 前日 21:50 UTC）
    # ⚠⚠ **`0 22` に戻さないこと（2026-08-28 変更）。**理由は daily_fetch.yml の同じ場所に書いてあります。
    #   :00 ちょうどは飛ばされやすく、実際 8/26 は1日まるごと欠落、8/27 は5.0時間おくれ、
    #   8/28 は8.0時間おくれで**昼近くに朝ブリーフが届いていました**（8/20〜25 は 0.4〜0.5時間おくれで正常）。
    # ★ 21:50Z にしたのは、もともと 22:00Z 予定で 0.4時間おくれの 07:25 JST 着だったためです。
    #   10分ぶん前倒しして、これまでと同じ 07時台前半に着くことを狙っています。
    #   ⚠ 届く時刻を変えたいとき以外、**時（21）は動かさないこと。**
    - cron: "50 21 * * *"
  workflow_dispatch:  # 手動テスト実行用

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 朝ブリーフを LINE 送信
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID:      ${{ secrets.LINE_GROUP_ID }}
        run: python morning_brief.py
