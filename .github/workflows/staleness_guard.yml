name: データ鮮度の見張り

# ═══════════════════════════════════════════════════════════════════
# なぜ独立したワークフローなのか（2026-08-28 新設）
# ═══════════════════════════════════════════════════════════════════
# 鮮度チェックは daily_fetch.yml の中にありました。**そこでは原理的に鳴りません。**
#   ・取得が成功した直後に走るので fetched_at はいつも0時間前
#   ・`if: success()` が付いているので、取得が動かなければステップごと実行されない
# つまり **取得が止まったときにいちばん確実に黙る**作りでした。
# 2026-08-28、取得が9時間止まったのに LINE は鳴らず、運営者が自分で気づきました。
#
# ⚠⚠ **この見張りを daily_fetch.yml に戻さないこと。**見張り役を、見張る対象の中に入れないこと。
#
# ⚠ 正直に書いておきます。**この見張り自体も schedule なので、同じ理由で飛ぶことがあります。**
#   8/26〜8/28 は、このリポジトリのスケジュール実行が全体的に遅延・欠落していました。
#   これは「取得だけが止まった」場合を確実に捕まえるためのもので、
#   **GitHub のスケジューラごと止まった場合は、これも一緒に黙ります。**
#   そこまで守るなら、GitHub の外（手元の定期タスクなど）から見張る必要があります。
# ═══════════════════════════════════════════════════════════════════

on:
  schedule:
    # 6時間おき。⚠ **:00 ちょうどにしないこと。**混雑して飛ばされます（daily_fetch.yml の注記を参照）
    # ⚠ daily_fetch（:23）とわざと分をずらしています。同時に走らせても得がありません
    - cron: "37 2,8,14,20 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: データが更新され続けているか確認する
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_GROUP_ID:      ${{ secrets.LINE_GROUP_ID }}
          # 取得は3時間おき。8時間 = 2回以上連続で飛んだ状態です。
          # ⚠ 24時間に戻さないこと。それは「8回連続で飛んだ」状態で、
          #   2026-08-28 の9時間の事故はそれでは鳴りませんでした。
          STALE_HOURS: "8"
        run: python check_staleness.py
