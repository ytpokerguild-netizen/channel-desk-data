<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>週次レポート — りいポーカーチャンネル</title>
<style>
  @page{size:A4;margin:16mm}
  *{box-sizing:border-box}
  body{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;color:#1a1a1a;font-size:13px;line-height:1.7;margin:0;background:#f2f0ea}
  .sheet{max-width:860px;margin:0 auto;background:#fff;padding:34px 40px 40px;min-height:100vh;box-shadow:0 0 24px rgba(0,0,0,.08)}
  h1{font-size:20px;margin:0 0 2px;border-bottom:3px solid #C9A227;padding-bottom:9px}
  .sub{color:#666;font-size:12px;margin-bottom:18px}
  h2{font-size:14.5px;margin:22px 0 8px;color:#8a6d1a;border-left:4px solid #C9A227;padding-left:9px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{border:1px solid #ddd;padding:6px 9px;text-align:left}
  th{background:#f5f1e6;font-weight:600}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .badge{display:inline-block;font-size:11px;padding:1px 9px;border-radius:10px;margin-left:9px;vertical-align:3px}
  .badge.final{background:#e5f2e9;color:#1c7c40;border:1px solid #a9d6b8}
  .badge.flash{background:#fdf3d7;color:#8a6d1a;border:1px solid #e4cf8e}
  .note{color:#888;font-size:11px;margin-top:5px}
  .foot{margin-top:26px;color:#999;font-size:10px;border-top:1px solid #ddd;padding-top:7px}
  .suggest{border:1px solid #e4cf8e;background:#fdf8ea;border-radius:7px;padding:10px 14px;margin-top:8px}
  /* ★ 結論の1行（2026-08-17 追加）。数字を読む前に結論が分かるよう、いちばん上に置く */
  .verdict{border:1px solid #cfe3d6;background:#f2f9f4;border-radius:8px;padding:11px 15px;margin:0 0 16px;font-size:14px;line-height:1.6}
  .verdict b{font-size:16px}
  .verdict .why{display:block;color:#4a6553;font-size:12px;margin-top:3px}
  /* ★ 表の中の横棒（2026-08-17 追加）。数字を読まなくても大小が分かるように。
     数字が右揃えなので、棒も右から伸ばして右端を揃える */
  .minibar{display:flex;justify-content:flex-end;height:3px;background:#efece3;border-radius:2px;margin-top:3px}
  .minibar>i{display:block;height:3px;background:#b3ada0;border-radius:2px}
  .toolbar{max-width:860px;margin:0 auto;padding:14px 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .toolbar select,.toolbar button,.toolbar a{font-family:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid #cbc5b4;background:#fff;color:#333;cursor:pointer;text-decoration:none}
  .toolbar button:hover,.toolbar a:hover{background:#f5f1e6}
  .msg{max-width:860px;margin:40px auto;text-align:center;color:#666}
  @media print{
    body{background:#fff}
    .sheet{box-shadow:none;padding:0;max-width:none;min-height:auto}
    /* ⚠ !important は消さないこと。JS が toolbar に style.display='flex' を
       インラインで当てるため、!important が無いと印刷・PDF にツールバーが写り込みます
       （2026-08-17 に実際に混入した PDF を出しかけました）。 */
    .toolbar{display:none!important}
  }
</style>
</head>
<body>

<div class="toolbar" id="toolbar" style="display:none">
  <a href="index.html">← ダッシュボード</a>
  <select id="weekSelect" onchange="onWeekChange()"></select>
  <button onclick="window.print()">🖨 印刷 / PDF保存</button>
</div>

<div class="msg" id="loadMsg" style="display:none">読み込み中...</div>
<div class="sheet" id="sheet" style="display:none"></div>

<script>
const DATA_URL = 'data.json';
let REPORTS = [];
let COUPON  = null;   // data.json の coupon（週ごとの節を出すのに使う）
let TREND   = null;   // data.json の weekly_trend（直近26週のグラフ用）

const fmtFull = n => (n??0).toLocaleString('ja-JP');
// ★ 万表記（2026-08-17 追加・オーナーの指摘「数字が理解しにくい」）。
//   日本語では 587,400回 より 58.7万回 のほうが一瞬で入ります。
//   ⚠ **ツールチップと表の小さい数字には生の値を残すこと。**万に丸めると精密な比較ができなくなります。
//   ⚠ ダッシュボード（index.html）の fmt() と同じ規則にしてあります。片方だけ変えないこと。
const fmtMan  = n => (n==null) ? '—' : (Math.abs(n)>=10000
                    ? (n/10000).toFixed(1).replace(/\.0$/,'')+'万'
                    : n.toLocaleString('ja-JP'));
// 棒（表の中）。max に対する割合で幅を出す
const miniBar = (v,max) => (!max||v==null) ? '' :
  `<div class="minibar"><i style="width:${Math.max(1,Math.round(v/max*100))}%"></i></div>`;
const fmtDate = s => s ? s.replace(/-/g,'/') : '';
const fmtMin  = m => m >= 60 ? Math.round(m/60).toLocaleString()+'時間' : (m||0).toLocaleString()+'分';
const esc     = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pct     = (a,b)=> (b==null||!b) ? '—' : ((a-b)/b*100>=0?'+':'')+((a-b)/b*100).toFixed(1)+'%';

// YouTube Studio の表記に準拠（APIの値 → Studioの日本語ラベル）
const TRAFFIC_LABEL = {
  'SUBSCRIBER':'ブラウジング機能','YT_SEARCH':'YouTube検索','SHORTS':'ショートフィード',
  'EXT_URL':'外部','NOTIFICATION':'通知','RELATED_VIDEO':'関連動画',
  'BROWSE':'ブラウジング機能','CHANNEL':'チャンネルページ','YT_CHANNEL':'チャンネルページ',
  'DIRECT':'直接入力','ADVERTISING':'広告','PLAYLIST':'再生リスト',
  'END_SCREEN':'終了画面','NO_LINK_EMBEDDED':'埋め込み','OTHER':'その他',
  'ANNOTATION':'アノテーション','CAMPAIGN_CARD':'プロモーション',
  'SHORTS_CONTENT_LINKS':'ショート内リンク','YT_OTHER_PAGE':'その他のYouTube機能',
  'NO_LINK_OTHER':'直接入力または不明','SOUND_PAGE':'音源ページ','HASHTAGS':'ハッシュタグ',
  '3':'ブラウジング','9':'YouTube検索','10':'関連動画','4':'チャンネルページ',
  '5':'外部サイト','7':'Google検索','19':'通知','18':'エンドスクリーン',
  '11':'再生リスト','0':'直接/不明','1':'広告','17':'プロモーション','8':'その他'
};

// ════════════════════════════════
// 直近26週（約6か月）の位置づけ
// 2026-08-17 追加（オーナーの依頼「週間しかないので直近3〜6月とも比較したい」）。
// ⚠ 前週比だけだと読み違えます。2026-08-08 週は前週比 -51.9% でしたが、
//   26週平均の 106% で「平年並みかやや上」でした。前週が突出していただけです。
// ⚠ **外部ライブラリを使わず SVG を直接書いています。**印刷/PDF で確実に出すためです。
//   Chart.js に置き換えないでください（CDN が落ちると白紙になります）。
// ⚠ 色は「強調」の形です。見ている週だけ濃い金、他は薄いグレー。1系列なので凡例は出しません。
//   薄いグレーは白地に対して 3:1 未満なので、**目盛りと当週の直接ラベルが必須**です（外さないこと）。
// ════════════════════════════════
const TREND_CUR = '#8a6d1a';   // 見ている週
const TREND_CTX = '#b3ada0';   // それ以外の週（文脈）

// 上だけ角丸・底は直角のカラム（データの端だけ丸める）
function colPath(x, y, w, h, r){
  if(h <= 0) return '';
  const rr = Math.min(r, h, w/2);
  return `M${x} ${y+h} L${x} ${y+rr} Q${x} ${y} ${x+rr} ${y} L${x+w-rr} ${y} Q${x+w} ${y} ${x+w} ${y+rr} L${x+w} ${y+h} Z`;
}
function niceMax(v){
  if(v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for(const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]){ if(v <= m*p) return m*p; }
  return 10*p;
}

function trendBlock(rep){
  const T = TREND;
  if(!T || T.length < 4) return '';                 // 週が少なすぎるうちは出さない
  const W = 780, H = 208, PL = 58, PR = 8, TOP = 16, BASE = 150;
  const plotW = W - PL - PR;
  const band  = plotW / T.length;
  const bw    = Math.min(24, Math.max(3, band - 2));   // ≤24px・隣と2pxあける
  const max   = niceMax(Math.max(...T.map(d=>d.views)));
  const avg   = T.reduce((s,d)=>s+d.views,0) / T.length;
  const yOf   = v => BASE - (v/max) * (BASE - TOP);
  const curIx = T.findIndex(d=>d.week_start===rep.week_start);

  // 目盛り（0・半分・上限）。丸い数字だけにする
  const ticks = [0, max/2, max].map(v=>
    `<line x1="${PL}" y1="${yOf(v).toFixed(1)}" x2="${W-PR}" y2="${yOf(v).toFixed(1)}" stroke="#e8e5dc" stroke-width="1"/>
     <text x="${PL-7}" y="${(yOf(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#888">${fmtMan(Math.round(v))}</text>`).join('');

  const bars = T.map((d,i)=>{
    const x = PL + band*i + (band-bw)/2, y = yOf(d.views);
    const on = i === curIx;
    return `<path d="${colPath(x, y, bw, BASE-y, 4)}" fill="${on?TREND_CUR:TREND_CTX}"><title>${fmtDate(d.week_start)}〜${fmtDate(d.week_end)}　${fmtFull(d.views)}回　登録純増 ${d.subs_net>=0?'+':''}${d.subs_net}</title></path>`;
  }).join('');

  // 月が変わる週だけ x ラベルを出す（全部出すと重なる）
  const xlab = T.map((d,i)=>{
    const m = d.week_start.slice(5,7);
    if(i>0 && T[i-1].week_start.slice(5,7)===m) return '';
    return `<text x="${(PL+band*i+band/2).toFixed(1)}" y="${BASE+15}" text-anchor="middle" font-size="10" fill="#888">${parseInt(m,10)}月</text>`;
  }).join('');

  // 見ている週の値を直接ラベル（薄いグレーの説明責任 = 目盛り＋この数字）
  let curLab = '';
  if(curIx >= 0){
    const d = T[curIx], x = PL + band*curIx + band/2, y = yOf(d.views);
    const anchor = curIx > T.length-4 ? 'end' : (curIx < 3 ? 'start' : 'middle');
    const dx = anchor==='end' ? bw/2 : (anchor==='start' ? -bw/2 : 0);
    curLab = `<text x="${(x+dx).toFixed(1)}" y="${(y-7).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="#1a1a1a">${fmtMan(d.views)}</text>`;
  }

  const ya = yOf(avg);
  const cur = curIx>=0 ? T[curIx] : null;
  const ratio = cur ? Math.round(cur.views/avg*100) : null;

  return `
<h2>直近${T.length}週の中での位置（約6か月）</h2>
<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img"
     aria-label="直近${T.length}週の週間視聴回数。この週は${cur?fmtMan(cur.views):''}回で、${T.length}週平均の${ratio}%。">
  ${ticks}
  ${bars}
  <line x1="${PL}" y1="${ya.toFixed(1)}" x2="${W-PR}" y2="${ya.toFixed(1)}" stroke="#666" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="${PL+2}" y="${(ya-15).toFixed(1)}" width="112" height="13" fill="#fff"/>
  <text x="${PL+5}" y="${(ya-5).toFixed(1)}" font-size="10" fill="#666">${T.length}週平均 ${fmtMan(Math.round(avg))}</text>
  ${curLab}
  <line x1="${PL}" y1="${BASE}" x2="${W-PR}" y2="${BASE}" stroke="#ddd" stroke-width="1"/>
  ${xlab}
</svg>
${cur?``:''}
<div class="note">濃い色がこの週、薄い色がそれ以外の週です。前週比だけでは「前週がどんな週だったか」で見え方が変わるため、6か月の中での位置を併記しています。${T.length}週ぶんは <b>7日そろった週だけ</b>を並べています。</div>`;
}

// ════════════════════════════════
// 横棒グラフの部品（2026-08-17 追加）
// オーナーの方針:「まとめ以外のデータの文章を減らし、その分をチャートで直感的に見せる。
//                 まとめと考察には文章を使う」
// ⚠ 表と同じ数字を文章でも書かないこと。**数字は表かグラフ、文章は考察**です。
// 色（すべて検証済み・白地に対して 3:1 以上、色覚多様性でも区別できる）:
//   増 #1f6f9c / 減 #c0553f（発散・protan でも ΔE 14.3）
//   今週 #8a6d1a / 前週 #6f8f9e（2系列・ΔE 15.5）
//   1系列 #b3ada0
// ════════════════════════════════
const C_UP='#1f6f9c', C_DOWN='#c0553f', C_NOW='#8a6d1a', C_PREV='#6f8f9e', C_ONE='#b3ada0';

// rows: [{label, bars:[{v,color}], right}]  ゼロから右に伸びる横棒
function hbarSVG(rows, {W=780, labelW=250, rightW=70, rowH=26, max=null}={}){
  if(!rows.length) return '';
  const H = rows.length*rowH + 6;
  const x0 = labelW, plotW = W - labelW - rightW;
  const mx = max || Math.max(1, ...rows.flatMap(r=>r.bars.map(b=>b.v||0)));
  const body = rows.map((r,i)=>{
    const y0 = i*rowH + 3;
    const n  = r.bars.length;
    const bh = Math.min(14, (rowH-8-2*(n-1))/n);       // 2px の隙間で区切る
    const bars = r.bars.map((b,j)=>{
      const w = Math.max(1, (b.v||0)/mx*plotW), y = y0 + (rowH-8-(bh*n+2*(n-1)))/2 + j*(bh+2);
      return `<rect x="${x0}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${b.color}"/>`;
    }).join('');
    return `${bars}
<text x="${labelW-8}" y="${(y0+rowH/2-1).toFixed(1)}" text-anchor="end" font-size="11" fill="#1a1a1a">${r.label}</text>
<text x="${W-4}" y="${(y0+rowH/2-1).toFixed(1)}" text-anchor="end" font-size="11" fill="#444" font-weight="600">${r.right}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${body}</svg>`;
}

// 増減（ゼロ線の左右に伸びる）。rows: [{label, v, right}]
function divSVG(rows, {W=780, labelW=250, rightW=76, rowH=26}={}){
  if(!rows.length) return '';
  const H = rows.length*rowH + 16;
  const x0 = labelW, plotW = W - labelW - rightW;
  const mx = Math.max(1, ...rows.map(r=>Math.abs(r.v||0)));
  const zero = x0 + plotW/2;
  const body = rows.map((r,i)=>{
    const y0=i*rowH+3, bh=13, y=y0+(rowH-8-bh)/2;
    const w = Math.abs(r.v||0)/mx*(plotW/2);
    const up = (r.v||0) >= 0;
    return `<rect x="${(up?zero:zero-w).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,w).toFixed(1)}" height="${bh}" rx="3" fill="${up?C_UP:C_DOWN}"/>
<text x="${labelW-8}" y="${(y0+rowH/2-1).toFixed(1)}" text-anchor="end" font-size="11" fill="#1a1a1a">${r.label}</text>
<text x="${W-4}" y="${(y0+rowH/2-1).toFixed(1)}" text-anchor="end" font-size="11" fill="${up?C_UP:C_DOWN}" font-weight="600">${r.right}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${body}
<line x1="${zero}" y1="0" x2="${zero}" y2="${H-13}" stroke="#ccc" stroke-width="1"/>
<text x="${zero-5}" y="${H-2}" text-anchor="end" font-size="10" fill="#888">← 減</text>
<text x="${zero+5}" y="${H-2}" font-size="10" fill="#888">増 →</text></svg>`;
}
// ラベル欄に入る文字数は幅から計算する（11px フォントで日本語は約12px/字）。
// ⚠ 直に文字数を決め打ちすると、長いタイトルで左にはみ出して切れます（2026-08-17 に実際に起きた）。
const fitChars = labelW => Math.max(6, Math.floor((labelW-14)/12));
const cut = (t,n)=> (t||'').length>n ? esc(t.slice(0,n-1))+'…' : esc(t||'');

// ── 要因分解: 今週の増減はどの動画で起きたか ──────────────────
function causeBlock(rep, views, viewsPrev){
  const L = (rep.top_videos||[]).map(v=>({t:v.title, d:(v.views_week||0)-(v.views_prev_week||0)}));
  if(!L.length || viewsPrev==null) return '';
  L.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  const head = L.slice(0,5), rest = (views-viewsPrev) - head.reduce((s,x)=>s+x.d,0);
  const LW=310, N=fitChars(LW);
  const rows = head.map(x=>({label:cut(x.t,N), v:x.d, right:(x.d>=0?'+':'−')+fmtMan(Math.abs(x.d))}));
  if(Math.abs(rest) > 0) rows.push({label:'その他の動画（合計）', v:rest, right:(rest>=0?'+':'−')+fmtMan(Math.abs(rest))});
  const tot = views-viewsPrev;
  const top = head[0];
  const share = tot ? Math.round(top.d/tot*100) : 0;
  return `<h2>今週の増減はどこで起きたか</h2>
<div style="margin-bottom:5px">前週から <b style="color:${tot>=0?C_UP:C_DOWN}">${tot>=0?'+':'−'}${fmtMan(Math.abs(tot))}回</b>${(share>=40&&share<=160)?`。うち <b>${cut(top.t,18)}</b> だけで <b>${share}%</b>を占めます。`:'。'}</div>
${divSVG(rows,{labelW:LW})}`;
}

// ── 新作の初速（公開2日間） ──────────────────────────────
function firstBlock(rep){
  const L = (rep.new_videos||[]).filter(v=>v.first2d!=null);
  const wait = (rep.new_videos||[]).length - L.length;
  if(!L.length) return '';
  L.sort((a,b)=>b.first2d-a.first2d);
  const LW=310, N=fitChars(LW)-6;   // 先頭に「08/12 」が付くぶん短く
  const rows = L.map(v=>({label:`${fmtDate(v.published_at).slice(5)} ${cut(v.title,N)}`, bars:[{v:v.first2d,color:C_ONE}], right:fmtMan(v.first2d)}));
  const ratio = L.length>1 ? (L[0].first2d/Math.max(1,L[L.length-1].first2d)) : null;
  return `<h2>新作の初速（公開2日間）</h2>
${hbarSVG(rows,{labelW:LW})}
<div class="note">${ratio&&ratio>=3?`いちばん強い回と弱い回で <b>${ratio.toFixed(0)}倍</b>の開きがあります。`:''}${wait?`ほか ${wait}本 は公開2日を過ぎていないので出していません。`:''}</div>`;
}

// ════════════════════════════════
// クーポン施策の節
// ⚠ 「その週に何日ぶんのデータがあるか」を coupon.daily から数えています。
//   クーポンの入力データは 2026-08-04 が最初で、それ以前の週は0日です。
//   件数をそのまま週どうしで比べると 7日 対 4日 の比較になるため、必ず1日あたりを併記すること
//   （2026-08-17 に実際にその比較を出してしまいました）。
// ════════════════════════════════
function couponBlock(rep){
  if(!COUPON || COUPON.error) return '';
  const wk = (COUPON.weekly||[]).find(w=>w.week_start===rep.week_start);
  if(!wk) return '';                      // クーポンがまだ無い週は節ごと出さない
  const prevStart = new Date(rep.week_start+'T00:00:00Z');
  prevStart.setUTCDate(prevStart.getUTCDate()-7);
  const pKey = prevStart.toISOString().slice(0,10);
  const pw = (COUPON.weekly||[]).find(w=>w.week_start===pKey) || null;

  // その週のうち、実際に入力のあった日数（分母がずれるのを防ぐ）
  const daysIn = (start)=>{
    const s = new Date(start+'T00:00:00Z'), e = new Date(start+'T00:00:00Z');
    e.setUTCDate(e.getUTCDate()+6);
    return (COUPON.daily||[]).filter(r=>{
      const t = new Date(r.date+'T00:00:00Z'); return t>=s && t<=e && r.entries>0;
    }).length;
  };
  const dC = daysIn(rep.week_start), dP = pw ? daysIn(pKey) : 0;
  const perDay = (n,d)=> d ? (n/d).toFixed(2) : '—';
  const rate   = (u,e)=> e ? (u/e*100).toFixed(1)+'%' : '—';
  const cell   = (n,d)=> d ? `${fmtFull(n)}件（${d}日・1日${perDay(n,d)}件）` : '—';

  const codeRows = (COUPON.by_code||[]).map(b=>
    `<tr><td>${esc(b.code)}</td><td class="num">${fmtFull(b.entries)}</td><td class="num">${fmtFull(b.used)}</td><td class="num">${rate(b.used,b.entries)}</td><td class="num">${fmtFull(b.people)}</td></tr>`).join('');
  const lag = (COUPON.lag_buckets||[]).map(b=>`${esc(b.label)} ${b.count}`).join(' ／ ');

  return `
<h2>クーポン施策</h2>
<div class="note" style="margin:0 0 7px">この週に入力のあったコード: <b>${(wk.codes||[]).map(esc).join('、')||'—'}</b>　／　シート取得日: ${fmtDate(COUPON.snapshot_date||'')}</div>
<table><tr><th>指標</th><th class="num">今週</th><th class="num">前週</th></tr>
<tr><td>コード入力</td><td class="num">${cell(wk.entries,dC)}</td><td class="num">${pw?cell(pw.entries,dP):'—'}</td></tr>
<tr><td>うち使用済み</td><td class="num">${fmtFull(wk.used)}件（${rate(wk.used,wk.entries)}）</td><td class="num">${pw?`${fmtFull(pw.used)}件（${rate(pw.used,pw.entries)}）`:'—'}</td></tr>
<tr><td>実人数</td><td class="num">${fmtFull(wk.people)}人</td><td class="num">${pw?fmtFull(pw.people)+'人':'—'}</td></tr></table>
${codeRows?`<div style="margin-top:11px"><b style="font-size:12.5px">コード別（通算）</b></div>
<table style="margin-top:4px"><tr><th>コード</th><th class="num">入力</th><th class="num">使用</th><th class="num">使用率</th><th class="num">実人数</th></tr>${codeRows}</table>`:''}
${lag?`<div class="note" style="margin-top:7px">入力から使用までの時間（通算${fmtFull(COUPON.total||0)}件）: ${lag}</div>`:''}`;
}

// ════════════════════════════════
// 結論の1行（2026-08-17 追加・オーナーの指摘「直感的にわかりにくい」）
// ⚠ 数字を読む前に結論が分かるように、レポートのいちばん上に置きます。
//   判定は 26週平均に対する比だけで決めています（前週比では決めません。
//   前週が突出していると「半減」に見えてしまうため。2026-08-08 週が実際にそうでした）。
// ════════════════════════════════
function verdictBlock(rep, views, viewsPrev){
  const T = TREND;
  if(!T || T.length < 4) return '';
  const i = T.findIndex(d=>d.week_start===rep.week_start);
  if(i < 0) return '';
  const cur = T[i].views;
  const avg = T.reduce((s,d)=>s+d.views,0) / T.length;
  const r   = Math.round(cur/avg*100);
  const v   = r >= 130 ? '好調' : r >= 110 ? 'やや好調' : r >= 90 ? '平年並み' : r >= 70 ? 'やや低調' : '低調';
  const sorted = T.map(d=>d.views).slice().sort((a,b)=>b-a);
  const rank   = sorted.indexOf(cur) + 1;

  // 前週比が大きく動いたときだけ、その理由を1行そえる
  let why = '';
  const dp = (viewsPrev ? (views-viewsPrev)/viewsPrev*100 : 0);
  if(Math.abs(dp) >= 20 && i > 0){
    const pr = sorted.indexOf(T[i-1].views) + 1;
    if(pr <= 3)      why = `前週比は ${dp>0?'+':''}${dp.toFixed(0)}% ですが、前週は${T.length}週で${pr}番目に高い週でした。`;
    else if(pr >= T.length-2) why = `前週比は ${dp>0?'+':''}${dp.toFixed(0)}% ですが、前週は${T.length}週で下から${T.length-pr+1}番目の週でした。`;
    else             why = `前週比は ${dp>0?'+':''}${dp.toFixed(0)}%。`;
  }
  return `<div class="verdict">今週は <b>${v}</b>。週間視聴回数 <b>${fmtMan(cur)}回</b>で、${T.length}週平均 ${fmtMan(Math.round(avg))}回の <b>${r}%</b>（${T.length}週中 ${rank}位）。
<span class="why">${why}詳しくは下の「直近${T.length}週の中での位置」を見てください。</span></div>`;
}

// ════════════════════════════════
// 投稿計画（2026-08-17 変更）
// ⚠ **問題が無い週は1行だけにします。**全部「投稿済み・遅延0日」の表は読む価値がないためです。
//   遅れているもの・未投稿があるときだけ、その行だけを表で出します。
// ════════════════════════════════
function planBlock(rep, pp){
  const items = pp.items || [];
  const pub   = (rep.new_videos||[]).length;
  if(!items.length) return `<h2>投稿計画の進捗</h2><div class="note">この週の計画データなし</div>`;
  const bad = items.filter(p=>{
    const done = p.matched || (p.status||'').includes('済');
    return !done || (p.delay_days||0) > 0;
  });
  // 問題が無ければ節にしない（基本指標の下に1行で出す）
  if(!bad.length) return `<div class="note">投稿計画: 計画 ${pp.planned} 本 ／ 投稿済み ${pp.posted} 本 ／ 実際に公開 ${pub} 本 ／ 遅延なし</div>`;
  const head = `<h2>投稿計画の進捗</h2>
<div>計画 <b>${pp.planned}</b> 本 ／ 投稿済み <b>${pp.posted}</b> 本 ／ 実際に公開 <b>${pub}</b> 本</div>`;
  return head + `<div class="note" style="margin-bottom:5px">遅れ・未投稿のものだけ出しています（${bad.length}件）。</div>
<table><tr><th style="width:78px">予定日</th><th>タイトル</th><th style="width:90px">ステータス</th><th class="num" style="width:60px">遅延</th></tr>
${bad.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(p.title)}</td><td>${esc(p.status||'—')}</td><td class="num">${p.delay_days!=null?p.delay_days+'日':'—'}</td></tr>`).join('')}</table>`;
}

function renderReportPage(rep){
  const c = rep.channel || {};
  const views     = rep.final ? c.views      : (c.views_snap      ?? c.views);
  const viewsPrev = rep.final ? c.views_prev : (c.views_snap_prev ?? c.views_prev);
  const subsNet   = c.subs_net ?? ((c.subs_gained||0)-(c.subs_lost||0));
  const partial   = !rep.final && c.views_snap==null && (rep.confirmed_days||0) < 7;

  // 視聴者層は2行の表を独立の節にしていたが、1行に畳んで基本指標へ入れた（2026-08-17）
  const ssPct = (ss)=>{
    if(!ss||!Object.keys(ss).length) return null;
    const sub=ss['SUBSCRIBED']||0, unsub=ss['UNSUBSCRIBED']||0, tot=sub+unsub;
    return tot ? Math.round(sub/tot*100) : null;
  };
  const ssC2 = ssPct(rep.subscribed_status), ssP2 = ssPct(rep.subscribed_status_prev);

  const sumRows = [
    ['週間視聴回数', fmtMan(views)+' 回'+(partial?`（確定${rep.confirmed_days}日分のみ）`:''), fmtMan(viewsPrev)+' 回', partial?'—':pct(views,viewsPrev)],
    ['総再生時間',   fmtMin(c.watch_min||0), fmtMin(c.watch_min_prev||0), partial?'—':pct(c.watch_min,c.watch_min_prev)],
    ['登録者純増', (subsNet>=0?'+':'')+fmtFull(subsNet||0)+' 人', c.subs_net_prev!=null?(c.subs_net_prev>=0?'+':'')+fmtFull(c.subs_net_prev)+' 人':'—', pct(subsNet,c.subs_net_prev)],
    ['週内の投稿', (rep.new_videos||[]).length+' 本', '', ''],
    ...(ssC2!=null ? [['登録者による視聴', ssC2+' %', ssP2!=null? ssP2+' %':'—', '']] : []),
  ];

  const trP = new Map((rep.traffic_sources_prev||[]).map(t=>[String(t.source_type), t.views]));
  const trList = (rep.traffic_sources||[]).slice(0,8);
  const trMax  = Math.max(1, ...trList.map(t=>t.views));
  const trafficRows = trList.map(t=>{
    const prev = trP.get(String(t.source_type));
    return `<tr><td>${esc(TRAFFIC_LABEL[String(t.source_type)]||t.source_type)}</td><td class="num" title="${fmtFull(t.views)}">${fmtMan(t.views)}${miniBar(t.views,trMax)}</td><td class="num">${prev!=null?fmtMan(prev):'—'}</td><td class="num">${prev!=null?pct(t.views,prev):'—'}</td></tr>`;
  }).join('');

  const pp = rep.post_plan || {planned:0,posted:0,items:[]};
  const ai = rep.ai_analysis;

  document.getElementById('sheet').innerHTML = `
<h1>りいポーカーチャンネル 週次レポート<span class="badge ${rep.final?'final':'flash'}">${rep.final?'確定':'速報'}</span></h1>
<div class="sub">対象期間: ${fmtDate(rep.week_start)}（土）〜 ${fmtDate(rep.week_end)}（金）　${rep.final?`Analytics確定値 ${rep.confirmed_days}/7日`:`※速報値（確定 ${rep.confirmed_days}/7日）。確定データが揃い次第自動更新されます`}</div>

${verdictBlock(rep, views, viewsPrev)}

<h2>基本指標（前週比）</h2>
<table><tr><th>指標</th><th class="num">今週</th><th class="num">前週</th><th class="num">増減率</th></tr>
${sumRows.map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td></tr>`).join('')}</table>
${c.subscribers_end!=null?`<div class="note">週末時点の登録者数: ${fmtFull(Math.round(c.subscribers_end))} 人</div>`:''}

${trendBlock(rep)}

${causeBlock(rep, views, viewsPrev)}

${ai?`<h2>AI分析と提案</h2>
${ai.headline?`<div style="font-weight:700;font-size:13.5px;padding:9px 13px;background:#eef7f0;border-left:4px solid #4caf7d;border-radius:0 6px 6px 0;margin-bottom:9px">${esc(ai.headline)}</div>`:''}
${String(ai.analysis||'').split(/\n+/).filter(Boolean).map(p=>`<p style="margin:0 0 7px">${esc(p)}</p>`).join('')}
${(ai.suggestions||[]).length?`<div class="suggest"><b style="color:#8a6d1a">今週のアクションプラン</b>
<ol style="margin:5px 0 0;padding-left:20px">${ai.suggestions.map(s=>{
  const t = (typeof s==='string') ? {title:s,actions:[]} : (s||{});
  return `<li style="margin-bottom:6px"><b>${esc(t.title||'')}</b>${(t.actions||[]).length?`<ul style="margin:3px 0 0;padding-left:16px">${t.actions.map(a=>`<li style="margin-bottom:2px">${esc(a)}</li>`).join('')}</ul>`:''}</li>`;
}).join('')}</ol></div>`:''}
${ai.generated_at?`<div class="note">分析生成日: ${fmtDate(String(ai.generated_at).slice(0,10))}</div>`:''}`:''}

<h2>週間トップ動画</h2>
<table><tr><th style="width:26px">#</th><th>タイトル</th><th class="num">今週視聴回数</th><th class="num">前週視聴回数</th></tr>
${(()=>{const L=rep.top_videos||[]; const mx=Math.max(1,...L.map(v=>v.views_week));
  return L.map((v,i)=>`<tr><td>${i+1}</td><td><a href="https://youtube.com/watch?v=${esc(v.video_id)}" target="_blank" rel="noopener" style="color:#1a1a1a">${esc(v.title)}</a></td><td class="num" title="${fmtFull(v.views_week)}">${fmtMan(v.views_week)}${miniBar(v.views_week,mx)}</td><td class="num">${fmtMan(v.views_prev_week)}</td></tr>`).join('')||'<tr><td colspan="4">データなし</td></tr>';})()}</table>

${firstBlock(rep)}

<h2>流入経路</h2>
${trList.length?`${hbarSVG(trList.slice(0,6).map(t=>{
  const pv = trP.get(String(t.source_type));
  return {label: esc(TRAFFIC_LABEL[String(t.source_type)]||t.source_type),
          bars: [{v:t.views,color:C_NOW}, ...(pv!=null?[{v:pv,color:C_PREV}]:[])],
          right: fmtMan(t.views) + (pv!=null?` <tspan fill="#888" font-weight="400">(${pct(t.views,pv)})</tspan>`:'')};
}),{labelW:150,rightW:120,rowH:30})}
<div class="note"><span style="display:inline-block;width:9px;height:9px;background:${C_NOW};border-radius:2px;vertical-align:-1px"></span> 今週　<span style="display:inline-block;width:9px;height:9px;background:${C_PREV};border-radius:2px;vertical-align:-1px"></span> 前週　／ 上位6経路。かっこ内は前週比。</div>`:'<div class="note">この週の流入経路データはまだ取得されていません（次回の自動更新で追加されます）</div>'}


${couponBlock(rep)}

${planBlock(rep, pp)}

<div class="foot">CHANNEL DESK 自動生成 ／ 表示日時: ${new Date().toLocaleString('ja-JP')} ／ りいポーカーチャンネル【PokerGuild】</div>`;
}

function onWeekChange(){
  const ws = document.getElementById('weekSelect').value;
  history.replaceState(null,'','report.html?week='+ws);
  const rep = REPORTS.find(r=>r.week_start===ws);
  if(rep) renderReportPage(rep);
}

async function loadReport(){
  document.getElementById('loadMsg').style.display = 'block';
  try{
    // 毎回サーバーに確認しに行く。変わっていなければ 304 が返るだけなので通信量は増えない。
    // ⚠ 既定（省略）に戻さないこと。GitHub Pages のキャッシュで画面が古いままになります。
    const r = await fetch(DATA_URL, { cache: 'no-cache' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    REPORTS = (data.weekly_reports||[]).slice().sort((a,b)=>b.week_start.localeCompare(a.week_start));
    COUPON  = data.coupon || null;
    TREND   = data.weekly_trend || null;
    document.getElementById('loadMsg').style.display = 'none';
    if(!REPORTS.length){
      document.getElementById('loadMsg').style.display = 'block';
      document.getElementById('loadMsg').textContent = 'レポートはまだありません。毎週土曜の朝に自動生成されます。';
      document.getElementById('toolbar').style.display = 'flex';
      return;
    }
    const sel = document.getElementById('weekSelect');
    sel.innerHTML = REPORTS.map(r=>`<option value="${r.week_start}">${fmtDate(r.week_start)} 〜 ${fmtDate(r.week_end)}${r.final?'':'［速報］'}</option>`).join('');
    const q = new URLSearchParams(location.search).get('week');
    const rep = REPORTS.find(r=>r.week_start===q) || REPORTS[0];
    sel.value = rep.week_start;
    document.getElementById('toolbar').style.display = 'flex';
    document.getElementById('sheet').style.display = 'block';
    renderReportPage(rep);
  }catch(e){
    document.getElementById('loadMsg').style.display = 'block';
    document.getElementById('loadMsg').textContent = '読み込み失敗: ' + e.message;
  }
}

// このページはパスワードなしで閲覧可能（ダッシュボード本体のみゲートあり）
loadReport();
