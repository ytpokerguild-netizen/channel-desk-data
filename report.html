<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>週次レポート — 【LightTHREE】 -ポーカーメディア‐</title>
<style>
/* ══════════════════════════════════════════════════════════════
   2026-08-17 全面改訂。「見にくい」という指摘を受け、出典のある原則に沿って直しました。
   根拠（要点だけ・詳細は 引き継ぎ書 §3 の★）:
     ・表に縦罫線を引かない／データ行ごとの横罫も引かない（APA・Science Editor）
     ・罫線は「役割を果たすのにちょうど足りるだけ」薄く（Stephen Few）
     ・地色・背景を敷かない（A List Apart）
     ・文字サイズは3段階まで、強調も3段階まで（NN/g）
     ・数値は右揃え・等幅数字。中央揃えは使わない（Ström）
     ・罫線の代わりに行の高さと列間の余白で読ませる（列間は左右16pxずつ）
     ・和文の行間はフォントの約1.7倍（Typotheque・デジタル庁）
     ・印刷の本文は10〜12pt
   ⚠ ここを「見た目の好み」で戻さないでください。1つずつ出典があります。
   ══════════════════════════════════════════════════════════════ */
  @page{size:A4;margin:16mm}
  *{box-sizing:border-box}
  :root{
    /* 色は5つだけ。増やさないこと（Few: 目立たせるのは注意を要するものだけ） */
    --ink:#1a1a1a;       /* 本文 */
    --ink-2:#555;        /* 副次 */
    --muted:#8a8a8a;     /* 注記 */
    --accent:#8a6d1a;    /* 見出しと強調（1色だけ） */
    --rule:#d9d5c9;      /* 罫線。これ以上濃くしない */
  }
  body{
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
    color:var(--ink); background:#f2f0ea; margin:0;
    font-size:14px;             /* ≒10.5pt。印刷の下限10ptを確保 */
    line-height:1.75;           /* 和文は約1.7倍（Typotheque） */
    font-variant-numeric:lining-nums tabular-nums;   /* 数字を等幅に。列が縦に揃う */
  }
  .sheet{max-width:860px;margin:0 auto;background:#fff;padding:38px 44px 44px;min-height:100vh;box-shadow:0 0 24px rgba(0,0,0,.08)}

  /* ── 文字サイズは3段階（大=h1 / 中=h2 / 本文）＋ 注記 ───────── */
  h1{font-size:23px;line-height:1.4;margin:0 0 3px;font-weight:700;letter-spacing:.01em}
  .sub{color:var(--muted);font-size:11.5px;margin:0 0 26px}
  h2{font-size:15px;line-height:1.5;margin:34px 0 3px;font-weight:700;color:var(--ink)}
  h2 .eyebrow{display:block;font-size:11.5px;font-weight:600;color:var(--accent);letter-spacing:.09em;margin-bottom:2px}
  /* 節の通し番号（2026-08-28 レビュー指摘 B-4）。長い1ページなので現在地の手がかりを置く */
  h2 .eyebrow .secn{color:var(--muted);margin-right:9px;letter-spacing:.02em}
  .lede{color:var(--ink-2);margin:0 0 12px}     /* 見出しの下の1行 */
  /* ★ 補足文は2階層（2026-08-28 レビュー指摘 B-7）。
     .note      … 出典・条件・注意書き（薄く小さく）
     .note.key  … 分析上の意味がある補足（本文に近い濃さ）
     ⚠ 「重要な分析結果」と「データ条件」を同じ薄さにしないこと。 */
  .note{color:var(--muted);font-size:11.5px;line-height:1.65;margin-top:7px}
  .note.key{color:var(--ink-2);font-size:13px;line-height:1.75}

  /* ── 表: 縦罫線なし・データ行の横罫なし・地色なし ───────────── */
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
  th,td{border:none;padding:7px 16px;text-align:left;vertical-align:baseline}
  th:first-child,td:first-child{padding-left:0}
  th:last-child,td:last-child{padding-right:0}
  thead th{font-weight:600;color:var(--muted);font-size:11.5px;padding-bottom:5px;white-space:nowrap;
           border-bottom:1px solid var(--rule)}
  td.num,th.num{text-align:right;white-space:nowrap}   /* 「10.3万」が折り返さないように */
  tbody tr>td{border-bottom:1px solid #f0eee7}   /* ほぼ見えない区切り。消しても可 */
  tbody tr:last-child>td{border-bottom:none}

  /* ── 強調は2か所まで（ページの結論 = verdict / 節の結論 = finding）───── */
  .verdict{border-left:3px solid var(--accent);padding:2px 0 2px 15px;margin:0 0 26px}
  .verdict .lv{font-size:19px;font-weight:700;line-height:1.45}
  .verdict .why{display:block;color:var(--ink-2);font-size:14px;margin-top:5px}

  /* ★ 節の結論（2026-08-28 レビュー指摘 A-1）。
     ⚠ 「囲み枠は1つだけ」の原則をここだけ緩めています。理由:
        いちばん重要な発見（1本を除いても前週を上回る）が薄いグレーの注記に置かれていて、
        視覚上は「注釈」扱いになっていたためです。**注釈ではなく節の結論として見せます。**
     ⚠ 3つめを作らないこと。verdict 19px > finding 16px > 本文 14px の3段階を守ります。
     ⚠ 背景色は付けないこと（地色を敷かない原則）。強さは罫線・文字サイズ・余白で出します。 */
  .finding{border-left:3px solid var(--accent);padding:11px 0 11px 15px;margin:15px 0 0}
  .finding .ft{font-size:16px;font-weight:700;line-height:1.5}
  .finding .fb{font-size:14px;color:var(--ink);margin-top:4px;line-height:1.85}
  .finding .fn{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.6}

  .badge{display:inline-block;font-size:11.5px;padding:1px 9px;border-radius:10px;margin-left:10px;
         vertical-align:4px;font-weight:600;border:1px solid var(--rule);color:var(--muted)}
  .badge.bad{border-color:#c0553f;color:#c0553f}

  /* ★ オーナー判断の通知（2026-08-28 レビュー5回目 §1）。
     ⚠ 判断不要の週はここに何も出さないこと。タイトル横のバッジだけで足ります。
        毎週1行を使うと、結論と数字が下へ押し下げられます。 */
  .onote{border-left:3px solid;padding:8px 0 8px 14px;margin:0 0 16px;font-size:14px;line-height:1.8}
  .onote.confirm{border-color:#8a6d1a;background:none}
  .onote.approve{border-color:#c0553f}
  .onote.approve b{color:#c0553f}

  /* ★ 主要3指標（2026-08-28 レビュー3回目 §1）。オーナーが最初の30秒で見るところ。
     ⚠ 4つめを足さないこと。3つだから一目で入ります。 */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 26px;margin:14px 0 0}
  .tile{padding:0 0 2px}
  .tile .tv{font-size:22px;font-weight:700;line-height:1.35;letter-spacing:.01em}
  .tile .tl{font-size:11.5px;color:var(--muted);margin-top:1px}
  .tile .ts{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  /* 補助指標の1行（総再生時間・登録者・公開本数）。★ ここに指標を足さないこと */
  .subline{margin:11px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.7}
  /* 結論の下の行（次週の確認 / 運用変更 / オーナー判断） */
  .headrows{margin:13px 0 0;border-top:1px solid var(--rule);padding-top:10px}
  .hrow{display:flex;gap:12px;align-items:baseline;font-size:13px;line-height:1.7;margin-top:3px}
  .hrow .hk{flex:0 0 92px;color:var(--muted);font-size:11.5px}
  .hrow .hv{color:var(--ink)}
  .hrow .od{font-weight:700}

  /* ★ 増減の内訳（2026-08-28 レビュー3回目 §2）。
     ⚠ 中央ゼロ線の左右分岐グラフには戻さないこと。読み手に暗算を要求し、
        スマホでは中央線と数値が画面外に出て意味が失われていました。
     ⚠ 棒はすべて左端起点。増加と減少は「別のリスト」に分けます。 */
  .wf{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:14px;
      border-left:3px solid var(--rule);padding:9px 0 9px 14px;margin:4px 0 18px}
  .wf b{font-weight:700}
  .wf .op{color:var(--muted);font-size:12.5px}
  .facwrap{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}
  .facg h4{font-size:12.5px;font-weight:700;margin:0 0 6px;color:var(--ink-2)}
  .fac{margin:0 0 11px}
  .fac .ft2{display:flex;gap:12px;align-items:baseline;justify-content:space-between;font-size:13px;line-height:1.55}
  .fac .fn2{flex:1 1 auto;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fac .fv{flex:0 0 auto;font-weight:700;white-space:nowrap}
  .fbar{height:8px;border-radius:2px;background:#efece3;margin-top:4px}
  .fbar>i{display:block;height:8px;border-radius:2px}
  .facnone{font-size:13px;color:var(--muted)}

  /* ★ 本編と運用詳細の区切り（2026-08-28 レビュー3回目 §3）。
     ⚠ この線より上に運用詳細を足さないこと。上はオーナーが最初の2画面で読む場所です。 */
  .split{margin:44px 0 4px;border-top:2px solid var(--ink);padding-top:9px;
         font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-2)}
  .split span{display:block;font-weight:400;font-size:11.5px;color:var(--muted);letter-spacing:0;margin-top:2px}

  /* スマホ用の積み上げ表示。PC では隠す（同じ数字を2回描くので、必ず片方だけ出すこと） */
  .mobonly{display:none}
  /* ★ 印刷の1ページ目を作るための切り替え（2026-08-28 レビュー4回目 §1）。
     Web は情報量をそのまま保ち、**印刷のときだけ本編を圧縮**します。
     .noprint    … 画面には出すが紙には出さない
     .printonly  … 紙にだけ出す（運用詳細に置く「完全版」）
     ⚠ 同じ数字を画面と紙で2回描いています。**必ず同じ元データから作ること。** */
  .printonly{display:none}

  /* ★ 打ち手（2026-08-28 レビュー指摘 A-4）。3つを一目で数えられることが目的。
     ⚠ カードの背景・影は付けないこと。数えられれば十分です。 */
  .acts2{margin:9px 0 0}
  .act{display:flex;gap:14px;align-items:baseline;padding:15px 0;border-top:1px solid var(--rule)}
  .act:first-child{border-top:none;padding-top:5px}
  .act .an{flex:0 0 auto;min-width:22px;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.05em}
  .act .ak{font-weight:400;font-size:11px;color:var(--muted);margin-top:1px}
  /* 折りたたみ（確認方法・主要指標の詳細）。⚠ 既定は閉じたまま。開いた状態で保存しないこと */
  .more{margin-top:5px}
  .more>summary{cursor:pointer;font-size:11.5px;color:var(--accent);letter-spacing:.03em;
                list-style:none;display:inline-block;padding:1px 0}
  .more>summary::-webkit-details-marker{display:none}
  .more>summary::before{content:"＋ "}
  .more[open]>summary::before{content:"− "}
  .act .at{font-size:15px;font-weight:700;line-height:1.5}
  .act .aa{color:var(--ink-2);font-size:12.5px;line-height:1.75;margin-top:3px}

  /* ★ グラフ・広い表は横スクロール枠に入れる（2026-08-28 レビュー指摘 D）。
     ⚠ viewBox のまま縮めると、390px幅では 10px の文字が 4px になって読めません。
        狭い画面では縮めずに横へ流します。 */
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* 横に続きがあるときだけ、その側の端に影が出る（CSS の shadow-scroll）。
     ⚠ これは地色ではなく「まだ右に続く」という操作の合図です。データの背景は敷きません。
     ⚠ 白の2枚は background-attachment:local（中身と一緒に動く＝端に着いたら影を隠す）、
        影の2枚は scroll（枠に固定）。この組み合わせを崩すと影が出っぱなしになります。 */
  .scrollx{
    background:
      linear-gradient(to right, #fff 32%, rgba(255,255,255,0)) left center,
      linear-gradient(to left,  #fff 32%, rgba(255,255,255,0)) right center,
      radial-gradient(farthest-side at 0 50%,   rgba(0,0,0,.13), rgba(0,0,0,0)) left center,
      radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.13), rgba(0,0,0,0)) right center;
    background-repeat:no-repeat;
    background-size:34px 100%, 34px 100%, 13px 100%, 13px 100%;
    background-attachment:local, local, scroll, scroll;
  }

  .foot{margin-top:38px;color:var(--muted);font-size:11.5px;border-top:1px solid var(--rule);padding-top:8px}
  .toolbar{max-width:860px;margin:0 auto;padding:14px 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .toolbar select,.toolbar button,.toolbar a{font-family:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid #cbc5b4;background:#fff;color:#333;cursor:pointer;text-decoration:none}
  .toolbar button:hover,.toolbar a:hover{background:#f5f1e6}
  .msg{max-width:860px;margin:40px auto;text-align:center;color:#666}
  /* ── 狭い画面（2026-08-28 レビュー指摘 D）───────────────────
     ⚠ ページ全体を縮小して PC 版をそのまま見せないこと。文字が読めなくなります。
     ⚠ 本文は 14px 未満にしないこと。 */
  @media (max-width:640px){
    .sheet{padding:22px 16px 30px}
    h1{font-size:20px;line-height:1.45}
    .verdict .lv{font-size:17px}
    .finding .ft{font-size:15px}
    th,td{padding:7px 10px}
    /* 主要3指標と増減の2列は縦に積む */
    .tiles{grid-template-columns:1fr;gap:13px 0}
    .tiles .tile{border-top:1px solid #f0eee7;padding-top:9px}
    .tiles .tile:first-child{border-top:none;padding-top:0}
    .facwrap{grid-template-columns:1fr;gap:0}
    .facg+.facg{margin-top:16px}
    .hrow{flex-direction:column;gap:0}
    .hrow .hk{flex:none}
    /* 表を隠して積み上げカードに差し替える節がある */
    .mobonly{display:block}
    .pconly{display:none}
    /* 印刷はPC運用なので、狭い画面ではボタンを出さない（2026-08-28 レビュー4回目 §5）。
       単独で2段目に回り、読み始めるまでの高さを使っていました。 */
    .toolbar .printbtn{display:none}
  }
  /* ★ 横スクロールは「運用詳細」だけに許す（2026-08-28 レビュー3回目 §6）。
     ⚠ 本編（結論・主要指標・増減・流入・アクション）で横スクロールを発生させないこと。
        オーナーが最初に読む情報をスワイプさせないためです。本編は縦積みのHTMLで出します。 */
  @media (max-width:760px){
    .detail .scrollx>svg{min-width:700px}
    .detail .scrollx>table{min-width:600px}
  }

  @media print{
    body{background:#fff}
    .sheet{box-shadow:none;padding:0;max-width:none;min-height:auto}
    h2,.lede{break-after:avoid;break-inside:avoid}
    table,svg{break-inside:avoid}
    .verdict{break-inside:avoid}
    /* ★ 見出しだけがページ下端に取り残されないように（2026-08-28 レビュー指摘 B-8）。
       ⚠ 特に「流入グラフ＋その結論」は必ず同じページに載せること。 */
    .finding{break-inside:avoid;break-before:avoid}
    .act,.acts2{break-inside:avoid}
    .tiles,.headrows,.wf,.fac{break-inside:avoid}
    /* ★ 紙は縦が足りないので本編を詰める（2026-08-28 レビュー3回目 §10-6）。
       ⚠ 本文の 14px は下げないこと（印刷の本文は10〜12pt が下限。14px ≒ 10.5pt）。
          詰めてよいのは**余白と見出しの間隔だけ**です。 */
    h2{margin:11px 0 2px}
    h1{font-size:20px}
    .sub{margin-bottom:14px}
    .verdict{margin-bottom:9px}
    .verdict .lv{font-size:17px}
    .tiles{margin-top:7px;gap:2px 20px}
    .tile .tv{font-size:17px}
    .subline{margin-top:7px;font-size:12px}
    .headrows{margin-top:7px;padding-top:6px}
    .hrow{line-height:1.55;margin-top:2px}
    .wf{margin:2px 0 8px;padding:5px 0 5px 12px}
    .fac{margin-bottom:4px}
    .fbar,.fbar>i{height:6px}
    .act{padding:7px 0}
    .act .at{font-size:14px}
    .finding{padding:6px 0 6px 13px;margin-top:8px}
    .finding .ft{font-size:14px}
    table{margin-top:2px}
    th,td{padding:4px 14px}
    /* ★ 「運用詳細」の前で改ページ（2026-08-28 レビュー3回目 §3）。
       PDF の1ページ目だけで、今週どうだったか・なぜか・来週どうするか・判断依頼があるか
       が完結するようにするためです。⚠ この改ページを外さないこと。 */
    .split{break-before:page;page-break-before:always}
    .scrollx{overflow-x:visible;background:none}
    .scrollx>svg,.scrollx>table{min-width:0}
    .mobonly{display:none!important}
    .pconly{display:block!important}

    /* ══════════════════════════════════════════════════════════
       ★ 紙の1ページ目を「オーナー向け報告だけ」で完結させる（2026-08-28 レビュー4回目 §1）。
         Web は情報量をそのまま保ち、**紙のときだけ本編を圧縮**します。
         1ページ目に残すもの: 結論 / 主要3指標 / 補助指標1行 / 前週からの変化(要約と上位2件) /
                              流入上位2経路と結論 / アクション3件のタイトル / オーナー判断
         2ページ目以降へ回すもの: 主要指標の完全な表 / 増減要因の全項目 / 流入3位以下 /
                              アクションの詳しい確認方法 / 上位動画8本 / 新作初速 / クーポン / 26週比較
       ⚠ ここを緩めると1ページに収まらなくなります。**指標や行を足さないこと。**
       ══════════════════════════════════════════════════════════ */
    .noprint{display:none!important}
    .printonly{display:block!important}
    /* ⚠ !important が必要です。上の .pconly{display:block!important} が
       これらより強く効いてしまい、外すと本編の図が紙にも出て2ページになります。 */
    /* 主要指標の節ごと本編から落とす（冒頭の補助指標1行が代わり。完全版は運用詳細） */
    .main .sumsec{display:none!important}
    /* 増減要因は片側2件まで。3件目以降と集計条件の注記は運用詳細の完全版へ */
    .main .facg .fac:nth-of-type(n+3){display:none!important}
    .main .facnote{display:none!important}
    /* 流入は上位2経路だけ。SVG（凡例を含む）を落として印刷用の2行に差し替える */
    .main .trafficsvg{display:none!important}
    /* 運用詳細の完全版では、逆に印刷用の2行のほうを出さない */
    .detail .trafficprint{display:none!important}
    /* ★ 紙の1ページ目のアクションは **タイトル＋補足1行** まで（レビュー4回目 §4-5 の形）。
       画面では折りたたみ（.more）にしてある詳しい確認方法は、紙では**入口ごと消し**、
       運用詳細側の完全版（actListFull）で出します。
       ⚠ 折りたたみの見出し（「＋ 確認方法を見る」）が紙に残ると、押せないボタンが並びます。
       ⚠ 1ページに収まらなくなったら、まず `.main .act .aa{display:none}` を足して
          タイトルだけにしてください。**本文14pxを下げるのは最後の手段です。** */
    .main .more{display:none!important}
    .main .act{padding:4px 0}
    .main .act .an{display:flex;gap:6px;align-items:baseline;min-width:62px}
    .main .act .ak{margin-top:0}
    /* 流入の結論の「計測条件」は紙の1ページ目には出さない（運用詳細の完全版にある） */
    .main .finding .fn{display:none!important}
    /* 分析メモは紙に出さない（本編と計算方法・方針が食い違うため） */
    .memo{display:none!important}

    /* ★ 紙では節番号を振り直す（2026-08-28 レビュー5回目 §3-2）。
       「01 主要指標」を紙で落としているため、画面の番号をそのまま出すと
       **02 から始まる「01 が抜けた資料」**に見えます。
       ⚠ display:none の要素はカウンタを増やしません。だから隠した節は自動で飛ばされます。
         この性質に頼っているので、`.sumsec` の隠し方を visibility:hidden 等に変えないこと。 */
    .secn{display:none}
    .sheet{counter-reset:psec}
    h2 .eyebrow::before{
      counter-increment:psec;
      content:counter(psec, decimal-leading-zero) "\00a0\00a0";
      color:var(--muted);letter-spacing:.02em;
    }
    /* ⚠ !important は消さないこと。JS が toolbar に style.display='flex' を
       インラインで当てるため、!important が無いと印刷・PDF にツールバーが写り込みます
       （2026-08-17 に実際に混入した PDF を出しかけました）。 */
    .toolbar{display:none!important}
  }
</style>
</head>
<body>

<div class="toolbar" id="toolbar" style="display:none">
  <a href="index.html">← ダッシュボード</a>
  <select id="weekSelect" onchange="onWeekChange()"></select>
  <button class="printbtn" onclick="window.print()">🖨 印刷 / PDF保存</button>
</div>

<div class="msg" id="loadMsg" style="display:none">読み込み中...</div>
<div class="sheet" id="sheet" style="display:none"></div>

<script>
const DATA_URL = 'data.json';
// ?debug=1 のときだけ出す内部向け表示（いまは「分析メモ」だけ）。
// ⚠ ここに機微なものを足さないこと。URL に付けるだけで誰でも見られます。
const DEBUG = new URLSearchParams(location.search).get('debug') === '1';
let REPORTS = [];
// ★ チャンネル名は data.json の meta.channel_title から入れます（2026-08-21 追加）。
//    ここの初期値は data.json を読めなかったときの保険です。⚠ 直書きに戻さないこと。
let CHANNEL = '【LightTHREE】 -ポーカーメディア‐';
let COUPON  = null;   // data.json の coupon（週ごとの節を出すのに使う）
let TREND   = null;   // data.json の weekly_trend（直近26週のグラフ用）

const fmtFull = n => (n??0).toLocaleString('ja-JP');
// ★ スパークライン（2026-08-17 追加）。表の1セルに26週ぶんの形を入れる。
// 節を増やさずに「6か月の文脈」を足すための形（Tufte がこの用途で作ったもの）。
// ⚠ 軸も目盛りも付けません。**形だけ**を見るものです。数値は隣のセルにあります。
function sparkline(vals, {w=86,h=20,color='#8a8a8a'}={}){
  if(!vals || vals.length < 4) return '';
  const mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  const x=i=>(i/(vals.length-1))*(w-3)+1.5, y=v=>h-2-((v-mn)/rg)*(h-5);
  const d=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const lx=x(vals.length-1), ly=y(vals[vals.length-1]);
  const zero = (mn<0 && mx>0) ? `<line x1="1.5" y1="${y(0).toFixed(1)}" x2="${w-1.5}" y2="${y(0).toFixed(1)}" stroke="#e8e5dc" stroke-width="1"/>` : '';
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;margin-left:auto" aria-hidden="true">
${zero}<path d="${d}" fill="none" stroke="${color}" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.4" fill="${TREND_CUR}"/></svg>`;
}

// ★ 万表記（2026-08-17 追加・オーナーの指摘「数字が理解しにくい」）。
//   日本語では 587,400回 より 58.7万回 のほうが一瞬で入ります。
//   ⚠ **ツールチップと表の小さい数字には生の値を残すこと。**万に丸めると精密な比較ができなくなります。
//   ⚠ ダッシュボード（index.html）の fmt() と同じ規則にしてあります。片方だけ変えないこと。
const fmtMan  = n => (n==null) ? '—' : (Math.abs(n)>=10000
                    ? (n/10000).toFixed(1).replace(/\.0$/,'')+'万'
                    : n.toLocaleString('ja-JP'));
// ⚠ 表の中の細い棒（miniBar）は 2026-08-28 に削除しました。
//   数値の下に3pxの短い線が出るだけで、下線・読み込み表示・装飾のどれとも見分けがつかず、
//   一覧はもともと視聴回数順なので順位の情報も足していませんでした（レビュー指摘 B-2）。
//   復活させるなら中途半端な下線ではなく、セル全体に敷く比例バーにしてください。
const fmtDate = s => s ? s.replace(/-/g,'/') : '';
const fmtMin  = m => m >= 60 ? Math.round(m/60).toLocaleString()+'時間' : (m||0).toLocaleString()+'分';
const esc     = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pct     = (a,b)=> (b==null||!b) ? '—' : ((a-b)/b*100>=0?'+':'')+((a-b)/b*100).toFixed(1)+'%';

// YouTube Studio の表記に準拠（APIの値 → Studioの日本語ラベル）
const TRAFFIC_LABEL = {
  'SUBSCRIBER':'ブラウジング機能','YT_SEARCH':'YouTube検索','SHORTS':'ショートフィード',
  'EXT_URL':'外部','NOTIFICATION':'通知','RELATED_VIDEO':'関連動画',
  'BROWSE':'ブラウジング機能','CHANNEL':'チャンネルページ','YT_CHANNEL':'チャンネルページ',
  'DIRECT':'直接入力','ADVERTISING':'広告','PLAYLIST':'再生リスト',
  'END_SCREEN':'終了画面','NO_LINK_EMBEDDED':'埋め込み','OTHER':'その他',
  'ANNOTATION':'アノテーション','CAMPAIGN_CARD':'プロモーション',
  'SHORTS_CONTENT_LINKS':'ショート内リンク','YT_OTHER_PAGE':'その他のYouTube機能',
  'NO_LINK_OTHER':'直接入力または不明','SOUND_PAGE':'音源ページ','HASHTAGS':'ハッシュタグ',
  '3':'ブラウジング','9':'YouTube検索','10':'関連動画','4':'チャンネルページ',
  '5':'外部サイト','7':'Google検索','19':'通知','18':'エンドスクリーン',
  '11':'再生リスト','0':'直接/不明','1':'広告','17':'プロモーション','8':'その他'
};

// ════════════════════════════════
// 直近26週（約6か月）の位置づけ
// 2026-08-17 追加（オーナーの依頼「週間しかないので直近3〜6月とも比較したい」）。
// ⚠ 前週比だけだと読み違えます。2026-08-08 週は前週比 -51.9% でしたが、
//   26週平均の 106% で「平年並みかやや上」でした。前週が突出していただけです。
// ⚠ **外部ライブラリを使わず SVG を直接書いています。**印刷/PDF で確実に出すためです。
//   Chart.js に置き換えないでください（CDN が落ちると白紙になります）。
// ⚠ 色は「強調」の形です。見ている週だけ濃い金、他は薄いグレー。1系列なので凡例は出しません。
//   薄いグレーは白地に対して 3:1 未満なので、**目盛りと当週の直接ラベルが必須**です（外さないこと）。
// ════════════════════════════════
const TREND_CUR = '#8a6d1a';   // 見ている週
const TREND_CTX = '#b3ada0';   // それ以外の週（文脈）

// 上だけ角丸・底は直角のカラム（データの端だけ丸める）
function colPath(x, y, w, h, r){
  if(h <= 0) return '';
  const rr = Math.min(r, h, w/2);
  return `M${x} ${y+h} L${x} ${y+rr} Q${x} ${y} ${x+rr} ${y} L${x+w-rr} ${y} Q${x+w} ${y} ${x+w} ${y+rr} L${x+w} ${y+h} Z`;
}
function niceMax(v){
  if(v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for(const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]){ if(v <= m*p) return m*p; }
  return 10*p;
}

// 6か月平均に対する比（見出しで使う）
function trendPct(rep){
  const T=TREND; if(!T||T.length<4) return '—';
  const i=T.findIndex(d=>d.week_start===rep.week_start); if(i<0) return '—';
  const avg=T.reduce((s,d)=>s+d.views,0)/T.length;
  return Math.round(T[i].views/avg*100)+'%';
}

// 6か月グラフの見出し（結論の文にする）
function trendAssert(rep){
  const T=TREND; if(!T||T.length<4) return '';
  const i=T.findIndex(d=>d.week_start===rep.week_start); if(i<0) return '';
  const avg=T.reduce((s,d)=>s+d.views,0)/T.length;
  const r=Math.round(T[i].views/avg*100);
  const rank=T.map(d=>d.views).slice().sort((a,b)=>b-a).indexOf(T[i].views)+1;
  return r>=110 ? `${T.length}週の中では上位（${rank}位・平均の${r}%）です`
       : r>=90  ? `${T.length}週の平均とほぼ同じ水準（${rank}位・${r}%）です`
                : `${T.length}週の中では低め（${rank}位・平均の${r}%）です`;
}

// 流入経路（横棒・今週/前週）
// ════════════════════════════════
// 流入元を「いちばん多い1本」と「それ以外」に割る（2026-08-25 追加・レビュー指摘 A-4）
//   なぜ: 「この経路が伸びた」だけでは、単発ヒットの副産物なのか、
//         チャンネル全体の流入が変わったのかを区別できないため。
//   ⚠ ここでは因果を書きません。「1本を抜いても前週を超えているか」という
//     事実だけを出します。抜いた残りが前週割れなら、1本で説明がつく可能性が高い、
//     というのは読み手の判断です。
//   ⚠ video_traffic は上位5本ぶんしかありません。「それ以外」には
//     6本目以降と過去動画がまとめて入ります。1本を引く以上のことはできません。
// ════════════════════════════════
// ⚠ 計算と描画を分けてあります。冒頭の3つめのタイル（verdictBlock）が
//   同じ判定「1本を除いても前週を上回るか」を先に必要とするためです。
//   window._SPLIT に置いて共有します。片方だけ直さないこと。
function trafficSplitData(rep){
  const vt = rep.video_traffic;
  if(!vt || !window._TR || !window._TR.list.length) return null;
  const {list, prev} = window._TR;
  const t0 = list[0], st = String(t0.source_type);
  const p0 = prev.get(st);
  if(p0==null || !t0.views) return null;

  const titles = {};
  (rep.top_videos||[]).forEach(v=>{ titles[v.video_id]=v.title; });
  (rep.new_videos||[]).forEach(v=>{ if(v.video_id) titles[v.video_id]=v.title; });

  const rows = Object.keys(vt).map(vid=>{
    const m = (vt[vid]||[]).find(r=>String(r.source_type)===st);
    return {vid, v: m? m.views : 0};
  }).filter(r=>r.v>0).sort((a,b)=>b.v-a.v);
  if(!rows.length) return null;

  const top = rows[0], rest = t0.views - top.v;
  return {nm: TRAFFIC_LABEL[st]||st, now: t0.views, p0, top, rest,
          title: titles[top.vid]||top.vid, restBeatsPrev: rest > p0};
}
function trafficSplitBlock(rep){
  const S = window._SPLIT || trafficSplitData(rep);
  if(!S) return '';
  // ★ ここはこのレポートでいちばん重要な発見です（2026-08-28 レビュー指摘 A-1）。
  //   ⚠ .note（薄いグレーの注記）に戻さないこと。**節の結論**として見せます。
  //     「総視聴の増加は1本」と「流入構造の変化は1本ではない」を分けて読ませるのが目的で、
  //     ここが注釈の見た目だと、読み手は前者だけを持ち帰ります。
  //   ⚠ 「この経路の19%」という構成比は出しません（構成比を出さない方針・レビュー3回目 §8）。
  //     実数だけで結論は伝わります。
  //   ⚠ 1週の結果だけで「流入構造が変わった」と断定しないこと。書けるのは「兆候」までです。
  const title = S.restBeatsPrev
    ? `この1本を除いても${esc(S.nm)}は前週を上回ります`
    : `${esc(S.nm)}の増加は、この1本によるものです`;
  return `<div class="finding">
<div class="ft">${title}</div>
<div class="fb">いちばん多い1本「${esc(cut(S.title,22))}」は <b>${fmtMan(S.top.v)}回</b>。
除いた残りは <b>${fmtMan(S.rest)}回</b>で、前週の <b>${fmtMan(S.p0)}回</b>を${S.restBeatsPrev?'<b>上回ります</b>':'<b>下回ります</b>'}。
${S.restBeatsPrev?'1本だけでは説明できない増加で、<b>構造変化の兆候</b>があります（1週では確定できません）。':''}</div>
<div class="fn">${esc(S.nm)}は今週 ${fmtMan(S.now)}回（前週 ${fmtMan(S.p0)}回）。※ 動画ごとの内訳は上位5本ぶんだけです。「除いた残り」には6本目以降と過去動画が入ります</div>
</div>`;
}

// 前週の順位。片方だけ直さないよう、SVG版とスマホ版で共有する
function trafficRanks(){
  const {prev} = window._TR;
  return new Map([...prev.entries()].sort((a,b)=>b[1]-a[1]).map(([k],i)=>[String(k), i+1]));
}
// ★ スマホ用（2026-08-28 レビュー3回目 §6）。
//   ⚠ 本編のグラフを横スクロールに逃がさないこと。同じデータを縦積みのHTMLで出し、
//     CSS（.pconly / .mobonly）で表示を切り替えます。**外部ライブラリは要りません。**
//   ⚠ PC版と数字がずれないよう、必ず window._TR から作ること。
function trafficMobile(){
  const {list, prev} = window._TR;
  const rk = trafficRanks();
  return `<div class="mobonly">${list.slice(0,4).map((t,i)=>{
    const st=String(t.source_type), pv=prev.get(st), pr=rk.get(st), cr=i+1;
    const moved = pr && pr!==cr && (pr<=3 || cr<=3);
    return `<div class="fac"><div class="ft2"><span class="fn2"><b>${esc(TRAFFIC_LABEL[st]||t.source_type)}</b></span><span class="fv">${fmtMan(t.views)}回</span></div>
<div class="fbar"><i style="width:${Math.max(2,Math.round(t.views/Math.max(1,list[0].views)*100))}%;background:${C_NOW}"></i></div>
<div class="note" style="margin-top:3px">前週 ${pv!=null?fmtMan(pv)+'回':'—'}${moved?` ／ <b style="color:${cr<pr?C_UP:C_DOWN}">${pr}位→${cr}位</b>`:''}</div></div>`;
  }).join('')}<div class="note">上位4経路。画面の広い端末では上位6経路を図で見られます</div></div>`;
}
function trafficChart(){
  if(!window._TR || !window._TR.list.length) return '';
  const {list, prev} = window._TR;
  // 見出しの「首位が入れ替わり」を図の上でも確かめられるようにする。
  // ⚠ ここに構成比（%）は出さないこと。1本の動画で毎週動くため、意味の薄い数字になります。
  const prevRank = trafficRanks();
  return `<div class="pconly trafficsvg">` + hbarSVG(list.slice(0,6).map((t,i)=>{
    const st = String(t.source_type), pv = prev.get(st);
    const pr = prevRank.get(st), cr = i+1;
    const moved = pr && pr!==cr && (pr<=3 || cr<=3);   // 上位3位に絡む入れ替わりだけ出す
    // ⚠ 前週の実数を全経路に出すと混みます。順位が動いた経路だけにします（2026-08-28 レビュー指摘 B-1）
    const sub = moved ? `前週 ${fmtMan(pv)}回 ／ ${pr}位→${cr}位` : '';
    return {label: esc(TRAFFIC_LABEL[st]||t.source_type),
            // ⚠ 今週と前週を「色だけ」で区別しないこと（2026-08-28 レビュー指摘 A-6）。
            //   前週は薄い塗り＋枠線にしてあります。モノクロ印刷でも別物と分かります。
            bars: [{v:t.views,color:C_NOW}, ...(pv!=null?[{v:pv,color:C_PREV,fill:C_PREV_FILL}]:[])],
            right: fmtMan(t.views)+'回',
            sub, subFill: moved ? (cr<pr ? C_UP : C_DOWN) : ''};
  }),{labelW:168,rightW:142,rowH:33})
  + `<div class="note"><span style="display:inline-block;width:9px;height:9px;background:${C_NOW};border-radius:2px;vertical-align:-1px"></span> 今週　<span style="display:inline-block;width:9px;height:9px;background:${C_PREV_FILL};border:1px solid ${C_PREV};border-radius:2px;vertical-align:-1px"></span> 前週（薄い塗り＋枠線）　／ 上位6経路　／ 右下の「2位→1位」は前週からの順位の動きです（上位3位に絡んだときだけ表示）</div></div>`
  + trafficMobile() + trafficPrint();
}
// ★ 紙の1ページ目に載せる、上位2経路だけの2行（2026-08-28 レビュー4回目 §1）。
//   ⚠ 3位以下を足さないこと。1ページに収まらなくなります。3位以下は運用詳細にあります。
function trafficPrint(){
  const {list, prev} = window._TR;
  const rk = trafficRanks();
  return `<div class="printonly trafficprint" style="margin-top:6px">${list.slice(0,2).map((t,i)=>{
    const st=String(t.source_type), pv=prev.get(st), pr=rk.get(st), cr=i+1;
    const moved = pr && pr!==cr;
    return `<div style="font-size:13px;line-height:1.75"><b>${esc(TRAFFIC_LABEL[st]||t.source_type)}</b>　今週 <b>${fmtMan(t.views)}回</b>｜前週 ${pv!=null?fmtMan(pv)+'回':'—'}${moved?`｜<b style="color:${cr<pr?C_UP:C_DOWN}">${pr}位→${cr}位</b>`:''}</div>`;
  }).join('')}<div class="note" style="margin-top:2px">3位以下は「運用詳細」にあります</div></div>`;
}

function trendBlock(rep){
  const T = TREND;
  if(!T || T.length < 4) return '';                 // 週が少なすぎるうちは出さない
  // 「参考」の図なので、本文より軽く見える高さにおさえる（2026-08-28 レビュー指摘）。
  // ⚠ TOP を小さくしすぎると、いちばん高い棒の上に出す注記（ann / curLab）が枠外に切れます。
  const W = 780, H = 156, PL = 58, PR = 8, TOP = 32, BASE = 112;
  const plotW = W - PL - PR;
  const band  = plotW / T.length;
  const bw    = Math.min(24, Math.max(3, band - 2));   // ≤24px・隣と2pxあける
  const max   = niceMax(Math.max(...T.map(d=>d.views)));
  const avg   = T.reduce((s,d)=>s+d.views,0) / T.length;
  const yOf   = v => BASE - (v/max) * (BASE - TOP);
  const curIx = T.findIndex(d=>d.week_start===rep.week_start);

  // 目盛り（0・半分・上限）。丸い数字だけにする
  const ticks = [0, max/2, max].map(v=>
    `<line x1="${PL}" y1="${yOf(v).toFixed(1)}" x2="${W-PR}" y2="${yOf(v).toFixed(1)}" stroke="#e8e5dc" stroke-width="1"/>
     <text x="${PL-7}" y="${(yOf(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#888">${fmtMan(Math.round(v))}</text>`).join('');

  const bars = T.map((d,i)=>{
    const x = PL + band*i + (band-bw)/2, y = yOf(d.views);
    const on = i === curIx;
    return `<path d="${colPath(x, y, bw, BASE-y, 4)}" fill="${on?TREND_CUR:TREND_CTX}"><title>${fmtDate(d.week_start)}〜${fmtDate(d.week_end)}　${fmtFull(d.views)}回　登録純増 ${d.subs_net>=0?'+':''}${d.subs_net}</title></path>`;
  }).join('');

  // 月が変わる週だけ x ラベルを出す（全部出すと重なる）
  const xlab = T.map((d,i)=>{
    const m = d.week_start.slice(5,7);
    if(i>0 && T[i-1].week_start.slice(5,7)===m) return '';
    return `<text x="${(PL+band*i+band/2).toFixed(1)}" y="${BASE+15}" text-anchor="middle" font-size="10" fill="#888">${parseInt(m,10)}月</text>`;
  }).join('');

  // 見ている週の値を直接ラベル（薄いグレーの説明責任 = 目盛り＋この数字）
  let curLab = '';
  if(curIx >= 0){
    const d = T[curIx], x = PL + band*curIx + band/2, y = yOf(d.views);
    const anchor = curIx > T.length-4 ? 'end' : (curIx < 3 ? 'start' : 'middle');
    const dx = anchor==='end' ? bw/2 : (anchor==='start' ? -bw/2 : 0);
    // ★「今週」を棒の上に直接書く（2026-08-28 レビュー指摘 B-5）。
    //   凡例（濃い色がこの週）を下まで読まないと分からない状態をやめます。
    curLab = `<text x="${(x+dx).toFixed(1)}" y="${(y-19).toFixed(1)}" text-anchor="${anchor}" font-size="10" fill="#6b6659">今週</text>
<text x="${(x+dx).toFixed(1)}" y="${(y-7).toFixed(1)}" text-anchor="${anchor}" font-size="11" font-weight="700" fill="#1a1a1a">${fmtMan(d.views)}回</text>`;
  }

  // ★ 山の理由を1つだけ注記する（2026-08-17 追加）。
  //   ⚠ 1つだけにすること。複数打つと図が読めなくなります。
  //   対象は「1本で3割以上を稼いだ週」のうち、いちばん視聴回数が多い週。
  let ann = '';
  const dr = T.map((d,i)=>({d,i})).filter(x=>x.d.driver).sort((a,b)=>b.d.views-a.d.views)[0];
  if(dr && dr.i !== curIx){
    const d=dr.d, x=PL+band*dr.i+band/2, y=yOf(d.views);
    const right = dr.i > T.length*0.55;
    const tx = right ? x-7 : x+7;
    const t  = `${cut(d.driver.title,13)} が${d.driver.share}%`;
    ann = `<line x1="${x.toFixed(1)}" y1="${(y-4).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(y-15).toFixed(1)}" stroke="#b0aa9c" stroke-width="1"/>
<text x="${tx.toFixed(1)}" y="${(y-18).toFixed(1)}" text-anchor="${right?'end':'start'}" font-size="10" fill="#6b6659">${t}</text>`;
  }

  const ya = yOf(avg);
  const cur = curIx>=0 ? T[curIx] : null;
  const ratio = cur ? Math.round(cur.views/avg*100) : null;

  return `
<div class="scrollx"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img"
     aria-label="直近${T.length}週の週間視聴回数。この週は${cur?fmtMan(cur.views):''}回で、${T.length}週平均の${ratio}%。">
  ${ticks}
  ${bars}
  <line x1="${PL}" y1="${ya.toFixed(1)}" x2="${W-PR}" y2="${ya.toFixed(1)}" stroke="#666" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="${PL+2}" y="${(ya-15).toFixed(1)}" width="112" height="13" fill="#fff"/>
  <text x="${PL+5}" y="${(ya-5).toFixed(1)}" font-size="10" fill="#666">${T.length}週平均 ${fmtMan(Math.round(avg))}</text>
  ${ann}
  ${curLab}
  <line x1="${PL}" y1="${BASE}" x2="${W-PR}" y2="${BASE}" stroke="#ddd" stroke-width="1"/>
  ${xlab}
</svg></div>
<div class="note">濃い色がこの週、薄い色がそれ以外の週です。${T.length}週ぶんは <b>7日そろった週だけ</b>を並べています。</div>`;
// ⚠ ここに「前週比だけでは〜」を書き戻さないこと。同じ文が見出し直下（sec の3つめの引数）に出ており、
//   2026-08-28 のレビューで重複を指摘されて消しています。
}

// ════════════════════════════════
// 横棒グラフの部品（2026-08-17 追加）
// オーナーの方針:「まとめ以外のデータの文章を減らし、その分をチャートで直感的に見せる。
//                 まとめと考察には文章を使う」
// ⚠ 表と同じ数字を文章でも書かないこと。**数字は表かグラフ、文章は考察**です。
// 色（すべて検証済み・白地に対して 3:1 以上、色覚多様性でも区別できる）:
//   増 #1f6f9c / 減 #c0553f（発散・protan でも ΔE 14.3）
//   今週 #8a6d1a / 前週 #6f8f9e（2系列・ΔE 15.5）
//   1系列 #b3ada0
// ════════════════════════════════
const C_UP='#1f6f9c', C_DOWN='#c0553f', C_NOW='#8a6d1a', C_PREV='#6f8f9e', C_ONE='#b3ada0';
// 前週の棒の塗り。色を増やすのではなく「塗りつぶし / 薄い塗り＋枠線」という形の差を作るためのもの
const C_PREV_FILL='#dde7ec';

// rows:   [{label, bars:[{v,color,fill}], right, sub, subFill}]  ゼロから右に伸びる横棒
//   bars[].fill … 指定すると「薄い塗り＋color の枠線」になる。色を増やさずに形で区別するため
//   sub          … 右の数字の下に添える小さな注記（前週の実数・順位変化など）。省略可
// guides: [{v,label,dash,color}]  縦の基準線（中央値など）。省略可
function hbarSVG(rows, {W=780, labelW=250, rightW=70, rowH=26, max=null, guides=null}={}){
  if(!rows.length) return '';
  const G  = (guides||[]).filter(g=>g && g.v>0);
  const TP = G.length ? 15 : 0;                      // 基準線のラベルぶんを上に空ける
  const H  = TP + rows.length*rowH + 6;
  const x0 = labelW, plotW = W - labelW - rightW;
  const mx = max || Math.max(1, ...rows.flatMap(r=>r.bars.map(b=>b.v||0)));
  const body = rows.map((r,i)=>{
    const y0 = TP + i*rowH + 3;
    const n  = r.bars.length;
    const bh = Math.min(14, (rowH-8-2*(n-1))/n);       // 2px の隙間で区切る
    const bars = r.bars.map((b,j)=>{
      const w = Math.max(1, (b.v||0)/mx*plotW), y = y0 + (rowH-8-(bh*n+2*(n-1)))/2 + j*(bh+2);
      return `<rect x="${x0}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${b.fill||b.color}"${b.fill?` stroke="${b.color}" stroke-width="1"`:''}/>`;
    }).join('');
    // sub があるときは右の数字を少し上げ、その下に小さく添える（2026-08-28 追加）
    const cy = y0 + rowH/2, ry = r.sub ? cy-5 : cy-1;
    return `${bars}
<text x="${labelW-8}" y="${(cy-1).toFixed(1)}" text-anchor="end" font-size="11" fill="#1a1a1a">${r.label}</text>
<text x="${W-4}" y="${ry.toFixed(1)}" text-anchor="end" font-size="11" fill="#444" font-weight="600">${r.right}</text>${r.sub?`
<text x="${W-4}" y="${(cy+9).toFixed(1)}" text-anchor="end" font-size="10" fill="${r.subFill||'#6b6659'}" font-weight="700">${r.sub}</text>`:''}`;
  }).join('');
  // ★ 基準線は棒より後に描いて上に載せる（2026-08-28 レビュー指摘 A-5）。
  //   見出しの文で「中央値の2倍を超えた」と書いても、図の側に判定線が無いと目で確かめられません。
  const gl = G.map(g=>{
    const gx = x0 + Math.min(1, g.v/mx)*plotW;
    const end = gx > W - rightW - 96;
    return `<line x1="${gx.toFixed(1)}" y1="${TP-4}" x2="${gx.toFixed(1)}" y2="${H-3}" stroke="${g.color||'#b0aa9c'}" stroke-width="1" stroke-dasharray="${g.dash||'3 3'}"/>
<text x="${(end?gx-4:gx+4).toFixed(1)}" y="10" text-anchor="${end?'end':'start'}" font-size="10" fill="#6b6659">${g.label}</text>`;
  }).join('');
  return `<div class="scrollx"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${body}${gl}</svg></div>`;
}

// ⚠ divSVG（中央のゼロ線から左右に伸びる増減グラフ）は 2026-08-28 に削除しました。
//   レビュー3回目 §2 の指摘: 「今週の再生回数」なのか「前週との差」なのか「差への寄与」なのかが
//   図から判別できず、青と赤を足すと何になるのかも読み取れない。読み手に暗算を要求していた。
//   さらにスマホでは中央線と右の数値が画面外に出て、意味がほぼ失われていました。
//   ⚠ 復活させないこと。代わりは causeBlock（前週→増加→減少→今週 ＋ 左端起点の2リスト）です。

// ラベル欄に入る文字数は幅から計算する（11px フォントで日本語は約12px/字）。
// ⚠ 直に文字数を決め打ちすると、長いタイトルで左にはみ出して切れます（2026-08-17 に実際に起きた）。
const fitChars = labelW => Math.max(6, Math.floor((labelW-14)/12));
const cut = (t,n)=> (t||'').length>n ? esc(t.slice(0,n-1))+'…' : esc(t||'');

// ════════════════════════════════
// 増減の内訳（2026-08-28 全面作り直し・レビュー3回目 §2）
//
// ⚠ 中央ゼロ線から左右に伸ばす divSVG には戻さないこと。指摘された問題:
//   ・「今週の再生回数」なのか「前週との差」なのか「差への寄与」なのかが図から分からない
//   ・青と赤を足すと何になるのかが読み取れない
//   ・読み手に暗算（中央からの距離の比較）を要求する
//   ・スマホでは中央線と右の数値が画面外に出て、意味がほぼ失われる
//
// 代わりに「前週 → 増加要因 → 減少要因 → 今週」を先に文で見せ、
// そのあと増加と減少を**別のリスト**にして、棒はすべて左端起点にします。
//
// ⚠ 合計は必ず一致させること。increase + decrease === 今週 − 前週。
//   top_videos は上位8本ぶんしかないので、それ以外は「その他の動画（合計）」に入れ、
//   その符号の側へ寄せています。**その他は増減を打ち消し合った正味の値**です。
// ⚠ 「増加分の87%を1本が占める」という割合は出さないこと。
//   分母が純増（増加要因−減少要因）なので、純増が小さい週は200%や500%になり、
//   純減の週は意味が成立しません。自動レポートの見出しとして安定しません。
// ════════════════════════════════
function causeSplit(rep, views, viewsPrev){
  // short … データ側の短い表示名（任意）。pub … 公開日。見出しでタイトルを切らないために使う
  const all = (rep.top_videos||[]).map(v=>({t:v.title, short:v.short_title||'', pub:v.published_at||'',
                                            d:(v.views_week||0)-(v.views_prev_week||0)}));
  if(!all.length || viewsPrev==null) return null;
  const tot     = views - viewsPrev;
  const restRaw = tot - all.reduce((s,x)=>s+x.d,0);      // 上位8本の外にあるぶん（正味）
  const ups = all.filter(x=>x.d>0).sort((a,b)=>b.d-a.d);
  const dns = all.filter(x=>x.d<0).sort((a,b)=>a.d-b.d);
  const upOther = ups.slice(3).reduce((s,x)=>s+x.d,0) + Math.max(0, restRaw);
  const dnOther = dns.slice(3).reduce((s,x)=>s+x.d,0) + Math.min(0, restRaw);
  // ⚠ ここで {t,d} だけに絞らないこと。short_title / published_at が落ちて、
  //   見出しが「最大の1本」に化けます（2026-08-28 に実際に起きた）。
  const upRows = ups.slice(0,3).map(x=>({...x}));
  const dnRows = dns.slice(0,3).map(x=>({...x}));
  // ⚠ 両側に同じ「その他の動画（合計）」を出さないこと。同じ項目が増えた側と減った側に
  //   同時にあるように見えます（2026-08-28 レビュー4回目 §4-4）。側ごとに名前を分けます。
  if(upOther > 0) upRows.push({t:'その他の増加要因', d:upOther, other:true});
  if(dnOther < 0) dnRows.push({t:'その他の減少要因', d:dnOther, other:true});
  const upSum = upRows.reduce((s,x)=>s+x.d,0);
  const dnSum = dnRows.reduce((s,x)=>s+x.d,0);
  return {tot, upRows, dnRows, upSum, dnSum, views, viewsPrev};
}
function causeBlock(rep, views, viewsPrev){
  const S = causeSplit(rep, views, viewsPrev);
  if(!S) return '';
  const mx = Math.max(1, ...S.upRows.concat(S.dnRows).map(x=>Math.abs(x.d)));
  const list = (rows, color, title) => `<div class="facg"><h4>${title}</h4>${
    rows.length ? rows.map(r=>`<div class="fac">
<div class="ft2"><span class="fn2">${r.other?'<span style="color:var(--muted)">':''}${esc(r.t)}${r.other?'</span>':''}</span><span class="fv" style="color:${color}">${r.d>=0?'+':'−'}${fmtMan(Math.abs(r.d))}回</span></div>
<div class="fbar"><i style="width:${Math.max(2,Math.round(Math.abs(r.d)/mx*100))}%;background:${color}"></i></div></div>`).join('')
              : '<div class="facnone">該当なし</div>'}</div>`;
  // ⚠ 表示は万単位に丸めるので、画面上の「増加−減少」が「差し引き」と1目盛りずれることがあります。
  //   ずれる週だけ「約」を付けます（常に付けない。付けっぱなしだと精度の情報が伝わりません）。
  const r1 = n => Math.round(n/1000)/10;                    // 万・小数第1位
  const approx = (Math.abs(r1(S.upSum)+r1(S.dnSum)-r1(S.tot)) > 0.05) ? '約' : '';
  // ⚠⚠ 演算子と符号を二重に書かないこと（2026-08-28 レビュー5回目 §3-1）。
  //   「− 減少要因 −16.9万回」は −(−16.9) と読めて、**足し算に見えます。**
  //   演算子（＋ − ＝）は式の記号、数字は**絶対値**で書きます。純増だけ符号を付けます。
  return `<div class="wf">
<span>前週 <b>${fmtMan(S.viewsPrev)}回</b></span>
<span class="op">＋</span><span>増加要因 <b style="color:${C_UP}">${approx}${fmtMan(S.upSum)}回</b></span>
<span class="op">−</span><span>減少要因 <b style="color:${C_DOWN}">${approx}${fmtMan(Math.abs(S.dnSum))}回</b></span>
<span class="op">＝</span><span>今週 <b>${fmtMan(S.views)}回</b>（純増 ${S.tot>=0?'+':'−'}${fmtMan(Math.abs(S.tot))}回）</span>
</div>
<div class="facwrap">${list(S.upRows, C_UP, '増えた要因')}${list(S.dnRows, C_DOWN, '減った要因')}</div>
${/* ⚠ 本編には短い1行だけ。詳しい集計条件は運用詳細（.facnote）に置きます
      （2026-08-28 レビュー4回目 §4-4）。 */''}
<div class="note facnote">上位要因を表示。残りは「その他」に集約しています</div>`;
}

// ── 新作の初速（公開2日間） ──────────────────────────────
function firstBlock(rep){
  const L = (rep.new_videos||[]).filter(v=>v.first2d!=null);
  const wait = (rep.new_videos||[]).length - L.length;
  if(!L.length) return '';
  L.sort((a,b)=>b.first2d-a.first2d);
  const LW=310, N=fitChars(LW)-6;   // 先頭に「08/12 」が付くぶん短く
  const rows = L.map(v=>({label:`${fmtDate(v.published_at).slice(5)} ${cut(v.title,N)}`, bars:[{v:v.first2d,color:C_ONE}], right:fmtMan(v.first2d)+'回'}));
  // ★ 中央値と「その2倍」の縦線を引く（2026-08-28 レビュー指摘 A-5）。
  //   見出しに「中央値の2倍を超えた本数」を書いているので、図でも同じ線で確かめられるようにします。
  //   ⚠ 2倍が最大値を超える週は線が枠外になるため、そのときは引きません。
  const S   = L.map(v=>v.first2d).slice().sort((a,b)=>a-b);
  const med = S.length%2 ? S[(S.length-1)/2] : (S[S.length/2-1]+S[S.length/2])/2;
  const mx  = S[S.length-1];
  const guides = S.length>=2 ? [
    {v:med,   label:`中央値 ${fmtMan(med)}回`,      dash:'3 3', color:'#c3bdaf'},
    // ⚠ 2倍の線に数字を書かないこと。fmtMan が小数第1位に丸めるため
    //   「中央値 2.2万回 / 中央値の2倍 4.3万回」のように 2倍に見えない表示になります。
    ...(med*2<=mx ? [{v:med*2, label:'中央値の2倍', dash:'5 3', color:'#8f8878'}] : [])
  ] : null;
  return `${hbarSVG(rows,{labelW:LW, rightW:78, guides})}
${wait?`<div class="note">ほか ${wait}本は公開2日を過ぎていないため出していません。</div>`:''}`;
}

// ════════════════════════════════
// クーポン施策の節
// ⚠ 「その週に何日ぶんのデータがあるか」を coupon.daily から数えています。
//   クーポンの入力データは 2026-08-04 が最初で、それ以前の週は0日です。
//   件数をそのまま週どうしで比べると 7日 対 4日 の比較になるため、必ず1日あたりを併記すること
//   （2026-08-17 に実際にその比較を出してしまいました）。
// ════════════════════════════════
function couponBlock(rep){
  if(!COUPON || COUPON.error) return '';
  const wk = (COUPON.weekly||[]).find(w=>w.week_start===rep.week_start);
  if(!wk) return '';                      // クーポンがまだ無い週は節ごと出さない
  const prevStart = new Date(rep.week_start+'T00:00:00Z');
  prevStart.setUTCDate(prevStart.getUTCDate()-7);
  const pKey = prevStart.toISOString().slice(0,10);
  const pw = (COUPON.weekly||[]).find(w=>w.week_start===pKey) || null;

  // その週のうち、実際に入力のあった日数（分母がずれるのを防ぐ）
  const daysIn = (start)=>{
    const s = new Date(start+'T00:00:00Z'), e = new Date(start+'T00:00:00Z');
    e.setUTCDate(e.getUTCDate()+6);
    return (COUPON.daily||[]).filter(r=>{
      const t = new Date(r.date+'T00:00:00Z'); return t>=s && t<=e && r.entries>0;
    }).length;
  };
  const dC = daysIn(rep.week_start), dP = pw ? daysIn(pKey) : 0;
  // ⚠ 小数は第1位までに揃えること（2026-08-28 レビュー指摘 B-6）。`1日16.60件` と `4.00件` が
  //   他の数字（+13.5万回・-51.8%）と桁の刻みが違い、横に読むときのリズムが崩れていました。
  const perDay = (n,d)=> d ? (n/d).toFixed(1) : '—';
  const rate   = (u,e)=> e ? (u/e*100).toFixed(1)+'%' : '—';
  const cell   = (n,d)=> d ? `${fmtFull(n)}件（${d}日・${perDay(n,d)}件/日）` : '—';

  const codeRows = (COUPON.by_code||[]).map(b=>
    `<tr><td>${esc(b.code)}</td><td class="num">${fmtFull(b.entries)}</td><td class="num">${fmtFull(b.used)}</td><td class="num">${rate(b.used,b.entries)}</td><td class="num">${fmtFull(b.people)}</td></tr>`).join('');
  const lag = (COUPON.lag_buckets||[]).map(b=>`${esc(b.label)} ${b.count}`).join(' ／ ');

  return `
<div class="note" style="margin:0 0 7px">この週に入力のあったコード: <b>${(wk.codes||[]).map(esc).join('、')||'—'}</b>　／　シート取得日: ${fmtDate(COUPON.snapshot_date||'')}</div>
<div class="scrollx"><table><tr><th>指標</th><th class="num">今週</th><th class="num">前週</th></tr>
<tr><td>コード入力</td><td class="num">${cell(wk.entries,dC)}</td><td class="num">${pw?cell(pw.entries,dP):'—'}</td></tr>
<tr><td>うち使用済み</td><td class="num">${fmtFull(wk.used)}件（${rate(wk.used,wk.entries)}）</td><td class="num">${pw?`${fmtFull(pw.used)}件（${rate(pw.used,pw.entries)}）`:'—'}</td></tr>
<tr><td>実人数</td><td class="num">${fmtFull(wk.people)}人</td><td class="num">${pw?fmtFull(pw.people)+'人':'—'}</td></tr></table></div>
${codeRows?`<div style="margin-top:16px;padding-top:11px;border-top:1px solid var(--rule)"><b style="font-size:14px">累計（開始日〜${fmtDate(rep.week_end)}）・コード別</b>
<div class="note key" style="margin:2px 0 0">⚠ 上の表は<b>この週だけ</b>、ここから下は<b>開始日からの累計</b>です。足し合わせても上の数字にはなりません。</div></div>
<div class="scrollx"><table style="margin-top:4px"><tr><th>コード</th><th class="num">入力</th><th class="num">使用</th><th class="num">使用率</th><th class="num">実人数</th></tr>${codeRows}</table></div>`:''}
${lag?`<div class="note" style="margin-top:7px">入力から使用までの時間（通算${fmtFull(COUPON.total||0)}件）: ${lag}</div>`:''}`;
}

// ★ 補助指標の1行（2026-08-28 レビュー4回目 §1）。
//   PDF の1ページ目には「主要指標の表」ではなくこの1行だけを載せます。
//   ⚠ ここに指標を足さないこと。**4つ以上並べると1行に収まらず、圧縮の意味がなくなります。**
//   ⚠ 「視聴回数に占める登録者視聴」はここに入れないこと。今週の判断に直接効かないため
//     運用詳細の表だけで十分、というのがレビューの結論です。
function subLine(rep){
  const c = rep.channel || {}, pp = rep.post_plan || {};
  const out = [];
  if(c.watch_min!=null) out.push(`総再生時間 ${fmtMin(c.watch_min)}（${pct(c.watch_min, c.watch_min_prev)}）`);
  const sn = c.subs_net ?? ((c.subs_gained||0)-(c.subs_lost||0));
  if(sn!=null) out.push(`登録者 ${(sn>=0?'+':'')+fmtFull(sn)}人`);
  const pub = (rep.new_videos||[]).length;
  const bad = (pp.items||[]).filter(p=>{
    const done = p.matched || (p.status||'').includes('済');
    return !done || (p.delay_days||0) > 0;
  }).length;
  out.push(`公開${pub}本・${bad? `<b>${bad}件が遅れ／未投稿</b>` : '遅延なし'}`);
  return out.join('　｜　');
}

// ════════════════════════════════
// オーナー判断（2026-08-28 レビュー5回目 §1 で復活）
//
// ★ 一度は冒頭の1行として出し、運営者の指示でいったん全部消しました。
//   ただし **「オーナーに何をしてほしいか」は 04 のアクションからは読み取れません。**
//   「ショート動画を週3本追加する」と書いてあっても、現行予算で運営が実行するのか／
//   確認が欲しいのか／追加費用の承認が要るのかは、アクション名からは分かりません。
//   そこで **重さに応じて出し方を変える** 形にしました。04 とは役割が分かれます:
//     04 = 運営が何をするか ／ ここ = オーナーに何をしてほしいか
//
//   判断不要 … タイトル横の小さなバッジ「オーナー対応なし」だけ（1行を使わない）
//   要確認   … 冒頭に控えめな通知を1行
//   要承認   … 冒頭に強い通知（⚠ 何を・推奨案・費用または影響・期限 を添えること）
//   未設定   … 確定週なら赤で警告。**「判断不要」に化けさせないこと。**
//
// ⚠⚠ 値が無いときに「判断不要」を既定にしないこと。入力漏れが
//   「オーナーのやることは無い」としてそのまま提出される事故になります。
// ════════════════════════════════
const OWNER_GATE_RANK = {none:0, confirm:1, approve:2};
function ownerState(rep){
  const ai = rep.ai_analysis || {};
  const raw = (ai.owner_decision||'').trim();
  if(raw) return {level: /要承認/.test(raw) ? 'approve' : /要確認/.test(raw) ? 'confirm' : 'none',
                  text: raw, derived:false};
  // 明示が無くても、各アクションが owner_gate を持っていれば**いちばん重いもの**へ集約する。
  // ⚠ これは推測ではなくデータの集約です。gate が1つも無ければ「未設定」のままにします。
  const gates = (ai.suggestions||[]).map(s=>(s&&s.owner_gate)||'').filter(g=>g in OWNER_GATE_RANK);
  if(gates.length){
    const lv = gates.reduce((a,b)=>OWNER_GATE_RANK[b]>OWNER_GATE_RANK[a]?b:a, 'none');
    // ⚠ ここに「要確認」「要承認」の語を入れないこと。表示側で見出しとして付けるので二重になります。
    return {level: lv, derived:true,
            text: lv==='approve' ? 'アクションから集約しました。何を承認してほしいか・推奨案・費用または影響・期限を書いてください'
                : lv==='confirm' ? 'アクションから集約しました。確認事項を1つに絞って書いてください'
                : '判断不要'};
  }
  return {level:'unset', text:'未設定', derived:false};
}
// タイトル横の小さなバッジ。判断不要のときだけ出す（要確認・要承認は下の通知で出す）
function ownerBadge(rep){
  const s = ownerState(rep);
  if(s.level==='none')  return `<span class="badge">オーナー対応なし</span>`;
  if(s.level==='unset' && rep.final) return `<span class="badge bad">オーナー判断 未設定</span>`;
  return '';
}
// 冒頭の通知。要確認・要承認・（確定週の）未設定のときだけ1行出す
function ownerNotice(rep){
  const s = ownerState(rep);
  if(s.level==='confirm') return `<div class="onote confirm"><b>要確認</b>　${esc(s.text.replace(/^要確認[｜|：:\s]*/,''))}</div>`;
  if(s.level==='approve') return `<div class="onote approve"><b>要承認</b>　${esc(s.text.replace(/^要承認[｜|：:\s]*/,''))}</div>`;
  if(s.level==='unset' && rep.final)
    return `<div class="onote approve"><b>オーナー判断が未設定です</b>　運用手順 §7 の基準で 判断不要／要確認／要承認 のいずれかを入れてください。<b>「判断不要」と決めつけて出さないこと。</b></div>`;
  return '';
}

// ════════════════════════════════
// 今週の結論（レポートのいちばん上）
// ⚠ 2026-08-28 全面作り直し（レビュー3回目 §1・運営者の承認済み）。
//   旧版は「今週はやや好調。26週平均の126%（26週中7位）」がページで最も強い見出しでした。
//   ★ 読み手はまず「今週は順調だった」と受け取りますが、実態は
//     「視聴は伸びたが、最大寄与の1本を除くと土台はほぼ横ばい」でした。
//   ⚠ 26週平均比・順位は**参考情報**です。主見出しに戻さないこと（下の小さな行か「参考」の節へ）。
//   ★ 見出しの文はコードで決めています。ai_analysis の headline（78〜109字）は長すぎて
//     ここには入らず、過去10週ぶんを短く書き直すこともできないためです。
//     headline は「運用詳細」の分析メモに残してあります。
function verdictBlock(rep, views, viewsPrev){
  const T = TREND;
  if(viewsPrev==null || !viewsPrev) return '';
  const S   = causeSplit(rep, views, viewsPrev);
  const tot = views - viewsPrev;
  const dp  = tot/viewsPrev*100;
  // 最大の増加要因（1本）を除いた前週比。「土台が動いたか」を見るための数字
  const topD = S && S.upRows.length ? S.upRows[0].d : 0;
  const base = (tot - topD)/viewsPrev*100;
  // ⚠ 「横ばい」の帯は ±5%。±3% にすると +3.0% が「伸長」に化け、この見出しの目的
  //   （土台が動いたかどうか）が逆に伝わります（2026-08-28 に実際に起きた）。
  //   このチャンネルの週次は ±20〜75% 動くので ±5% は保守的な帯です。
  //   ⚠ 帯を変えるときは、過去26週ぶんで判定が変わらないことを確かめてから変えること。
  const FLAT = 5;
  // ⚠ 語彙は「増加／減少／横ばい」。「伸長」「土台」は抽象的で、数字が専門でない読み手に
  //   そのままは伝わりません（2026-08-28 レビュー4回目 §4-2）。
  const dir  = v => v >= FLAT ? '増加' : v <= -FLAT ? '減少' : '横ばい';
  const head = dir(dp)===dir(base)
      ? `視聴は${dir(dp)}。1本を除いても${dir(base)}`
      : `視聴は${dir(dp)}。ただし1本を除くと${dir(base)==='横ばい'?'ほぼ横ばい':dir(base)}`;

  // 3つめのタイル: 流入の首位と、その伸びが1本で説明できるか
  let t3v = '—', t3l = '流入首位', t3s = '';
  if(window._TR && window._TR.list.length){
    const t0 = window._TR.list[0];
    t3v = TRAFFIC_LABEL[String(t0.source_type)] || t0.source_type;
    const sp = window._SPLIT;                      // trafficSplitBlock が置く
    if(sp) t3s = sp.restBeatsPrev ? '当該動画を除いても前週超え' : '当該動画1本による増加';
    else {
      const p0 = window._TR.prev.get(String(t0.source_type));
      t3s = p0!=null ? `前週比 ${pct(t0.views,p0)}` : '';
    }
  }
  const tile = (v,l,s)=>`<div class="tile"><div class="tv">${v}</div><div class="tl">${l}</div>${s?`<div class="ts">${s}</div>`:''}</div>`;

  // 参考（26週の中での位置）は主見出しから外し、小さく1行だけ添える
  let ref = '';
  if(T && T.length>=4){
    const i=T.findIndex(d=>d.week_start===rep.week_start);
    if(i>=0){
      const avg=T.reduce((s,d)=>s+d.views,0)/T.length;
      const rank=T.map(d=>d.views).slice().sort((a,b)=>b-a).indexOf(T[i].views)+1;
      ref = `${T.length}週平均の${Math.round(T[i].views/avg*100)}%（${T.length}週中${rank}位）。詳しくは「参考：${T.length}週の中での位置」を見てください`;
    }
  }

  // ⚠⚠ 2026-08-28 運営者の指示で **「次週の確認」「運用変更」の2行を削除**しました。
  //   ★ この2つを冒頭へ戻さないこと。理由:
  //     ① 「次週の確認」は **04 次週のアクションの1件目と同じ文**でした
  //        （`next_check` が無いと `suggestions[0].title` を使う作りなので、構造上ほぼ毎週重複します）。
  //     ② 「運用変更：なし」は、種別（検証/分析/計測整備）が出ているので 04 を見れば分かります。
  //   ⚠ `ai_analysis.next_check` / `ops_change` はデータに残していますが、**表示していません。**

  return `<div class="verdict"><span class="lv">${esc(head)}</span></div>
${ownerNotice(rep)}
<div class="tiles">
${tile(fmtMan(views)+'回', '週間視聴回数', `前週比 ${(dp>=0?'+':'')+dp.toFixed(1)}%`)}
${/* ⚠ ここに動画名を出さないこと。省略されたタイトル（「ブラフレイズに「ブラ…」）は
      内容の理解に役立たず、未完成な表示に見えます。動画名は 02 の増減要因で見せます
      （2026-08-28 レビュー4回目 §4-3）。 */''}
${tile((base>=0?'+':'')+base.toFixed(1)+'%', '最大寄与1本を除いた前週比', '')}
${tile(esc(String(t3v)), t3l, t3s)}
</div>
<div class="subline">${subLine(rep)}</div>
${ref?`<div class="headrows noprint"><div class="hrow"><span class="hk">参考</span><span class="hv" style="color:var(--muted);font-size:11.5px">${ref}</span></div></div>`:''}`;
}

// ════════════════════════════════
// 投稿計画（2026-08-17 変更）
// ⚠ **問題が無い週は1行だけにします。**全部「投稿済み・遅延0日」の表は読む価値がないためです。
//   遅れているもの・未投稿があるときだけ、その行だけを表で出します。
// ════════════════════════════════
function planLine(rep, pp){
  const items = pp.items || [];
  const pub   = (rep.new_videos||[]).length;
  if(!items.length) return '投稿計画のデータはありません。';
  const bad = items.filter(p=>{
    const done = p.matched || (p.status||'').includes('済');
    return !done || (p.delay_days||0) > 0;
  });
  const base = `投稿計画は ${pp.planned}本予定・${pp.posted}本投稿・実際の公開 ${pub}本`;
  return bad.length ? `${base}。<b>うち ${bad.length}件が遅れ・未投稿です（${bad.map(p=>esc(p.title).slice(0,14)).join('／')}）。</b>`
                    : `${base}で、遅延はありません。`;
}


function renderReportPage(rep){
  const c = rep.channel || {};
  const views     = rep.final ? c.views      : (c.views_snap      ?? c.views);
  const viewsPrev = rep.final ? c.views_prev : (c.views_snap_prev ?? c.views_prev);
  const subsNet   = c.subs_net ?? ((c.subs_gained||0)-(c.subs_lost||0));
  const partial   = !rep.final && c.views_snap==null && (rep.confirmed_days||0) < 7;

  // 視聴者層は2行の表を独立の節にしていたが、1行に畳んで基本指標へ入れた（2026-08-17）
  const ssPct = (ss)=>{
    if(!ss||!Object.keys(ss).length) return null;
    const sub=ss['SUBSCRIBED']||0, unsub=ss['UNSUBSCRIBED']||0, tot=sub+unsub;
    return tot ? Math.round(sub/tot*100) : null;
  };
  const ssC2 = ssPct(rep.subscribed_status), ssP2 = ssPct(rep.subscribed_status_prev);

  // ★ 26週ぶんの形をスパークラインで併記（2026-08-17）。節を増やさずに6か月の文脈を足す。
  //   ⚠ 見ている週までで切ります。未来の週を含めると「この週がどこか」が分からなくなります。
  const tIdx = TREND ? TREND.findIndex(d=>d.week_start===rep.week_start) : -1;
  const tUpTo = (key)=> (TREND && tIdx>=0) ? TREND.slice(0, tIdx+1).map(d=>d[key]) : null;
  const spViews = sparkline(tUpTo('views'));
  const spSubs  = sparkline(tUpTo('subs_net'));

  // ⚠ 単位の前に空白を入れないこと（2026-08-28 レビュー指摘 B-6）。表・グラフ・本文で
  //   「72.1万 回」と「35.7万回」が混在していました。`72.1万回` `+200人` `16.6件/日` に統一します。
  // ⚠ 比較対象が無いセルは空欄にせず `—` を入れること（同 B-3）。空欄だと
  //   「データが取れていない」のか「比べる相手がいない」のか区別できません。
  const sumRows = [
    ['週間視聴回数', fmtMan(views)+'回'+(partial?`（確定${rep.confirmed_days}日分のみ）`:''), fmtMan(viewsPrev)+'回', partial?'—':pct(views,viewsPrev), spViews],
    ['総再生時間',   fmtMin(c.watch_min||0), fmtMin(c.watch_min_prev||0), partial?'—':pct(c.watch_min,c.watch_min_prev), ''],
    ['登録者純増', (subsNet>=0?'+':'')+fmtFull(subsNet||0)+'人', c.subs_net_prev!=null?(c.subs_net_prev>=0?'+':'')+fmtFull(c.subs_net_prev)+'人':'—', pct(subsNet,c.subs_net_prev), spSubs],
    ['週内の投稿', (rep.new_videos||[]).length+'本', '—', '—', ''],
    // ⚠ この行だけ「増減」を前週比（%）にしないこと。もともと％の指標なので、
    //   6%→7% を「+16.7%」と書くと桁違いに大きく見えます。差はポイントで出します。
    ...(ssC2!=null ? [['視聴回数に占める登録者視聴', ssC2+'%', ssP2!=null? ssP2+'%':'—',
        ssP2!=null?((ssC2-ssP2>=0?'+':'−')+Math.abs(ssC2-ssP2)+'ポイント'):'—', '']] : []),
  ];

  const trP = new Map((rep.traffic_sources_prev||[]).map(t=>[String(t.source_type), t.views]));
  const trList = (rep.traffic_sources||[]).slice(0,8);
  window._TR = {list: trList, prev: trP};
  // ⚠ ここにあった流入経路の「表」は、同じ数字を trafficChart() のグラフでも出していたため
  //   2026-08-17 に画面から外れていました。使われないまま残っていたので削除（2026-08-28）。

  const pp = rep.post_plan || {planned:0,posted:0,items:[]};
  const ai = rep.ai_analysis;

  // ── 見出しは「結論の文」にする（NN/g: トピック句は読み飛ばされる）──────
  //    ⚠ 見出しをデータから作っています。「基本指標」「流入経路」のような
  //      内容の無い句に戻さないでください。最初の2語で要旨が伝わるようにします。
  // ⚠ ここで因果を言い切らないこと（2026-08-25 レビュー指摘）。
  //   「動画別の増減」と「流入元別の増減」は別の軸で、片方をもう片方の原因にはできません。
  //   見出しは事実（順位と実数）だけにします。
  const trafficLead = (()=>{
    if(!trList.length) return '';
    const t0=trList[0], p0=trP.get(String(t0.source_type));
    const nm=TRAFFIC_LABEL[String(t0.source_type)]||t0.source_type;
    // 前週の首位を出して、入れ替わったかを見る
    const prevTop=[...trP.entries()].sort((a,b)=>b[1]-a[1])[0];
    if(prevTop && String(prevTop[0])!==String(t0.source_type)){
      const pn=TRAFFIC_LABEL[String(prevTop[0])]||prevTop[0];
      return `流入の首位が入れ替わり、${pn}から${nm}になりました`;
    }
    return p0!=null ? `${nm}が首位のままで、前週比 ${pct(t0.views,p0)}` : `${nm}が最大の入り口です`;
  })();
  // ⚠ 最大÷最小は本数が少ない週ほど極端に出ます。毎週出す指標としては中央値を軸にします
  //   （2026-08-25 レビュー指摘）。最大と最小の開きは下の補足に回しました。
  const firstLead = (()=>{
    const L=(rep.new_videos||[]).filter(v=>v.first2d!=null).map(v=>v.first2d).sort((a,b)=>a-b);
    if(L.length<2) return '';
    const med = L.length%2 ? L[(L.length-1)/2] : (L[L.length/2-1]+L[L.length/2])/2;
    const over = L.filter(v=>v>=med*2).length;
    return over ? `初速の中央値は ${fmtMan(med)}回、そのうち ${over}本が中央値の2倍を超えました`
                : `初速の中央値は ${fmtMan(med)}回、大きく外れた回はありません`;
  })();
  // ⚠ ここに割合（「増加分の87%」）を戻さないこと（2026-08-28 レビュー3回目 §2）。
  //   分母が純増（増加要因−減少要因）なので、純増が小さい週は200%・500%になり、
  //   純減の週は意味が成立しません。自動レポートの見出しとして安定しません。実数だけで書きます。
  // ⚠ 見出しで動画タイトルを途中省略しないこと（2026-08-28 レビュー5回目 §3-3）。
  //   「最大の増加要因は「ブラフレイズに「ブラフオールイ…」の +11.7万回」は
  //   **かぎ括弧が二重になり、タイトルの終わりが分からず、未完成に見えます。**
  //   タイトルは下の一覧で確認できるので、見出しでは**公開日**で指します。どの週でも安定します。
  //   ★ タイトルを使いたくなったら、文字数で機械的に切らず、データ側に短い表示名
  //     （`top_videos[].short_title`）を持たせてください。対応済みです。
  const causeLead = (()=>{
    const S = causeSplit(rep, views, viewsPrev);
    if(!S) return '';
    const t = `純増は ${(S.tot>=0?'+':'−')+fmtMan(Math.abs(S.tot))}回`;
    if(!S.upRows.length) return `${t}。増えた動画はありません`;
    const u = S.upRows[0];
    if(u.other) return `${t}。特定の1本では説明できず、全体が動いています`;
    const label = u.short ? `「${esc(u.short)}」`
                : u.pub   ? `${String(u.pub).slice(5).replace('-','/').replace(/^0/,'')}公開動画`
                          : '最大の1本';
    return `${t}。最大の増加要因は ${label}の +${fmtMan(u.d)}回`;
  })();
  const cpLead = (()=>{
    if(!COUPON||COUPON.error) return '';
    const wk=(COUPON.weekly||[]).find(w=>w.week_start===rep.week_start);
    if(!wk) return '';
    return `掲出日の記録が無いため、どの動画の効果かは分けられません`;
  })();
  // 上位8本のうち何本が今週の新作か（見出しに使う。構成比は出しません）
  const topLead = (()=>{
    const L=(rep.top_videos||[]).slice(0,8); if(!L.length) return '';
    const nv=new Set((rep.new_videos||[]).map(v=>v.video_id).filter(Boolean));
    const n=L.filter(v=>nv.has(v.video_id)).length;
    return n ? `上位8本のうち ${n}本が今週の新作です` : `上位8本はすべて過去の動画です`;
  })();
  // ★ 節に通し番号を振る（2026-08-28 レビュー指摘 B-4）。長い1ページなので現在地の手がかりを置く。
  //   ⚠ 週によって出ない節（クーポン・次にやること）があるため、**番号は出た節に順に振ります**。
  //     固定の番号を直書きしないこと。欠番が出ます。
  let secN = 0;
  const sec = (eyebrow, assertion, lede) => {
    secN++;

function onWeekChange(){
  const ws = document.getElementById('weekSelect').value;
  history.replaceState(null,'','report.html?week='+ws);
  const rep = REPORTS.find(r=>r.week_start===ws);
  if(rep) renderReportPage(rep);
}

async function loadReport(){
  document.getElementById('loadMsg').style.display = 'block';
  try{
    // 毎回サーバーに確認しに行く。変わっていなければ 304 が返るだけなので通信量は増えない。
    // ⚠ 既定（省略）に戻さないこと。GitHub Pages のキャッシュで画面が古いままになります。
    const r = await fetch(DATA_URL, { cache: 'no-cache' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    REPORTS = (data.weekly_reports||[]).slice().sort((a,b)=>b.week_start.localeCompare(a.week_start));
    COUPON  = data.coupon || null;
    TREND   = data.weekly_trend || null;
    if(data.meta && data.meta.channel_title){
      CHANNEL = data.meta.channel_title;
      document.title = '週次レポート — ' + CHANNEL;
    }
    document.getElementById('loadMsg').style.display = 'none';
    if(!REPORTS.length){
      document.getElementById('loadMsg').style.display = 'block';
      document.getElementById('loadMsg').textContent = 'レポートはまだありません。毎週土曜の朝に自動生成されます。';
      document.getElementById('toolbar').style.display = 'flex';
      return;
    }
    const sel = document.getElementById('weekSelect');
    sel.innerHTML = REPORTS.map(r=>`<option value="${r.week_start}">${fmtDate(r.week_start)} 〜 ${fmtDate(r.week_end)}${r.final?'':'［速報］'}</option>`).join('');
    const q = new URLSearchParams(location.search).get('week');
    const rep = REPORTS.find(r=>r.week_start===q) || REPORTS[0];
    sel.value = rep.week_start;
    document.getElementById('toolbar').style.display = 'flex';
    document.getElementById('sheet').style.display = 'block';
    renderReportPage(rep);
  }catch(e){
    document.getElementById('loadMsg').style.display = 'block';
    document.getElementById('loadMsg').textContent = '読み込み失敗: ' + e.message;
  }
}

// このページはパスワードなしで閲覧可能（ダッシュボード本体のみゲートあり）
loadReport();
