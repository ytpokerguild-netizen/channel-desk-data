<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>週次レポート — りいポーカーチャンネル</title>
<style>
  @page{size:A4;margin:16mm}
  *{box-sizing:border-box}
  body{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;color:#1a1a1a;font-size:13px;line-height:1.7;margin:0;background:#f2f0ea}
  .sheet{max-width:860px;margin:0 auto;background:#fff;padding:34px 40px 40px;min-height:100vh;box-shadow:0 0 24px rgba(0,0,0,.08)}
  h1{font-size:20px;margin:0 0 2px;border-bottom:3px solid #C9A227;padding-bottom:9px}
  .sub{color:#666;font-size:12px;margin-bottom:18px}
  h2{font-size:14.5px;margin:22px 0 8px;color:#8a6d1a;border-left:4px solid #C9A227;padding-left:9px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{border:1px solid #ddd;padding:6px 9px;text-align:left}
  th{background:#f5f1e6;font-weight:600}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .badge{display:inline-block;font-size:11px;padding:1px 9px;border-radius:10px;margin-left:9px;vertical-align:3px}
  .badge.final{background:#e5f2e9;color:#1c7c40;border:1px solid #a9d6b8}
  .badge.flash{background:#fdf3d7;color:#8a6d1a;border:1px solid #e4cf8e}
  .note{color:#888;font-size:11px;margin-top:5px}
  .foot{margin-top:26px;color:#999;font-size:10px;border-top:1px solid #ddd;padding-top:7px}
  .suggest{border:1px solid #e4cf8e;background:#fdf8ea;border-radius:7px;padding:10px 14px;margin-top:8px}
  .toolbar{max-width:860px;margin:0 auto;padding:14px 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .toolbar select,.toolbar button,.toolbar a{font-family:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid #cbc5b4;background:#fff;color:#333;cursor:pointer;text-decoration:none}
  .toolbar button:hover,.toolbar a:hover{background:#f5f1e6}
  .msg{max-width:860px;margin:40px auto;text-align:center;color:#666}
  @media print{
    body{background:#fff}
    .sheet{box-shadow:none;padding:0;max-width:none;min-height:auto}
    .toolbar{display:none}
  }
</style>
</head>
<body>

<div class="toolbar" id="toolbar" style="display:none">
  <a href="index.html">← ダッシュボード</a>
  <select id="weekSelect" onchange="onWeekChange()"></select>
  <button onclick="window.print()">🖨 印刷 / PDF保存</button>
</div>

<div class="msg" id="loadMsg" style="display:none">読み込み中...</div>
<div class="sheet" id="sheet" style="display:none"></div>

<script>
const DATA_URL = 'data.json';
let REPORTS = [];

const fmtFull = n => (n??0).toLocaleString('ja-JP');
const fmtDate = s => s ? s.replace(/-/g,'/') : '';
const fmtMin  = m => m >= 60 ? Math.round(m/60).toLocaleString()+'時間' : (m||0).toLocaleString()+'分';
const esc     = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pct     = (a,b)=> (b==null||!b) ? '—' : ((a-b)/b*100>=0?'+':'')+((a-b)/b*100).toFixed(1)+'%';

// YouTube Studio の表記に準拠（APIの値 → Studioの日本語ラベル）
const TRAFFIC_LABEL = {
  'SUBSCRIBER':'ブラウジング機能','YT_SEARCH':'YouTube検索','SHORTS':'ショートフィード',
  'EXT_URL':'外部','NOTIFICATION':'通知','RELATED_VIDEO':'関連動画',
  'BROWSE':'ブラウジング機能','CHANNEL':'チャンネルページ','YT_CHANNEL':'チャンネルページ',
  'DIRECT':'直接入力','ADVERTISING':'広告','PLAYLIST':'再生リスト',
  'END_SCREEN':'終了画面','NO_LINK_EMBEDDED':'埋め込み','OTHER':'その他',
  'ANNOTATION':'アノテーション','CAMPAIGN_CARD':'プロモーション',
  'SHORTS_CONTENT_LINKS':'ショート内リンク','YT_OTHER_PAGE':'その他のYouTube機能',
  'NO_LINK_OTHER':'直接入力または不明','SOUND_PAGE':'音源ページ','HASHTAGS':'ハッシュタグ',
  '3':'ブラウジング','9':'YouTube検索','10':'関連動画','4':'チャンネルページ',
  '5':'外部サイト','7':'Google検索','19':'通知','18':'エンドスクリーン',
  '11':'再生リスト','0':'直接/不明','1':'広告','17':'プロモーション','8':'その他'
};

function renderReportPage(rep){
  const c = rep.channel || {};
  const views     = rep.final ? c.views      : (c.views_snap      ?? c.views);
  const viewsPrev = rep.final ? c.views_prev : (c.views_snap_prev ?? c.views_prev);
  const subsNet   = c.subs_net ?? ((c.subs_gained||0)-(c.subs_lost||0));
  const partial   = !rep.final && c.views_snap==null && (rep.confirmed_days||0) < 7;

  const sumRows = [
    ['週間再生数', fmtFull(views)+' 回'+(partial?`（確定${rep.confirmed_days}日分のみ）`:''), fmtFull(viewsPrev)+' 回', partial?'—':pct(views,viewsPrev)],
    ['視聴時間',   fmtMin(c.watch_min||0), fmtMin(c.watch_min_prev||0), partial?'—':pct(c.watch_min,c.watch_min_prev)],
    ['登録者純増', (subsNet>=0?'+':'')+fmtFull(subsNet||0)+' 人', c.subs_net_prev!=null?(c.subs_net_prev>=0?'+':'')+fmtFull(c.subs_net_prev)+' 人':'—', pct(subsNet,c.subs_net_prev)],
    ['週内の投稿', (rep.new_videos||[]).length+' 本', '', ''],
  ];

  const trP = new Map((rep.traffic_sources_prev||[]).map(t=>[String(t.source_type), t.views]));
  const trafficRows = (rep.traffic_sources||[]).slice(0,8).map(t=>{
    const prev = trP.get(String(t.source_type));
    return `<tr><td>${esc(TRAFFIC_LABEL[String(t.source_type)]||t.source_type)}</td><td class="num">${fmtFull(t.views)}</td><td class="num">${prev!=null?fmtFull(prev):'—'}</td><td class="num">${prev!=null?pct(t.views,prev):'—'}</td></tr>`;
  }).join('');

  const ssRow = (ss)=>{
    if(!ss||!Object.keys(ss).length) return null;
    const sub=ss['SUBSCRIBED']||0, unsub=ss['UNSUBSCRIBED']||0, tot=sub+unsub||1;
    return {p:Math.round(sub/tot*100), tot:sub+unsub};
  };
  const ssC = ssRow(rep.subscribed_status), ssP = ssRow(rep.subscribed_status_prev);
  const pp = rep.post_plan || {planned:0,posted:0,items:[]};
  const ai = rep.ai_analysis;

  document.getElementById('sheet').innerHTML = `
<h1>りいポーカーチャンネル 週次レポート<span class="badge ${rep.final?'final':'flash'}">${rep.final?'確定':'速報'}</span></h1>
<div class="sub">対象期間: ${fmtDate(rep.week_start)}（土）〜 ${fmtDate(rep.week_end)}（金）　${rep.final?`Analytics確定値 ${rep.confirmed_days}/7日`:`※速報値（確定 ${rep.confirmed_days}/7日）。確定データが揃い次第自動更新されます`}</div>

<h2>基本指標（前週比）</h2>
<table><tr><th>指標</th><th class="num">今週</th><th class="num">前週</th><th class="num">増減率</th></tr>
${sumRows.map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td></tr>`).join('')}</table>
${c.subscribers_end!=null?`<div class="note">週末時点の登録者数: ${fmtFull(Math.round(c.subscribers_end))} 人</div>`:''}

${ai?`<h2>AI分析と提案</h2>
${ai.headline?`<div style="font-weight:700;font-size:13.5px;padding:9px 13px;background:#eef7f0;border-left:4px solid #4caf7d;border-radius:0 6px 6px 0;margin-bottom:9px">${esc(ai.headline)}</div>`:''}
${String(ai.analysis||'').split(/\n+/).filter(Boolean).map(p=>`<p style="margin:0 0 7px">${esc(p)}</p>`).join('')}
${(ai.suggestions||[]).length?`<div class="suggest"><b style="color:#8a6d1a">今週のアクションプラン</b>
<ol style="margin:5px 0 0;padding-left:20px">${ai.suggestions.map(s=>{
  const t = (typeof s==='string') ? {title:s,actions:[]} : (s||{});
  return `<li style="margin-bottom:6px"><b>${esc(t.title||'')}</b>${(t.actions||[]).length?`<ul style="margin:3px 0 0;padding-left:16px">${t.actions.map(a=>`<li style="margin-bottom:2px">${esc(a)}</li>`).join('')}</ul>`:''}</li>`;
}).join('')}</ol></div>`:''}
${ai.generated_at?`<div class="note">分析生成日: ${fmtDate(String(ai.generated_at).slice(0,10))}</div>`:''}`:''}

<h2>週間トップ動画</h2>
<table><tr><th style="width:26px">#</th><th>タイトル</th><th class="num">今週再生</th><th class="num">前週再生</th></tr>
${(rep.top_videos||[]).map((v,i)=>`<tr><td>${i+1}</td><td><a href="https://youtube.com/watch?v=${esc(v.video_id)}" target="_blank" rel="noopener" style="color:#1a1a1a">${esc(v.title)}</a></td><td class="num">${fmtFull(v.views_week)}</td><td class="num">${fmtFull(v.views_prev_week)}</td></tr>`).join('')||'<tr><td colspan="4">データなし</td></tr>'}</table>

<h2>流入経路</h2>
${trafficRows?`<table><tr><th>経路</th><th class="num">今週</th><th class="num">前週</th><th class="num">増減率</th></tr>${trafficRows}</table>`:'<div class="note">この週の流入経路データはまだ取得されていません（次回の自動更新で追加されます）</div>'}

<h2>視聴者層（新規 vs リピーター）</h2>
${ssC?`<table><tr><th>週</th><th class="num">登録者による視聴</th><th class="num">非登録者による視聴</th><th class="num">総視聴</th></tr>
<tr><td>今週</td><td class="num">${ssC.p}%</td><td class="num">${100-ssC.p}%</td><td class="num">${fmtFull(ssC.tot)}</td></tr>
${ssP?`<tr><td>前週</td><td class="num">${ssP.p}%</td><td class="num">${100-ssP.p}%</td><td class="num">${fmtFull(ssP.tot)}</td></tr>`:''}</table>`:'<div class="note">この週の視聴者層データはまだ取得されていません（次回の自動更新で追加されます）</div>'}

<h2>投稿計画の進捗</h2>
<div style="margin-bottom:7px">計画 <b>${pp.planned}</b> 本 ／ シート上「投稿済み」 <b>${pp.posted}</b> 本 ／ 実際に公開 <b>${(rep.new_videos||[]).length}</b> 本</div>
${(pp.items||[]).length?`<table><tr><th style="width:78px">予定日</th><th>タイトル</th><th style="width:78px">ステータス</th></tr>
${pp.items.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(p.title)}</td><td>${esc(p.status||'—')}</td></tr>`).join('')}</table>`:'<div class="note">この週の計画データなし</div>'}

<div class="foot">CHANNEL DESK 自動生成 ／ 表示日時: ${new Date().toLocaleString('ja-JP')} ／ りいポーカーチャンネル【PokerGuild】</div>`;
}

function onWeekChange(){
  const ws = document.getElementById('weekSelect').value;
  history.replaceState(null,'','report.html?week='+ws);
  const rep = REPORTS.find(r=>r.week_start===ws);
  if(rep) renderReportPage(rep);
}

async function loadReport(){
  document.getElementById('loadMsg').style.display = 'block';
  try{
    const r = await fetch(DATA_URL + '?t=' + Date.now());
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    REPORTS = (data.weekly_reports||[]).slice().sort((a,b)=>b.week_start.localeCompare(a.week_start));
    document.getElementById('loadMsg').style.display = 'none';
    if(!REPORTS.length){
      document.getElementById('loadMsg').style.display = 'block';
      document.getElementById('loadMsg').textContent = 'レポートはまだありません。毎週土曜の朝に自動生成されます。';
      document.getElementById('toolbar').style.display = 'flex';
      return;
    }
    const sel = document.getElementById('weekSelect');
    sel.innerHTML = REPORTS.map(r=>`<option value="${r.week_start}">${fmtDate(r.week_start)} 〜 ${fmtDate(r.week_end)}${r.final?'':'［速報］'}</option>`).join('');
    const q = new URLSearchParams(location.search).get('week');
    const rep = REPORTS.find(r=>r.week_start===q) || REPORTS[0];
    sel.value = rep.week_start;
    document.getElementById('toolbar').style.display = 'flex';
    document.getElementById('sheet').style.display = 'block';
    renderReportPage(rep);
  }catch(e){
    document.getElementById('loadMsg').style.display = 'block';
    document.getElementById('loadMsg').textContent = '読み込み失敗: ' + e.message;
  }
}

// このページはパスワードなしで閲覧可能（ダッシュボード本体のみゲートあり）
loadReport();
</script>
</body>
</html>
