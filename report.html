<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>週次レポート — 【LightTHREE】 -ポーカーメディア‐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<!--
  ═══════════════════════════════════════════════════════════════════════
  週次レポート（提出用・7ページ構成）
  ═══════════════════════════════════════════════════════════════════════
  ★ 2026-10-27: 運営者が提示したデザイン（6ページ版）へ全面的に作り替えました。
    見本は数字が書き込まれた静的HTMLでしたが、ここは **data.json 駆動**です。
    週を切り替えられ、毎週自動で同じ形が出ます。

  ⚠⚠ **このファイルに計算を書き戻さないこと。**数字は report_model.js で
     1回だけ確定させます（2026-08-28 外部レビュー6回目 §1）。ここは表示だけです。
     report_brief.html も同じモデルを読みます。片方だけ直すと、同じ週の同じ指標が
     2つの資料で食い違います（実際に「アクション3件 / NEXT CHECK 4件」が出ました）。
     見張りは `node check_consistency.js` です。

  ★ 運営者の判断で入れたもの（2026-10-27・それまでは「やらない」と決まっていた）
    - 流入経路の**構成比（%）**。⚠ 実数と順位を消さないこと。分母を必ず併記すること
    - **26週での順位**を主見出しに出すこと（それまでは参考情報に格下げしていた）

  ★ 入れないと決まっているもの（⚠ 足さないこと。足すと決定の取り消しになります）
    - **目標値・成功の目安・達成率**（2026-08-17「目標は入れない」＝いちばん強い否定）
    - **企画タイプ別の分析**（宿題 #14 が運営者の回答待ちで、暫定で全面排除中）
    - **投稿計画の進捗**（投稿計画表が改装で更新停止中。「未入力」は事実として誤り）
    - 冒頭の「確定データが7日ぶん揃っています」のような確定状況の一文
      （上部に確定バッジが出るので重複します）

  ⚠ 印刷CSSの `screen and` を外さないこと。A4（約794px）がレスポンシブ閾値を
    下回り、紙でKPIタイルが2段になります（2026-10-10 に直した不具合）。
-->
<style>
:root{
  color-scheme:light;
  --paper:#ffffff; --field:#f2f4f4; --ink:#17212b; --ink-2:#4a5560; --ink-3:#8b949e;
  --rule:#e4e7e8; --navy:#12303f; --teal:#17a294; --coral:#e2705c; --sand:#cda349;
  --teal-bg:#e9f5f2; --coral-bg:#fdeeeb; --sand-bg:#fbf4e5; --navy-bg:#eef3f5;
  --sans:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--field);color:var(--ink);font-family:var(--sans);
     line-height:1.75;font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.4;font-weight:700}
p{margin:0}
a{color:var(--teal)}
.num{font-variant-numeric:tabular-nums}

/* ── 画面だけの操作部 ───────────────────────────── */
.toolbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--rule);
  display:flex;gap:12px;align-items:center;padding:9px 16px;flex-wrap:wrap}
.toolbar a{font-size:12.5px;text-decoration:none;font-weight:700}
.toolbar select{font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--rule);border-radius:5px;background:#fff}
.printbtn{font:inherit;font-size:12.5px;font-weight:700;padding:6px 14px;border:0;border-radius:5px;
  background:var(--navy);color:#fff;cursor:pointer}
.rtabs{display:none;gap:6px;padding:9px 16px 0;flex-wrap:wrap}
.rtabs button{font:inherit;font-size:12.5px;font-weight:700;padding:6px 14px;border:1px solid var(--rule);
  border-radius:999px;background:#fff;color:var(--ink-2);cursor:pointer}
.rtabs button[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.msg{padding:40px 16px;text-align:center;color:var(--ink-3);font-size:13px}

/* ── 紙 ──────────────────────────────────────── */
.deck{max-width:860px;margin:0 auto;padding:26px 16px 40px;display:flex;flex-direction:column;gap:22px}
.page{background:var(--paper);border:1px solid var(--rule);border-radius:8px;
  padding:30px 32px 46px;position:relative;overflow:hidden;min-width:0}
.page::before{content:"";position:absolute;top:-70px;right:-60px;width:210px;height:210px;
  border-radius:50%;background:var(--teal-bg);opacity:.55;pointer-events:none}
.page > *{position:relative}
.pageno{position:absolute;right:32px;bottom:18px;font-size:11px;letter-spacing:.18em;color:var(--ink-3)}

.ph{display:flex;justify-content:space-between;gap:14px 24px;flex-wrap:wrap;
  border-bottom:1px solid var(--rule);padding-bottom:10px}
.eyebrow{font-size:11.5px;font-weight:700;color:var(--teal);letter-spacing:.04em}
.ph-t{font-size:13.5px;font-weight:700;margin-top:1px;letter-spacing:.02em}
.ph-r{text-align:right;font-size:11.5px;color:var(--ink-3);line-height:1.6}
.ph-r b{display:block;color:var(--ink);font-size:13px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:3px;padding:1px 7px;
  background:var(--navy-bg);color:var(--navy);margin-left:6px}
.badge.warn{background:var(--coral-bg);color:#a8402c}
.badge.ok{background:var(--teal-bg);color:#0c6b61}

.headline{font-size:clamp(21px,4vw,29px);font-weight:900;margin-top:22px;letter-spacing:-.01em}
.headline.sm{font-size:clamp(18px,3vw,23px)}
.lead{margin-top:11px;font-size:13px;color:var(--ink-2);max-width:60ch;line-height:1.85}

.hero{margin-top:20px;background:var(--navy);color:#fff;border-radius:9px;padding:22px 24px}
.hero .chip{display:inline-block;font-size:11px;font-weight:700;background:rgba(255,255,255,.14);
  border-radius:3px;padding:2px 9px;letter-spacing:.04em}
.hero h3{font-size:clamp(16px,2.6vw,20px);font-weight:900;margin-top:11px;line-height:1.65}
.hero p{margin-top:11px;font-size:12.5px;color:#cfdde3;line-height:1.75}
.hero p b{color:#fff}

.kpis{margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:13px 14px;min-width:0}
.kpi .k{font-size:11px;color:var(--ink-3)}
.kpi .v{font-size:clamp(19px,3.3vw,25px);font-weight:900;margin-top:3px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .v s{text-decoration:none;font-size:.52em;font-weight:700;margin-left:1px}
.kpi .d{font-size:11px;margin-top:3px;color:var(--ink-3)}
.dn{color:var(--coral);font-weight:700} .up{color:var(--teal);font-weight:700}

.sec{display:flex;gap:10px;align-items:center;margin-top:26px}
.sec .n{background:var(--teal);color:#fff;font-size:11px;font-weight:700;border-radius:4px;
  padding:3px 8px;flex:none;letter-spacing:.04em}
.sec h3{font-size:16px;font-weight:900}

.cols{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.col{border:1px solid var(--rule);border-radius:7px;padding:15px 16px;min-width:0}
.col.fact{background:var(--paper)} .col.opp{background:var(--teal-bg);border-color:#cfe6e0}
.col.next{background:var(--sand-bg);border-color:#ecdfbe}
.col .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:3px;
  background:rgba(23,33,43,.07);color:var(--ink-2)}
.col.opp .tag{background:rgba(23,162,148,.16);color:#0c6b61}
.col.next .tag{background:rgba(205,163,73,.2);color:#876a1d}
.col h4{font-size:14px;margin-top:9px}
.col .items{margin-top:11px;display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:9px;align-items:flex-start}
.item .ic{flex:none;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:var(--coral-bg);color:var(--coral);margin-top:2px}
.item.up .ic{background:var(--teal-bg);color:#0c6b61}
.item.no .ic{background:rgba(23,33,43,.07);color:var(--ink-2)}
.item b{font-size:13px;display:block}
.item span{font-size:11.5px;color:var(--ink-3);display:block;font-variant-numeric:tabular-nums}

.summary{margin-top:16px;border-left:3px solid var(--sand);padding:9px 0 9px 14px;font-size:13px;color:var(--ink-2)}
.summary b{color:var(--ink)}
.foot{margin-top:16px;font-size:10.5px;color:var(--ink-3);line-height:1.7;max-width:76ch}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:7px;padding:16px 18px;min-width:0}
.card > h4{font-size:12.5px;color:var(--ink-3);letter-spacing:.02em;margin-bottom:9px}
.g2{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g32{margin-top:16px;display:grid;grid-template-columns:1.25fr 1fr;gap:12px}

/* 増減のブリッジ */
.bridge{margin-top:12px;display:flex;align-items:stretch;gap:9px;flex-wrap:wrap}
.bx{flex:1 1 130px;border-radius:7px;padding:14px 10px;text-align:center;color:#fff;min-width:0}
.bx .l{font-size:10.5px;opacity:.86}
.bx .v{font-size:clamp(17px,3vw,23px);font-weight:900;line-height:1.25;font-variant-numeric:tabular-nums}
.bx .u{font-size:10.5px;opacity:.86}
.bx.prev{background:var(--navy)} .bx.plus{background:var(--teal)}
.bx.minus{background:var(--coral)} .bx.now{background:#1d4557}

/* 一覧 */
.rows{margin-top:11px;display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:10px;align-items:baseline;font-size:12.5px}
.row .t{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.row .s{flex:none;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.bar{height:7px;border-radius:4px;background:var(--navy);min-width:2px}
.bar.t2{background:var(--teal)} .bar.c2{background:var(--coral)} .bar.s2{background:var(--sand)}
.barrow{display:grid;grid-template-columns:minmax(132px,1.1fr) 1fr auto;gap:12px;align-items:center;
  font-size:12.5px;padding:3px 0}
.barrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.barrow .vv{font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap}
.barrow .vv em{font-style:normal;font-weight:400;color:var(--ink-3);font-size:11.5px;margin-left:2px}

table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
th,td{border-bottom:1px solid var(--rule);padding:8px 8px;text-align:left;vertical-align:middle}
td{font-size:12px}
th{font-size:11px;color:var(--ink-3);font-weight:700;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scrollx{overflow-x:auto}

/* 分析本文・提案 */
/* 分析本文は2段組み。1段のままだと右側が大きく空いて読みにくくなります */
.body{margin-top:12px;column-count:2;column-gap:30px}
.body p{font-size:12.5px;color:var(--ink-2);margin-top:12px;line-height:1.95}
.body p:first-child{margin-top:0}
.acts{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:1px solid var(--rule);border-radius:7px;padding:12px 14px;background:var(--paper)}
.act .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.act .no{background:var(--navy);color:#fff;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 7px}
.act .kind{font-size:10.5px;font-weight:700;border-radius:3px;padding:1px 8px;background:var(--teal-bg);color:#0c6b61}
.act .kind.plan{background:var(--sand-bg);color:#876a1d}
.act h4{font-size:13px;flex:1 1 100%}
.act p{margin-top:6px;font-size:11.5px;color:var(--ink-3);line-height:1.7}
.owner{margin-top:16px;border-radius:7px;padding:13px 16px;font-size:12.5px;
  background:var(--navy-bg);border:1px solid #d8e3e8}
.owner.confirm{background:var(--sand-bg);border-color:#ecdfbe}
.owner.approve{background:var(--coral-bg);border-color:#f3cfc7}
.owner b{display:block;font-size:12px;margin-bottom:3px}

.trend{margin-top:10px;width:100%;height:120px;display:block}

/* 見出し下の再生回数グラフ（1週間 / 半年の切り替え）。
   ⚠ 切り替えはCSSだけで動かしています（ラジオ＋兄弟セレクタ）。JSに移さないこと。
   ⚠ 紙では両方を出します。印刷したPDFは切り替えられないためです。 */
.chartbox{margin-top:18px;background:var(--paper);border:1px solid var(--rule);border-radius:7px;padding:14px 16px 12px}
.chartbox > input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.ctabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctabs .lbl{font-size:12.5px;color:var(--ink-3);margin-right:4px}
.ctabs label{font-size:11.5px;font-weight:700;padding:3px 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--rule);color:var(--ink-2);background:var(--paper);user-select:none}
#crw:checked ~ .ctabs label[for=crw],
#crh:checked ~ .ctabs label[for=crh]{background:var(--navy);border-color:var(--navy);color:#fff}
.cpane{display:none;margin-top:10px}
#crw:checked ~ .cpane.w{display:block}
#crh:checked ~ .cpane.h{display:block}
.cpane .xlab{display:flex;margin-top:5px}
.cpane .xlab span{flex:1 1 0;min-width:0;text-align:center;font-size:9.5px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden}
.cpane .cnote{margin-top:8px;font-size:10.5px;color:var(--ink-3);line-height:1.7}
.cpane .cnote b{color:var(--ink)}
.note{margin-top:10px;font-size:10.5px;color:var(--ink-3);line-height:1.75}

/* ── 画面が狭いとき。⚠ `screen and` を外さないこと（紙に効いてしまいます） ── */
@media screen and (max-width:860px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .acts{grid-template-columns:1fr}
  .body{column-count:1}
  .cols,.g2,.g32{grid-template-columns:1fr}
  .page{padding:22px 18px 40px}
  .pageno{right:18px}
}

/* ── 印刷（A4・1ページ1枚） ───────────────────── */
@page{size:A4;margin:11mm 10mm}
@media print{
  body{background:#fff}
  .toolbar,.rtabs,.msg{display:none!important}
  .deck{max-width:none;margin:0;padding:0;gap:0}
  .page{border:0;border-radius:0;padding:0 0 10mm;break-after:page;page-break-after:always;overflow:visible}
  .page:last-child{break-after:auto;page-break-after:auto}
  .page::before{display:none}
  .card,.col,.act,.owner,.kpi{break-inside:avoid;page-break-inside:avoid}
  .pageno{position:static;text-align:right;margin-top:8px}

  /* ★ 紙では1ページを A4 ちょうど1枚に収めます。⚠ ここを外すと溢れて次の紙へ送られ、
       「7ページの資料」が10枚になります（2026-10-27 に実測）。
       ⚠ 数字そのものは縮めません。縮めるのは余白と文字の大きさだけです。 */
  body{font-size:12px;line-height:1.62}
  .ph{padding-bottom:7px}
  .headline{font-size:20px!important;margin-top:14px}
  .lead{font-size:11.5px;margin-top:8px}
  .hero{margin-top:12px;padding:14px 16px}
  .hero h3{font-size:16px!important;margin-top:7px}
  .hero p{font-size:11px;margin-top:7px}
  .kpis{margin-top:10px;gap:7px}
  .kpi{padding:9px 10px}
  .kpi .v{font-size:18px!important}
  .kpi .k,.kpi .d{font-size:10px}
  .sec{margin-top:14px}
  .sec h3{font-size:14px}
  .cols{margin-top:9px;gap:8px}
  .col{padding:10px 11px}
  .col h4{font-size:12.5px;margin-top:6px}
  .col .items{margin-top:7px;gap:6px}
  .item b{font-size:11.5px}
  .item span{font-size:10px}
  .item .ic{width:16px;height:16px;font-size:10px}
  .summary{margin-top:10px;font-size:11.5px;padding:6px 0 6px 12px}
  .foot{margin-top:9px;font-size:9.5px;line-height:1.6}
  .card{padding:11px 13px}
  .card > h4{font-size:12.5px}
  .g2,.g32{margin-top:10px;gap:8px}
  .body{column-gap:24px}
  .body p{font-size:10.5px;margin-top:8px;line-height:1.8}
  .act{padding:8px 10px}
  .act h4{font-size:11.5px}
  .act p{font-size:10px;margin-top:4px;line-height:1.6}
  .owner{margin-top:8px;padding:8px 11px;font-size:11px}
  .barrow,.row{font-size:11px}
  .barrow .vv{font-size:11px}
  table{font-size:10.5px;margin-top:7px}
  th,td{padding:4px 6px}
  .note{font-size:9.5px;margin-top:6px;line-height:1.6}
  .bridge{margin-top:9px;gap:6px}
  .bx{padding:9px 7px}
  .bx .v{font-size:17px!important}
  .trend{height:78px;margin-top:8px}
  /* 紙では1週間と半年の両方を出します（印刷したPDFは切り替えられないため）。
     ⚠ グラフの高さの !important を外さないこと。インラインの height に負けて、
       01ページが A4 1枚に収まらなくなります（実測で47px 溢れました）。 */
  .chartbox{margin-top:10px;padding:9px 12px 7px}
  .ctabs{display:none}
  .cpane{display:block!important;margin-top:4px}
  .cpane + .cpane{margin-top:8px;padding-top:7px;border-top:1px solid var(--rule)}
  .cpane .trend{height:52px!important;margin-top:4px}
  .cpane .xlab span{font-size:8.5px}
  .cpane .cnote{margin-top:4px;font-size:9.5px;line-height:1.6}
  /* 提案は紙では2段に。⚠ 件数が増えても、ここを1段に戻すと2ページ目へ溢れます */
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .acts .act{margin-top:0}
}
</style>
</head>
<body>

<div class="toolbar" id="toolbar" style="display:none">
  <a href="index.html">← ダッシュボード</a>
  <select id="weekSelect" onchange="onWeekChange()"></select>
  <button class="printbtn" onclick="window.print()">🖨 印刷 / PDF保存</button>
</div>

<div class="rtabs" id="rtabs" style="display:none"></div>

<div class="msg" id="loadMsg" style="display:none">読み込み中...</div>
<div class="deck" id="sheet" style="display:none"></div>
<div class="deck" id="periodSheet" style="display:none"></div>

<!-- ★ 数字は report_model.js で1回だけ確定させます（2026-08-28 レビュー6回目 §1）。
     ⚠⚠ **このファイルに計算を書き戻さないこと。**ここは表示だけを担当します。
     ⚠ 読み込み順を変えないこと。下の <script> はこれが定義済みである前提で書かれています。 -->
<script src="report_model.js"></script>
<script src="report_period_view.js"></script>
<script>
'use strict';
const DATA_URL = 'data.json';
const M = window.CDModel;
const DEBUG = new URLSearchParams(location.search).get('debug') === '1';

/* ⚠ 2026-09-11 より前に書かれた分析本文は出しません。本編と計算方法・運用方針が
     食い違うためです。**過去週を出したくなったら、その週の本文を書き直してから
     この日付を動かすこと。日付だけ下げないこと。** */
const AI_BODY_FROM = '2026-09-11';

let RAWDATA = null, REPORTS = [], COUPON = null, EXTRA = null, TREND = null;
let CHANNEL = '【LightTHREE】 -ポーカーメディア‐';   // ⚠ 直書きに戻さないこと（data.json の meta.channel_title が正）

/* ⚠ 実装はすべて report_model.js。ここで定義し直さないこと */
const esc = M.esc, fmtFull = M.fmtFull, fmtMan = M.fmtMan, fmtDate = M.fmtDate;
const md = M.md, pct = M.pct, pctNum = M.pctNum, fmtMin = M.fmtMin, SRC = M.SRC;

const WD = ['日','月','火','水','木','金','土'];
const wd = s => s ? WD[new Date(s + 'T00:00:00Z').getUTCDay()] : '';
/* ⚠ 曜日は日付から出します。固定文字列に戻さないこと
     （週の区切りを 2026-09-05 に 土〜金 → 月〜日 へ変えたとき、固定の「（土）〜（金）」が
       残って誤表記になりました）。 */
const period = m => `${fmtDate(m.period.start)}（${wd(m.period.start)}）〜${fmtDate(m.period.end).slice(5)}（${wd(m.period.end)}）`;
const sign = v => (v == null) ? '—' : (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
const cls  = v => (v == null) ? '' : (v >= 0 ? 'up' : 'dn');
const man  = n => fmtMan(n);
const p1   = v => (v == null) ? '—' : v.toFixed(1) + '%';

/* 26週の位置。⚠ 表示だけの計算です（weekly_trend をそのまま読むだけ） */
function trend26(ws){
  if(!TREND || !TREND.length) return null;
  const i = TREND.findIndex(d => d.week_start === ws);
  if(i < 0) return null;
  const win = TREND.slice(Math.max(0, i - 25), i + 1);
  const cur = TREND[i].views;
  const avg = win.reduce((s, d) => s + d.views, 0) / win.length;
  const rank = win.slice().sort((a, b) => b.views - a.views).findIndex(d => d.week_start === ws) + 1;
  return { cur, avg, rank, n: win.length, pctOfAvg: avg ? cur / avg * 100 : null, win };
}
/* 順位を言葉にする。⚠ 目標ではありません。26週の中での位置の説明です */
function rankWord(t){
  if(!t) return '';
  const q = t.rank / t.n;
  return q <= 0.25 ? '26週の中では上位' : q >= 0.75 ? '26週の中では下位' : '水準はふだんの範囲';
}

/* 長いタイトルは切ります。⚠ 切るときは必ず「…」を付けること。
   途中で切れたタイトルが「」で閉じずに出る不具合が過去にありました。 */
/* 棒グラフ。⚠ 表示だけの部品です。数字は report_model.js が確定させたものを渡してください。
   ⚠ `preserveAspectRatio="none"` で横に伸ばすので、SVGの中に文字を置かないこと（つぶれます）。
      目盛りは下のHTML側（.xlab）で出しています。 */
function barSVG(rows, h){
  const W = 760, H = h || 118, n = rows.length || 1, gap = W / n, bw = Math.max(2, gap * .62);
  const mx = Math.max(...rows.map(r => r.v), 1);
  return `<svg class="trend" style="height:${H}px" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
      role="img" aria-label="再生回数の推移">`
    + rows.map((r, i) => {
        const bh = Math.max(1, r.v / mx * (H - 8));
        return `<rect x="${(i * gap + (gap - bw) / 2).toFixed(1)}" y="${(H - bh).toFixed(1)}"
          width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2"
          fill="${r.on ? 'var(--coral)' : '#dde6ea'}"><title>${esc(r.t)}</title></rect>`;
      }).join('') + `</svg>`;
}
const xlab = rows => `<div class="xlab">${rows.map(r => `<span>${esc(r.x || '')}</span>`).join('')}</div>`;

const cut = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const vlabel = (v, n) => `${v.published_at ? md(v.published_at) + ' ' : ''}${cut(v.title || v.t, n || 20)}`;

/* ═══ ページ1: ひと目でわかる今週の結果 ═══ */
function page1(m, t){
  const mt = m.metrics, ns = m.newShare, cp = m.couponWeek;
  const head = `再生数は${Math.abs(mt.deltaPct).toFixed(1)}%${mt.deltaPct >= 0 ? '増' : '減'}。`
    + (t ? `<br>ただし直近${t.n}週中${t.rank}位で、${rankWord(t)}` : '');
  const lead = [
    `いちばん上振れた1本を除いた前週比は${sign(mt.baselinePct)}です。`,
    ns && ns.count ? `${nsLabel(ns)}は合計${man(ns.sum)}回で、今週の視聴の${p1(ns.pct)}を占めます。` : ''
  ].filter(Boolean).join('');

  const ai = (m.rep.ai_analysis || {});
  const heroP = [
    mt.subsPer10k != null ? `視聴1万回あたりの新規登録は<b>${mt.subsPer10k.toFixed(2)}人</b>`
      + (mt.subsPer10kPrev != null ? `（前週${mt.subsPer10kPrev.toFixed(2)}人）` : '') + '。' : '',
    mt.firstMedian != null ? `公開48時間の視聴は中央値<b>${man(mt.firstMedian)}回</b>`
      + (mt.firstMedianPrev != null ? `（前週${man(mt.firstMedianPrev)}回）` : '') + '。' : ''
  ].filter(Boolean).join('');

  const kpi = [
    ['1週間の再生数', man(mt.views) + '<s>回</s>', `前週より${pct(mt.views, mt.viewsPrev)}`, cls(mt.deltaPct)],
    ['総再生時間', mt.watchHours != null ? fmtFull(mt.watchHours) + '<s>時間</s>' : '—',
     mt.watchPct != null ? `前週より${sign(mt.watchPct)}` : '—', cls(mt.watchPct)],
    ['登録者（公開値の差）', (mt.subsNet >= 0 ? '+' : '') + fmtFull(mt.subsNet) + '<s>人</s>',
     `新規${fmtFull(mt.subsGained)} ／ 解除${fmtFull(mt.subsLost)}`, ''],
    ['公開した動画', fmtFull(mt.newCount) + '<s>本</s>',
     ns && ns.count ? `週内の視聴 ${man(ns.sum)}回` : '', '']
  ].map(([k, v, d, c]) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div>`
    + `<div class="d ${c}">${d}</div></div>`).join('');

  const d1 = mt.views - mt.viewsPrev;
  const factItems = [
    item(mt.deltaPct >= 0, `視聴 ${d1 >= 0 ? '+' : '−'}${man(Math.abs(d1))}回`,
         `${man(mt.viewsPrev)}回 → ${man(mt.views)}回`),
    item(mt.baselinePct >= 0, `上振れた1本を除くと ${sign(mt.baselinePct)}`,
         m.verdict && m.verdict.top ? `除いたのは ${md(m.verdict.top.pub)}公開の1本` : '')
  ].join('');

  const oppItems = [
    ns && ns.count ? item(true, `新作が週の${p1(ns.pct)}を占めた`, `${nsLabel(ns)}で${man(ns.sum)}回`) : '',
    mt.firstMedian != null ? item(mt.firstMedianPct == null || mt.firstMedianPct >= 0,
        `48時間の視聴 中央値${man(mt.firstMedian)}回`,
        `${m.first.count}本で測った値`
        + (mt.firstMedianPrev != null ? `／前週 ${man(mt.firstMedianPrev)}回` : '')) : ''
  ].filter(Boolean).join('');

  const cpItems = (cp && COUPON) ? [
    item(null, `今週の入力 ${fmtFull(cp.entries)}件`,
         `1日あたり ${cp.perDay != null ? cp.perDay.toFixed(1) : '—'}件`
         + (cp.daysPrev ? `（前週 ${cp.perDayPrev.toFixed(1)}件）` : '')),
    item(null, `通算 ${fmtFull(COUPON.total)}件`,
         `${fmtFull(COUPON.used)}件が使用済み（${p1(COUPON.used / COUPON.total * 100)}）`)
  ].join('') : `<div class="item no"><div class="ic">—</div><div><b>今週の入力はありません</b></div></div>`;

  return pageWrap(1, 'ひと目でわかる今週の結果', m, t, `
    <div class="headline">${head}</div>
    <p class="lead">${lead}</p>
    ${viewsChart(m, t)}
    <div class="hero"><span class="chip">今週の結論</span>
      <h3>${esc(ai.headline || (m.verdict ? m.verdict.headline : ''))}</h3>
      ${heroP ? `<p>${heroP}</p>` : ''}</div>
    <div class="kpis">${kpi}</div>
    <div class="sec"><span class="n">01</span><h3>今週わかった3つのこと</h3></div>
    <div class="cols">
      <div class="col fact"><span class="tag">事実</span><h4>全体の数字</h4><div class="items">${factItems}</div></div>
      <div class="col opp"><span class="tag">機会</span><h4>伸びているところ</h4><div class="items">${oppItems}</div></div>
      <div class="col next"><span class="tag">クーポン</span><h4>入力と使われ方</h4><div class="items">${cpItems}</div></div>
    </div>
    <p class="foot">数字は <code>data.json</code> の実測です。割合には分母を書いています。</p>`);
}
/* ═══ 見出し下の再生回数グラフ（1週間 ⇄ 半年） ═══
   1週間 = レポート週の日次（`analytics_daily`）／半年 = 直近26週（`weekly_trend`）。
   ⚠ 2つは**集計のもとが違います。**日次の合計と週次の値は少しずれるので、足し引きしないこと。 */
function viewsChart(m, t){
  const D = m.daily;
  const wk = (D && D.rows.length) ? D.rows.map(r => ({
        v: r.views, on: false, x: md(r.date),
        t: `${fmtDate(r.date)}（${wd(r.date)}） ${fmtFull(r.views)}回`
      })) : null;
  if(wk && wk.length){ const mxi = wk.reduce((b, r, i) => r.v > wk[b].v ? i : b, 0); wk[mxi].on = true; }

  const hy = (t && t.win.length) ? t.win.map((d, i) => ({
        v: d.views, on: d.week_start === m.period.start,
        x: (i % 4 === 0 || i === t.win.length - 1) ? fmtDate(d.week_start).slice(5) : '',
        t: `${fmtDate(d.week_start)}〜 ${fmtFull(d.views)}回`
      })) : null;
  if(!wk && !hy) return '';

  const wPane = wk ? `<div class="cpane w">${barSVG(wk)}${xlab(wk)}
      <p class="cnote">この週の日次です。いちばん多い日は<b>${md(D.peak.date)}の${fmtFull(D.peak.views)}回</b>、
        7日の合計は<b>${fmtFull(D.sum)}回</b>（前週${fmtFull(D.prevSum)}回）。
        ${D.days < 7 ? `確定しているのは${D.days}日ぶんで、残りはまだ入っていません。` : ''}</p></div>` : '';
  const hPane = hy ? `<div class="cpane h">${barSVG(hy)}${xlab(hy)}
      <p class="cnote">直近${t.n}週です。赤い棒が今週で、<b>${t.n}週平均は${fmtFull(Math.round(t.avg))}回</b>、
        今週は<b>${fmtFull(t.cur)}回</b>（${t.n}週中${t.rank}位）。</p></div>` : '';

  return `<div class="chartbox">
    <input type="radio" name="crange" id="crw"${wk ? ' checked' : ''}>
    <input type="radio" name="crange" id="crh"${wk ? '' : ' checked'}>
    <div class="ctabs"><span class="lbl">再生回数</span>
      ${wk ? '<label for="crw">1週間</label>' : ''}${hy ? `<label for="crh">${t.n >= 24 ? '半年' : '直近' + t.n + '週'}</label>` : ''}</div>
    ${wPane}${hPane}</div>`;
}

/* 週内公開の本数の書き方。⚠ 拾えた本数と公開本数が違う週があるので、違うときは必ず両方書く */
function nsLabel(ns){
  return ns.count === ns.total ? `週内に公開した${ns.total}本`
                               : `週内公開のうち数字を拾えた${ns.count}本（公開は${ns.total}本）`;
}
function item(good, b, s){
  const c = good == null ? 'no' : good ? 'up' : '';
  const ic = good == null ? '—' : good ? '↗' : '↓';
  return `<div class="item ${c}"><div class="ic">${ic}</div><div><b>${b}</b>${s ? `<span>${s}</span>` : ''}</div></div>`;
}

/* ═══ ページ2: 今週の分析と、次の一手 ═══ */
function page2(m, t){
  const ai = m.rep.ai_analysis || {};
  const showBody = ai.analysis && ai.generated_at && ai.generated_at >= AI_BODY_FROM;
  const body = showBody
    ? `<div class="body">${String(ai.analysis).split('\n').filter(s => s.trim())
        .map(s => `<p>${esc(s)}</p>`).join('')}</div>`
    : `<p class="note">${ai.analysis ? 'この週の分析本文は、いまの計算方法・運用方針と食い違うため表示していません。'
        : 'この週の分析はまだ書かれていません。'}</p>`;

  /* ★ 2026-10-31 運営者の指示: 「次の一手（NA）」の節は **このレポートには出しません。**
     ⚠⚠ **提案そのものをやめたのではありません。**`data.json` の `ai_analysis.suggestions` は
       これまでどおり書き続けます（運用手順 §7 の「具体的な提案2〜4個」は有効）。
       **ダッシュボードのAI分析タブ（`index.html`）と `report_brief.html` には引き続き出ます。**
       レポートに出す／出さないの話です（2026-10-29 に「上位5本の注記」を外したのと同じ扱い）。
     ⚠ **`report_model.js` の `actions()` は消していません。**`check_consistency.js` の検査D
       （アクションの件数が `suggestions` と一致するか）が `m.actions` を見ているためです。
       **モデル側を消すと検査が落ちます。**
     ⚠ **`.acts` / `.act` の CSS は残してあります**（戻すときのため）。使っていません。
     ⚠ **節が1つだけになったので `01` / `02` の番号と「今週の分析」の見出しも外しました。**
       ページ上部の見出しが「今週の分析」なので、同じ文が2回出ます（2026-10-27 に
       「02の大見出しが01と重複」で消したのと同じ理由）。**戻すときは番号ごと戻すこと。** */

  /* ★ 2026-10-27 運営者の指示: 「オーナー判断：判断不要」の囲みは出しません。
     オーナーにしてほしいことが無い週に、何も言っていない1枠が残るためです。
     ⚠⚠ **要確認・要承認は引き続き出します。**ここまで消すと、オーナーが決めないと
       進められない件が資料のどこにも出なくなります（運用手順 §7-1 の役割分担）。
     ⚠ 未設定も出しません（§7-1「未設定＝何も表示しない」のまま）。 */
  const o = m.owner;
  const oTxt = { confirm: '要確認', approve: '要承認' }[o.level];
  const owner = oTxt
    ? `<div class="owner ${o.level}"><b>オーナー判断：${oTxt}</b>${esc(M.stripLevel(o.text))}</div>`
    : '';

  return pageWrap(2, '今週の分析', m, t, `
    <div style="margin-top:20px">${body}</div>
    ${owner}`);
}

/* ═══ ページ3: 前週からどう変わったか ═══ */
function page3(m, t){
  const c = m.cause;
  if(!c) return '';
  /* ⚠ upRows / dnRows には「その他」の行が入っています（本数は tail）。
     upSum / dnSum はそれを含んだ合計です。二重に足さないこと。 */
  const up = c.upSum, dn = c.dnSum;
  const bridge = [
    ['prev', '前週', man(c.viewsPrev)], ['plus', '増えたぶん', '+' + man(up)],
    ['minus', '減ったぶん', '−' + man(Math.abs(dn))], ['now', '今週', man(c.views)]
  ].map(([k, l, v]) => `<div class="bx ${k}"><div class="l">${l}</div><div class="v">${v}</div><div class="u">回</div></div>`).join('');

  const mx = Math.max(...c.upRows.map(r => Math.abs(r.d)), ...c.dnRows.map(r => Math.abs(r.d)), 1);
  const list = (rows, kind) => rows.slice(0, 6).map(r => `<div class="barrow">
      <span class="nm" title="${esc(r.t)}">${r.other ? esc(r.t) + (r.tail ? `（${fmtFull(r.tail)}本）` : '') : vlabel(r, 18)}</span>
      <span class="bar ${kind}" style="width:${Math.max(2, Math.abs(r.d) / mx * 100)}%;${r.other ? 'opacity:.4' : ''}"></span>
      <span class="vv ${r.d >= 0 ? 'up' : 'dn'}">${r.d >= 0 ? '+' : '−'}${man(Math.abs(r.d))}</span>
    </div>`).join('');

  const top = m.verdict && m.verdict.top;
  return pageWrap(3, '前週からどう変わったか', m, t, `
    <div class="headline sm">${c.tot >= 0 ? '増加' : '減少'}は${man(Math.abs(c.tot))}回。動いた動画は${fmtFull(c.upCount + c.dnCount)}本</div>
    <p class="lead">増えた動画が${fmtFull(c.upCount)}本、減った動画が${fmtFull(c.dnCount)}本。
      足すと今週と前週の差（${c.tot >= 0 ? '+' : '−'}${man(Math.abs(c.tot))}回）になります。</p>
    <div class="bridge">${bridge}</div>
    <div class="g2">
      <div class="card"><h4>増えた動画　合計 +${man(up)}回</h4>${list(c.upRows, 't2')}</div>
      <div class="card"><h4>減った動画　合計 −${man(Math.abs(dn))}回</h4>${list(c.dnRows, 'c2')}</div>
    </div>
    <p class="foot">薄い棒は、表に出していない動画をまとめたものです。
      「増加がいちばん大きい1本を除く」と前週比は ${sign(m.metrics.baselinePct)}
      ${top ? `（除いたのは ${md(top.pub)}公開の1本）` : ''}。減少側の1本を除いた数字とは別の計算です。</p>`);
}

/* ═══ ページ4: 視聴者がどこから来たか ═══ */
function page4(m, t){
  const rows = m.traffic.rows, sp = m.traffic.split;
  if(!rows.length) return '';
  const tot = rows[0].total, mx = rows[0].now || 1;
  const bars = rows.map(r => `<div class="barrow">
      <span class="nm">${esc(r.nm)}${r.moved ? `<span class="badge">${r.prank}位→${r.rank}位</span>` : ''}</span>
      <span class="bar" style="width:${Math.max(2, r.now / mx * 100)}%"></span>
      <span class="vv">${man(r.now)}<em>／${p1(r.share)}</em></span>
    </div>`).join('');

  const tbl = rows.slice(0, 4).map(r => `<tr><td>${esc(r.nm)}</td>
      <td class="n">${fmtFull(r.prev)} → ${fmtFull(r.now)}</td>
      <td class="n ${cls(pctNum(r.now, r.prev))}">${r.prev ? pct(r.now, r.prev) : '—'}</td>
      <td class="n">${p1(r.sharePrev)} → ${p1(r.share)}</td></tr>`).join('');

  return pageWrap(4, '視聴者がどこから来たか', m, t, `
    <div class="headline sm">いちばん多い入口は${esc(rows[0].nm)}。${man(rows[0].now)}回で、流入の${p1(rows[0].share)}</div>
    <p class="lead">割合の分母は、その週の流入経路の合計 ${fmtFull(tot)}回です。
      週の視聴回数（${fmtFull(m.metrics.views)}回）とは分母が違います。</p>
    <div class="card" style="margin-top:18px"><h4>今週どこから見られたか　実数 ／ 割合</h4>${bars}</div>
    <div class="card" style="margin-top:12px"><h4>前週からどう変わったか（上位4経路）</h4>
      <div class="scrollx"><table><thead><tr><th>経路</th><th class="n">前週 → 今週</th>
        <th class="n">前週比</th><th class="n">割合</th></tr></thead><tbody>${tbl}</tbody></table></div>
      <p class="note">割合が上がっても実数では減っていることがあります。増減は実数で見てください。</p></div>
    ${sp ? `<div class="card" style="margin-top:12px"><h4>1本の動画に頼りすぎていないか</h4>
      <p class="lead" style="margin-top:6px">${esc(sp.nm)}の${man(sp.now)}回のうち、いちばん多い1本は${man(sp.top.v)}回。
        除いた残りは${man(sp.rest)}回で、前週の${man(sp.p0)}回を${sp.restBeatsPrev ? '上回ります' : '下回ります'}。</p>
      </div>` : ''}`);
  /* ⚠ 2026-10-29 運営者の指示で、ここにあった「動画別の流入内訳は上位5本ぶんしかありません。
       残りは分かりません。」の注記を消しました。**足し直さないこと。**
     ⚠⚠ **ルールが消えたわけではありません。**レポートに出す／出さないの話です。
       `video_traffic` が上位5本ぶんしかないことと、5本で全体を代表させないことは
       運用手順 §3 に残っています。**分析する側は必ずそちらを読むこと。** */
}

/* ═══ ページ5: 新作と過去動画の結果 ═══ */
function page5(m, t){
  const F = m.first, ns = m.newShare;
  const mxf = F.list.length ? F.list[0].first2d || 1 : 1;
  const speed = F.list.length ? F.list.map(v => `<div class="barrow">
      <span class="nm" title="${esc(v.title)}">${vlabel(v, 18)}</span>
      <span class="bar t2" style="width:${Math.max(2, v.first2d / mxf * 100)}%"></span>
      <span class="vv">${man(v.first2d)}</span></div>`).join('')
    : '<p class="note">この週の新作には、48時間が経ったものがありません。</p>';

  const tv = (m.rep.top_videos || []).slice(0, 5).map(v => `<tr>
      <td title="${esc(v.title)}">${cut(v.title, 22)}${v.views_prev_week ? '' : '<span class="badge ok">新規</span>'}</td>
      <td class="n">${man(v.views_week)}</td>
      <td class="n">${v.views_prev_week ? man(v.views_prev_week) : '—'}</td></tr>`).join('');

  const why = ns && ns.top ? M.videoTraffic(m.rep, ns.top.video_id) : null;
  return pageWrap(5, '新作と過去動画の結果', m, t, `
    <div class="headline sm">${ns && ns.count ? `週内公開の${ns.count}本が、今週の視聴の${p1(ns.pct)}を占めた`
                                               : '今週は、数字を拾えた新作がありません'}</div>
    <p class="lead">${ns && ns.count ? `いちばん多い1本は${man(ns.top.views_week)}回で、今週の視聴の${p1(ns.topPct)}。` : ''}
      ${why ? `その1本は流入の${p1(why.topPct)}が${esc(why.topName)}からでした。` : ''}</p>
    <div class="g32">
      <div class="card"><h4>新作の公開48時間の視聴</h4>${speed}
        <p class="note">中央値 ${man(F.median)}回（${F.count}本で測った値）${F.medianPrev != null ? `／前週 ${man(F.medianPrev)}回（${F.prevCount}本）` : ''}。
          48時間が経っていない本は入れていません。</p></div>
      <div class="card"><h4>よく見られた動画</h4>
        <div class="scrollx"><table><thead><tr><th>動画</th><th class="n">今週</th><th class="n">前週</th></tr></thead>
        <tbody>${tv}</tbody></table></div>
        <p class="note">「新規」はその週に公開した動画です。前週の数字が無いため前週比は出していません。</p></div>
    </div>`);
}

/* ═══ ページ7: クーポンコードの結果 ═══ */
function page7(m, t){
  const cp = m.couponWeek, C = COUPON;
  if(!C) return '';
  /* ★ 2026-10-30: 上位6件 → **全件**（運営者の指示）。並びは新しい順。
     ⚠ 並べ方の前提は `report_model.js` の `couponCodes()` に書いてあります（コード名から日付を読む）。
     ⚠ **黙って上位N件に戻さないこと。**紙が溢れそうになったら運営者に相談する、という判断です。 */
  const codeRows = M.couponCodes(RAWDATA);
  const codes = codeRows.map(c => `<tr>
      <td>${esc(c.code)}</td><td class="n">${fmtFull(c.entries)}</td>
      <td class="n">${c.entries ? p1(c.used / c.entries * 100) : '—'}</td></tr>`).join('');
  const wk = (C.weekly || []).slice(-6).map(w => `<tr><td>${fmtDate(w.week_start).slice(5)}週</td>
      <td class="n">${fmtFull(w.entries)}</td><td class="n">${fmtFull(w.people)}</td></tr>`).join('');
  const sg = C.signup_lag_buckets || [];
  const known = sg.filter(b => b.label !== '不明').reduce((s, b) => s + b.count, 0);
  const isNew = sg.filter(b => /同時|当日/.test(b.label)).reduce((s, b) => s + b.count, 0);
  const rl = C.relogin || [];
  const rlJudged = rl.filter(b => /^(あり|なし)$/.test(b.label)).reduce((s, b) => s + b.count, 0);
  const rlYes = (rl.find(b => b.label === 'あり') || {}).count || 0;

  return pageWrap(7, 'クーポンコードの結果', m, t, `
    <div class="headline sm">通算${fmtFull(C.total)}件が入力され、${p1(C.used / C.total * 100)}が使われた</div>
    <p class="lead">${cp ? `今週の入力は${fmtFull(cp.entries)}件（前週${fmtFull(cp.entriesPrev)}件）。
      コードの発行日と掲出日が記録されていないため、この増減の理由は分かりません。` : ''}</p>
    <div class="g2">
      <div class="card"><h4>コード別（通算・全${codeRows.length}件・新しい順）</h4>
        <div class="scrollx"><table><thead><tr><th>コード</th><th class="n">入力</th><th class="n">使用率</th></tr></thead>
        <tbody>${codes}</tbody></table></div>
        <p class="note">新しいコードほど使用率が低く出ます。使う時間がまだ経っていないためです。</p></div>
      <div class="card"><h4>週ごとの入力（土〜金）</h4>
        <div class="scrollx"><table><thead><tr><th>週</th><th class="n">入力</th><th class="n">人数</th></tr></thead>
        <tbody>${wk}</tbody></table></div>
        <p class="note"><b>この表だけ区切りが土〜金</b>で、レポートの週（月〜日）とは期間が違います。</p></div>
    </div>
    <div class="card" style="margin-top:12px"><h4>入力した人の内訳</h4>
      <div class="scrollx"><table><thead><tr><th>見ているもの</th><th class="n">値</th><th>分母</th></tr></thead><tbody>
        <tr><td>新規（作成から24時間以内）</td><td class="n">${known ? p1(isNew / known * 100) : '—'}</td>
            <td>作成日が判定できた${fmtFull(known)}件</td></tr>
        <tr><td>再ログインあり</td><td class="n">${rlJudged ? p1(rlYes / rlJudged * 100) : '—'}</td>
            <td>判定が出た${fmtFull(rlJudged)}件</td></tr>
      </tbody></table></div>
      <p class="note">先に登録して後日入れた人は「既存」に入るため、新規は少なめに出ます。
        いちばん古い作成日は ${fmtDate(C.account_oldest || '')} で、それ以前は区別できません。
        コードを入れた人しか載らないので、新規獲得力の測定ではありません。</p></div>
    <p class="foot">読めたコード ${(C.codes_read || []).length}件／読めなかったタブ ${(C.read_errors || []).length}件／
      スナップショット ${fmtDate(C.snapshot_date || '')}。</p>`);
}

/* ═══ 枠 ═══ */
let PAGES = 0, PNO = 0;
/* ⚠ ページ番号は「何枚目か」を数えて出します。各ページ関数が渡す番号は使いません。
   ページを1枚減らしたときに「07 / 06」と出る事故が実際に起きました（2026-10-29）。 */
function pageWrap(no, eyebrow, m, t, inner){
  no = ++PNO;
  const fin = m.final ? `<span class="badge ok">確定</span>`
                      : `<span class="badge warn">速報（確定 ${m.confirmedDays}/7日）</span>`;
  return `<section class="page">
    <div class="ph">
      <div><div class="eyebrow">${esc(eyebrow)}</div><div class="ph-t">${esc(CHANNEL)}</div></div>
      <div class="ph-r">${period(m)}${t ? ` ・${t.rank}位 / ${t.n}` : ''} ${fin}</div>
    </div>
    ${inner}
    <div class="pageno">${String(no).padStart(2, '0')} / ${String(PAGES).padStart(2, '0')}</div>
  </section>`;
}

function renderReportPage(rep){
  const m = M.build(RAWDATA, rep.week_start);
  if(!m){ document.getElementById('sheet').innerHTML = '<p class="msg">この週のモデルを作れませんでした。</p>'; return; }
  const t = trend26(rep.week_start);
  /* ⚠ 2026-10-29: 「見ている人と、26週の中での位置」のページは運営者の判断で削除しました。
     端末別と年代・性別もここで一緒に落ちています。戻すときはデータの注記ごと戻すこと
     （年代・性別は**ログイン視聴者が母数**です）。 */
  const makers = [page1, page2, page3, page4, page5, page7];
  PAGES = makers.length; PNO = 0;
  const html = makers.map((f, i) => { try { return f(m, t, i + 1); } catch(e){
    console.error('page' + (i + 1), e); return `<section class="page"><p class="note">このページを描けませんでした: ${esc(e.message)}</p></section>`; } });
  document.getElementById('sheet').innerHTML = html.join('');
  document.title = `週次レポート ${fmtDate(m.period.start)}週 — ${CHANNEL}`;
  if(DEBUG) console.log('model', m);
}

function showPane(key){
  const isWeek = (key === 'week');
  document.getElementById('sheet').style.display       = isWeek ? 'flex' : 'none';
  document.getElementById('periodSheet').style.display = isWeek ? 'none' : 'block';
  document.getElementById('weekSelect').style.display  = isWeek ? '' : 'none';
  [].forEach.call(document.querySelectorAll('#rtabs button'), b => {
    b.setAttribute('aria-selected', b.dataset.k === key ? 'true' : 'false'); });
  if(!isWeek) document.getElementById('periodSheet').innerHTML =
      CDPeriodView.html(RAWDATA, key, CHANNEL, { tabs: false });
  history.replaceState(null, '', location.pathname + location.search + (isWeek ? '' : '#span=' + key));
  window.scrollTo(0, 0);
}

function buildPaneTabs(){
  if(!window.CDPeriodView || !RAWDATA || typeof M.periodReport !== 'function') return;
  if(!M.periodReport(RAWDATA, 'm3')) return;
  const bar = document.getElementById('rtabs');
  bar.innerHTML = [['week','週次']].concat(CDPeriodView.SPANS)
    .map(([k,l]) => `<button data-k="${k}" aria-selected="${k==='week'}">${esc(l)}</button>`).join('');
  [].forEach.call(bar.querySelectorAll('button'), b => b.addEventListener('click', () => showPane(b.dataset.k)));
  bar.style.display = 'flex';
  const h = (location.hash.match(/span=(\w+)/) || [])[1];
  if(h && CDPeriodView.SPANS.some(([k]) => k === h)) showPane(h);
}

function onWeekChange(){
  const ws = document.getElementById('weekSelect').value;
  history.replaceState(null, '', 'report.html?week=' + ws);
  const rep = REPORTS.find(r => r.week_start === ws);
  if(rep) renderReportPage(rep);
}

async function loadReport(){
  document.getElementById('loadMsg').style.display = 'block';
  try{
    // 毎回サーバーに確認しに行く。変わっていなければ 304 が返るだけなので通信量は増えない。
    // ⚠ 既定（省略）に戻さないこと。GitHub Pages のキャッシュで画面が古いままになります。
    const r = await fetch(DATA_URL, { cache: 'no-cache' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    RAWDATA = data;
    REPORTS = (data.weekly_reports || []).slice().sort((a, b) => b.week_start.localeCompare(a.week_start));
    COUPON  = data.coupon || null;
    EXTRA   = data.analytics_extra || null;
    TREND   = data.weekly_trend || null;
    if(data.meta && data.meta.channel_title) CHANNEL = data.meta.channel_title;
    document.getElementById('loadMsg').style.display = 'none';
    if(!REPORTS.length){
      const el = document.getElementById('loadMsg');
      el.style.display = 'block'; el.textContent = 'レポートはまだありません。';
      document.getElementById('toolbar').style.display = 'flex';
      return;
    }
    const sel = document.getElementById('weekSelect');
    sel.innerHTML = REPORTS.map(r => `<option value="${r.week_start}">${fmtDate(r.week_start)} 〜 ${fmtDate(r.week_end)}${r.final ? '' : '［速報］'}</option>`).join('');
    const q = new URLSearchParams(location.search).get('week');
    const rep = REPORTS.find(r => r.week_start === q) || REPORTS[0];
    sel.value = rep.week_start;
    document.getElementById('toolbar').style.display = 'flex';
    document.getElementById('sheet').style.display = 'flex';
    renderReportPage(rep);
    buildPaneTabs();
  }catch(e){
    const el = document.getElementById('loadMsg');
    el.style.display = 'block'; el.textContent = '読み込み失敗: ' + e.message;
  }
}

// このページはパスワードなしで閲覧可能（ダッシュボード本体のみゲートあり）
loadReport();
</script>
