<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHANNEL DESK 週次ブリーフ</title>
<!--
  ═══════════════════════════════════════════════════════════════════════
  週次ブリーフ（画面用）  2026-08-28 作成
  ═══════════════════════════════════════════════════════════════════════

  ★ これは `report.html` の**置き換えではありません。**別物として並走させる試作です。
     report.html … 明色・A4に1ページで刷れる「提出資料」。レビュー5回で条件付き最終承認済み。
     このファイル … 暗色・全画面スクロール送りの「読ませる資料」。**印刷は想定していません。**
     ⚠ どちらを正にするかは運営者が決めます。**勝手に report.html を消さないこと。**

  ★ 見た目の出どころ: 運営者から参照指定のあったページを Chrome で実測し、
     色・書体・余白・装置を写しました（`/tmp/ref/design_tokens.md` に実測値）。
     ⚠ **数字は参照ページから取っていません。**参照ページの値は data.json と一致しません
       （登録者純増が +110 と +200 など）。**数字は必ず data.json から取ること。**

  ⚠⚠ 参照ページにあった次の2つは**意図的に入れていません**（2026-08-28 運営者の判断）:
     ・「週間増加分の 87.3%」… レビュー4回目で矛盾の元として本編から削除済み
     ・「Shorts構成比 49.5%」… 引き継ぎ書「★ 着手しないこと」で構成比は出さないと決めている
     **どちらも復活させないこと。**流入は構成比ではなく**実数と順位**で見せています。
-->
<style>
:root{
  /* ★ 参照ページの実測値。⚠ 増加=緑・減少=赤です。report.html（青=増加・赤=減少）とは
       逆なので、**片方だけ変えないこと。**混ざると読み手が符号を読み違えます。 */
  --bg:#090d13; --panel:#111822; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.06);
  --text:#f5f7fa; --muted:#9da8b8; --dim:#7c8899;
  --green:#58d6a2; --red:#ff756d; --amber:#f3c768; --blue:#6ea8ff;
  --shorts:#ff655f; --browse:#7185a5;
  --max:1240px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-snap-type:y proximity}
/* ⚠ mandatory ではなく proximity です。mandatory だと、中身が画面より高い節で
     下端が読めないまま次へ飛ばされます（狭い画面で実際に起きます）。 */
body{
  margin:0;color:var(--text);font-size:15px;line-height:1.7;
  font-variant-numeric:tabular-nums;
  background:
    radial-gradient(circle at 78% 15%, rgba(78,112,162,.14), transparent 32%),
    radial-gradient(circle at 18% 85%, rgba(255,101,95,.08), transparent 28%),
    var(--bg);
  background-attachment:fixed;
}
a{color:inherit}
.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}
.blue{color:var(--blue)}.muted{color:var(--muted)}
b{font-weight:700}

/* 上端の進捗バー */
.topline{position:fixed;inset:0 0 auto;z-index:30;height:4px;background:rgba(255,255,255,.06)}
.topline span{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--red),var(--amber));transition:width .15s linear}
/* 左のドット */
.rail{position:fixed;left:26px;top:50%;transform:translateY(-50%);z-index:25;
  display:flex;flex-direction:column;gap:11px}
.rail a{width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,.28);
  display:block;transition:background .2s,border-color .2s}
.rail a.on{background:var(--amber);border-color:var(--amber)}
/* 右下の案内 */
.keys{position:fixed;right:22px;bottom:18px;z-index:25;display:flex;gap:8px;align-items:center;
  font-size:11.5px;color:var(--dim)}
.keys kbd{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);font:inherit;font-size:11px}

section{min-height:100vh;padding:58px 0;scroll-snap-align:start;display:flex;align-items:center}
.inner{width:100%;max-width:var(--max);margin:0 auto;padding:0 28px}

/* ── 見出し ─────────────────────────────── */
.eyebrow{display:flex;gap:10px;align-items:center;font-size:12px;font-weight:750;
  letter-spacing:.13em;color:var(--amber);text-transform:uppercase;margin:0 0 10px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--amber);border-radius:2px;flex:0 0 auto}
h1,h2{margin:0 0 22px;font-weight:700;letter-spacing:-.04em;line-height:1.15}
h1{font-size:clamp(34px,5.4vw,68px);letter-spacing:-.045em;line-height:1.14}
h2{font-size:clamp(28px,3.9vw,50px);letter-spacing:-.035em}
/* ★ 但し書きの行だけ琥珀。結論と留保を色で分ける（参照ページのいちばん効いている装置） */
h1 .but,h2 .but{color:var(--amber);display:block}

/* ── カード ─────────────────────────────── */
.card{background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:16px;padding:22px;
  box-shadow:0 16px 50px rgba(0,0,0,.12);position:relative;overflow:hidden}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
/* ⚠ 左右で高さが違うとき、短いほうのカードは下に空白ができます。
     カードを縦のフレックスにして、最後の要素を `margin-top:auto` で下端に寄せます。
     （高さを揃えるために中身を水増ししないこと。空白のほうがましです） */
.card{display:flex;flex-direction:column}
.card>.push{margin-top:auto}

/* 数字カード。右下の淡い光で、そのカードの性格（増/減）を出す */
.kpi .lab{font-size:12px;color:var(--muted);margin:0 0 2px}
.kpi .val{font-size:clamp(28px,3.1vw,40px);font-weight:820;letter-spacing:-.04em;line-height:1.15}
.kpi .dl{font-size:13px;font-weight:700;margin-top:5px}
.kpi .dl span{color:var(--muted);font-weight:400}
.kpi .nt{font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px}
.kpi .blob{position:absolute;right:-34px;bottom:-46px;width:150px;height:150px;border-radius:50%;
  filter:blur(26px);opacity:.30;pointer-events:none}

/* 注記の箱 */
.note{font-size:12.5px;color:#bdc8d7;background:rgba(110,168,255,.05);
  border-left:1px solid rgba(110,168,255,.18);border-radius:12px;padding:13px 16px;line-height:1.7}
.note b:first-child{color:var(--blue)}
.foot{font-size:12px;color:var(--dim);margin-top:12px}

/* 見出しつきの箱（i / ! など）。色で「言えること／言えないこと」を分ける */
.callout{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);
  border-left:3px solid var(--amber);border-radius:14px;padding:16px 18px;
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015))}
.callout .ic{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-weight:800;font-size:14px;background:rgba(243,199,104,.16);color:var(--amber)}
.callout h3{margin:0 0 4px;font-size:15px;font-weight:700}
.callout p{margin:0;font-size:13.5px;color:#c7d0dc;line-height:1.75}
.callout.ok{border-left-color:var(--green)} .callout.ok .ic{background:rgba(88,214,162,.16);color:var(--green)}
.callout.no{border-left-color:var(--red)}   .callout.no .ic{background:rgba(255,117,109,.16);color:var(--red)}
.callout.nu{border-left-color:var(--dim)}   .callout.nu .ic{background:rgba(157,168,184,.14);color:var(--muted)}

/* 小見出しつきのミニカード（01·RESULT など） */
.brief .k{font-size:11.5px;font-weight:750;letter-spacing:.11em;color:var(--dim);text-transform:uppercase}
.brief h3{margin:8px 0 6px;font-size:16px;font-weight:700}
.brief p{margin:0;font-size:13px;color:#c1cbd8;line-height:1.75}

/* チップ（確定バッジ・期間） */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#c7d0dc;
  border:1px solid var(--line);border-radius:999px;padding:5px 13px;background:rgba(255,255,255,.03)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.chip.warn{border-color:rgba(243,199,104,.45);color:var(--amber)}
.chip.bad{border-color:rgba(255,117,109,.5);color:var(--red)}

/* 横棒（指数比較・流入・クーポン） */
.bars{display:grid;gap:9px;margin-top:4px}
.bar{display:grid;grid-template-columns:var(--lw,132px) 1fr auto;gap:12px;align-items:center;font-size:13px}
.bar .bn{color:#c7d0dc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ★ 動画名は途中で切らず、2行まで折り返します（外部レビュー D「長い動画タイトルは2行まで」／
     同5回目 §3-3「途中省略はタイトルの終わりが分からない」）。
   ⚠ 1行の text-overflow:ellipsis に戻さないこと。390px では題名の半分が消えます
     （実測 561px の題名が 246px の枠に入っていました）。 */
.clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  overflow:hidden;white-space:normal;line-height:1.55}

/* ★ 増減要因の行。**棒を文字の後ろに敷いて**1行に収めています。
     ⚠ ラベルの下に棒を積む形（2段）に戻さないこと。7行あるので 1280×800 で
       節が画面に収まらなくなります（実測 838px / 画面 800px）。
     ★ report.html のコメントにある「中途半端な下線ではなく、セル全体に敷く比例バー」
       がこれです。 */
.fr{position:relative;border-radius:9px;overflow:hidden;padding:8px 12px;
    display:flex;justify-content:space-between;gap:14px;align-items:center;
    background:rgba(255,255,255,.035);margin-bottom:6px}
.fr .fill{position:absolute;inset:0 auto 0 0;border-radius:9px;opacity:.20}
.fr .nm{position:relative;font-size:13px;color:#e3e9f1;line-height:1.5;min-width:0}
.fr .vl{position:relative;font-weight:700;font-size:13px;white-space:nowrap}
.fr.other .nm{color:var(--muted)}
.bar .bt{height:9px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.bar .bf{height:100%;border-radius:5px}
.bar .bv{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:76px}

/* 大きな色つきの数字＋説明＋右端の小さなラベル */
.big{display:flex;gap:18px;align-items:center;border-radius:14px;padding:14px 18px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);margin-top:14px}
.big .n{font-size:clamp(26px,3vw,34px);font-weight:820;letter-spacing:-.03em;white-space:nowrap}
.big p{margin:0;font-size:13px;color:#c7d0dc;line-height:1.7;flex:1}
.big .tag{font-size:11.5px;color:var(--dim);white-space:nowrap}

/* 上位動画 */
.tv .cap{align-self:flex-start;font-size:11px;font-weight:750;letter-spacing:.09em;
  border:1px solid var(--line);border-radius:7px;padding:3px 9px;color:#c7d0dc;
  background:rgba(255,255,255,.05)}
/* ⚠ min-height は2行ぶん。無いと、題名が1行の動画だけ数字の位置が上がって
     3枚の頭がそろいません（2026-08-28 の実装確認で発見）。 */
.tv h3{margin:12px 0 10px;font-size:14.5px;font-weight:700;line-height:1.6;min-height:calc(14.5px * 1.6 * 2)}
.tv .v{font-size:clamp(24px,2.6vw,34px);font-weight:820;letter-spacing:-.03em}
.tv .s{font-size:12px;color:var(--muted);margin-top:3px}
.tv .mini{display:flex;gap:6px;align-items:flex-end;height:44px;margin-top:16px}
.tv .mini i{flex:1;border-radius:4px 4px 2px 2px;display:block}

/* まとめ */
.sum{display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015))}
.sum .no{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-weight:800;font-size:14px;background:rgba(255,255,255,.06);color:#c7d0dc}
.sum h3{margin:0 0 3px;font-size:15px;font-weight:700}
.sum p{margin:0;font-size:13px;color:#c1cbd8;line-height:1.75}
.sum .pill{flex:0 0 auto;font-size:12px;font-weight:700;border-radius:9px;padding:9px 20px}
.pill.fix{background:rgba(110,168,255,.16);color:#a9caff;border:1px solid rgba(110,168,255,.3)}
.pill.cont{background:rgba(243,199,104,.16);color:var(--amber);border:1px solid rgba(243,199,104,.32)}
/* NEXT CHECK: 上辺だけ色の細い罫 */
.nc{border:1px solid var(--line);border-top:2px solid var(--c,var(--amber));
  border-radius:0 0 12px 12px;padding:14px 16px;background:rgba(255,255,255,.03)}
.nc .k{font-size:10.5px;font-weight:750;letter-spacing:.11em;color:var(--dim)}
.nc h3{margin:6px 0 4px;font-size:14px;font-weight:700;line-height:1.5}
.nc p{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.pgfoot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin-top:26px;padding-top:14px;border-top:1px solid var(--line-2);
  font-size:11.5px;color:var(--dim);letter-spacing:.04em}

.stack{display:grid;gap:12px}
.mt{margin-top:16px} .mt2{margin-top:22px}
.err{max-width:640px;margin:16vh auto;padding:22px;border:1px solid var(--line);border-radius:16px}

/* ── 狭い画面 ─────────────────────────────
   ⚠ 900px 以下ではスクロール送りをやめて、ふつうの縦スクロールにします。
      スナップを残すと、中身が画面より高い節で下端が読めません。 */
@media (max-width:900px){
  html{scroll-snap-type:none}
  section{min-height:0;padding:40px 0;display:block}
  .inner{padding:0 18px}
  .g3,.g2,.g4{grid-template-columns:1fr}
  .rail,.keys{display:none}
  .big{flex-direction:column;align-items:flex-start;gap:8px}
  .sum{flex-wrap:wrap}
  .bar{--lw:104px}
}
/* ★ 1340px 以下（13インチのノートなど）では、節が1画面に収まらなくなります。
     ⚠ 数字を減らして詰めないこと。**余白だけ**を詰めます。
     実測: 02節 1280×800 で 774px（画面 800px）→ この指定で 720px 台に収まります。 */
@media (max-width:1340px) and (min-width:901px){
  .card{padding:17px}
  .bars{gap:7px}
  .big{padding:11px 14px;margin-top:11px}
  h1,h2{margin-bottom:18px}
  section{padding:44px 0}
}
/* ⚠⚠ この節は 1340px の指定より**後ろ**に置くこと。前に置くと section{padding:44px}
      に上書きされて、1024×768 で 02節が入りきりません（2026-08-28 に実際に起きた）。 */
@media (max-width:1100px) and (min-width:901px){
  .g4{grid-template-columns:repeat(2,1fr)}
  section{padding:26px 0}      /* 1024×768 で 02節が入りきらないため（実測 745px / 画面 728px） */
}
@media print{
  /* ⚠ この資料は紙用ではありません。誤って刷ったときに真っ黒にならないようにするだけの保険です。
       **A4の提出資料は report.html を使ってください。** */
  body{background:#fff;color:#111}
  .rail,.keys,.topline{display:none}
  section{min-height:0;padding:14px 0;display:block;break-inside:avoid}
  .card,.callout,.note,.big,.sum,.nc{background:#fff;border-color:#ccc;box-shadow:none}
  .kpi .blob{display:none}
}
</style>
</head>
<body>
<div class="topline"><span id="prog"></span></div>
<nav class="rail" id="rail" aria-label="ページ移動"></nav>
<div class="keys"><kbd>↑</kbd><kbd>↓</kbd> ページ移動</div>
<main id="app"><div class="err">読み込み中…</div></main>

<script>
/* ══════════════════════════════════════════════════════════════
   数字の作り方は report.html と同じにしてあります。
   ⚠⚠ **片方だけ直さないこと。**同じ週の同じ指標が2つの資料で食い違うと、
      どちらが正しいか誰にも分かりません（レビュー4回目で実際に問題になりました）。
   ══════════════════════════════════════════════════════════════ */
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtFull = n => (n==null?0:n).toLocaleString('ja-JP');
const fmtMan  = n => (n==null) ? '—' : (Math.abs(n)>=10000
                    ? (n/10000).toFixed(1).replace(/\.0$/,'')+'万'
                    : n.toLocaleString('ja-JP'));
const sign  = v => (v>=0?'+':'−')+Math.abs(v).toFixed(1)+'%';
const pctN  = (a,b)=> (b==null||!b) ? null : (a-b)/b*100;
const fmtDate = s => s ? s.replace(/-/g,'/') : '';
const md      = s => s ? String(s).slice(5).replace('-','/').replace(/^0/,'') : '';
const median  = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y), m=s.length>>1;
                       return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };

// YouTube Studio の表記に準拠。⚠ report.html の TRAFFIC_LABEL と同じ内容にすること
const TRAFFIC_LABEL = {
  'SUBSCRIBER':'ブラウジング機能','YT_SEARCH':'YouTube検索','SHORTS':'ショートフィード',
  'EXT_URL':'外部','NOTIFICATION':'通知','RELATED_VIDEO':'関連動画',
  'BROWSE':'ブラウジング機能','CHANNEL':'チャンネルページ','YT_CHANNEL':'チャンネルページ',
  'DIRECT':'直接入力','ADVERTISING':'広告','PLAYLIST':'再生リスト','END_SCREEN':'終了画面',
  'NO_LINK_EMBEDDED':'埋め込み','OTHER':'その他','ANNOTATION':'アノテーション',
  'CAMPAIGN_CARD':'プロモーション','SHORTS_CONTENT_LINKS':'ショート内リンク',
  'YT_OTHER_PAGE':'その他のYouTube機能','NO_LINK_OTHER':'直接入力または不明',
  'SOUND_PAGE':'音源ページ','HASHTAGS':'ハッシュタグ'
};
const SRC = st => TRAFFIC_LABEL[st] || st;

/* ── オーナー判断（report.html のレビュー5回目の実装と同じ規則） ──
   ⚠⚠ **未設定を「判断不要」の既定値にしないこと。**入力漏れが「オーナーのやることは無い」
      として提出される事故になります。 */
const GATE_RANK = {none:0, confirm:1, approve:2};
function ownerState(rep){
  const ai = rep.ai_analysis || {};
  const raw = (ai.owner_decision||'').trim();
  if(raw) return {level: /要承認/.test(raw) ? 'approve' : /要確認/.test(raw) ? 'confirm' : 'none', text: raw};
  const gates = (ai.suggestions||[]).map(s=>(s&&s.owner_gate)||'').filter(g=>g in GATE_RANK);
  if(gates.length){
    const lv = gates.reduce((a,b)=>GATE_RANK[b]>GATE_RANK[a]?b:a,'none');
    return {level:lv, derived:true,
      text: lv==='approve' ? 'アクションから集約しました。何を承認してほしいか・推奨案・費用または影響・期限を書いてください'
          : lv==='confirm' ? 'アクションから集約しました。確認事項を1つに絞って書いてください' : '判断不要'};
  }
  return {level:'unset', text:'未設定'};
}
const stripLv = t => String(t).replace(/^(判断不要|要確認|要承認)[｜|：:\s]*/,'');

/* ── 増減要因（report.html の causeSplit と同じ） ── */
function causeSplit(rep, views, viewsPrev){
  const all = (rep.top_videos||[]).map(v=>({t:v.title, pub:v.published_at||'',
                                            d:(v.views_week||0)-(v.views_prev_week||0)}));
  if(!all.length || viewsPrev==null) return null;
  const tot = views - viewsPrev;
  const restRaw = tot - all.reduce((s,x)=>s+x.d,0);
  const ups = all.filter(x=>x.d>0).sort((a,b)=>b.d-a.d);
  const dns = all.filter(x=>x.d<0).sort((a,b)=>a.d-b.d);
  const upOther = ups.slice(3).reduce((s,x)=>s+x.d,0) + Math.max(0, restRaw);
  const dnOther = dns.slice(3).reduce((s,x)=>s+x.d,0) + Math.min(0, restRaw);
  // ⚠ ここで {t,d} だけに絞らないこと。published_at が落ちて見出しが化けます
  //   （2026-08-28 に report.html で実際に起きました）。
  const upRows = ups.slice(0,3).map(x=>({...x}));
  const dnRows = dns.slice(0,3).map(x=>({...x}));
  if(upOther > 0) upRows.push({t:'その他の増加要因', d:upOther, other:true});
  if(dnOther < 0) dnRows.push({t:'その他の減少要因', d:dnOther, other:true});
  return {tot, upRows, dnRows,
          upSum: upRows.reduce((s,x)=>s+x.d,0),
          dnSum: dnRows.reduce((s,x)=>s+x.d,0),
          views, viewsPrev, top: ups[0]||null};
}

/* ── 流入（実数と順位。⚠ 構成比は出しません） ── */
function traffic(rep){
  const cur = (rep.traffic_sources||[]).slice().sort((a,b)=>b.views-a.views);
  const prv = (rep.traffic_sources_prev||[]).slice().sort((a,b)=>b.views-a.views);
  const pRank = {}, pVal = {};
  prv.forEach((t,i)=>{ pRank[t.source_type]=i+1; pVal[t.source_type]=t.views; });
  return cur.slice(0,5).map((t,i)=>({
    st:t.source_type, nm:SRC(t.source_type), now:t.views,
    prev: pVal[t.source_type] ?? null,
    rank:i+1, prank: pRank[t.source_type] ?? null
  }));
}

  + `<div class="nc" style="--c:${COLS[3]}"><div class="k">Next check 04</div>

  const s5 = sec('s5','05 · Weekly summary','今週の報告まとめ','', `
<div class="stack">
  <div class="sum"><div class="no">01</div><div style="flex:1"><h3>今週、確認できたこと</h3>
    <p>週間視聴は ${sign(dAll)}、新作の初速中央値は ${medD!=null?sign(medD):'—'}。${esc(TR[0].nm)}が最大の流入元になり、${esc(topName)}が増加要因の最大でした。</p></div>
    <div class="pill fix">確定</div></div>
  <div class="sum"><div class="no">02</div><div style="flex:1"><h3>現時点で未確定なこと</h3>
    <p>${esc(TR[0].nm)}の首位が続くか、${lo?'初速の低かった1本の原因、':''}クーポン入力と動画の関係は、<b>いまのデータでは確定できません。</b>いずれも1週では判断できないものです。</p></div>
    <div class="pill cont">継続確認</div></div>
</div>
<div class="g4 mt2">${nc}</div>
<div class="pgfoot">
  <span>CHANNEL DESK · LIGHTTHREE WEEKLY BRIEF</span>
  <span>Source: data.json（analytics_daily / video_daily / weekly_reports / coupon）</span>
</div>
<div class="note mt"><b>この資料について</b>　画面で読むための要約版です。<b>提出用の完全な資料と印刷（PDF）は <a href="report.html" style="color:var(--blue)">report.html</a> を使ってください。</b>数字はどちらも同じ data.json から作っています。</div>`);

  return s0+s1+s2+s3+s4+s5;
}

/* ══ 起動 ══════════════════════════════════════════════ */
function nav(){
  const secs=[...document.querySelectorAll('section')];
  document.getElementById('rail').innerHTML =
    secs.map(s=>`<a href="#${s.id}" aria-label="${s.id}"></a>`).join('');
  const dots=[...document.querySelectorAll('.rail a')];
  const upd=()=>{
    const y=window.scrollY, h=document.body.scrollHeight-innerHeight;
    document.getElementById('prog').style.width=(h>0?(y/h*100):0)+'%';
    let k=0; secs.forEach((s,i)=>{ if(s.offsetTop <= y+innerHeight*0.4) k=i; });
    dots.forEach((d,i)=>d.classList.toggle('on', i===k));
  };
  addEventListener('scroll', upd, {passive:true}); addEventListener('resize', upd); upd();
  // ↑↓ で節送り。⚠ 入力欄が無いページなので無条件で拾ってよい
  addEventListener('keydown', e=>{
    if(e.key!=='ArrowDown' && e.key!=='ArrowUp') return;
    e.preventDefault();
    const y=window.scrollY+ (e.key==='ArrowDown'?4:-4);
    const t = e.key==='ArrowDown' ? secs.find(s=>s.offsetTop>y)
                                  : [...secs].reverse().find(s=>s.offsetTop<y-10);
    (t||secs[e.key==='ArrowDown'?secs.length-1:0]).scrollIntoView({behavior:'smooth'});
  });
}

fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d; COUPON=d.coupon||null;
  const weeks=(d.weekly_reports||[]).slice().sort((a,b)=>a.week_start<b.week_start?1:-1);
  const want=new URLSearchParams(location.search).get('w');
  const rep = want ? weeks.find(w=>w.week_start===want) : (weeks.find(w=>w.final && w.ai_analysis) || weeks[0]);
  if(!rep){ document.getElementById('app').innerHTML='<div class="err">週次データが見つかりません。</div>'; return; }
  const i = weeks.indexOf(rep);
  document.getElementById('app').innerHTML = render(rep, weeks[i+1]||null);
  document.title = `週次ブリーフ ${rep.week_start}〜${rep.week_end}｜CHANNEL DESK`;
  nav();
}).catch(e=>{
  document.getElementById('app').innerHTML =
    `<div class="err"><b>data.json を読めませんでした。</b><div class="foot">${esc(e.message)}</div></div>`;
});
</script>
